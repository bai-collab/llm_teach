<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>AI 協作群島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：3D 群島佔滿畫面；左上 HUD、右上按鈕、中下互動提示、右側（手機為下方）資料卡；黑板外觀 */
:root{
  --board:#23392f; --board-deep:#1a2b23; --chalk:#efe9d8; --chalk-dim:#a9b3a6;
  --yellow:#f2c14e; --orange:#e8875b; --blue:#7fb6d9; --green:#8fd18a; --red:#e66a5c;
  --font-chalk:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--board-deep);color:var(--chalk);font-family:var(--font-body);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:rgba(26,43,35,.86);border:1.5px solid rgba(239,233,216,.25);border-radius:12px;backdrop-filter:blur(4px)}
#hud{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px;display:flex;flex-direction:column;gap:4px;max-width:min(320px,60vw)}
#hud .t{font-family:var(--font-chalk);font-size:1.15rem;color:var(--yellow)}
#hud .s{font-size:.85rem;color:var(--chalk-dim)}
#badges{display:flex;gap:6px;margin-top:2px}
.bd{width:26px;height:26px;border-radius:50%;border:2px dashed var(--chalk-dim);display:grid;place-items:center;font-size:.8rem;color:var(--chalk-dim)}
.bd.on{border:2px solid var(--yellow);color:var(--board-deep);background:var(--yellow)}
#tools{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
button{font:inherit;color:var(--chalk);background:rgba(26,43,35,.86);border:1.5px solid rgba(239,233,216,.35);border-radius:999px;padding:.45em 1em;cursor:pointer}
button:hover{border-color:var(--yellow);color:var(--yellow)}
button:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
button.primary{border-color:var(--yellow);color:var(--yellow)}
#prompt{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 18px;font-family:var(--font-chalk);font-size:1.1rem;white-space:nowrap}
#prompt b{color:var(--yellow)}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 18px;font-family:var(--font-chalk);font-size:1.05rem;max-width:min(560px,84vw);text-align:center}
#panel{position:fixed;right:0;top:0;bottom:0;width:min(440px,42vw);padding:calc(20px + env(safe-area-inset-top,0px)) 22px 22px;box-sizing:border-box;overflow-y:auto;border-radius:16px 0 0 16px;display:flex;flex-direction:column;gap:12px}
#panel h2{font-family:var(--font-chalk);font-size:1.6rem;margin:0;color:var(--yellow);text-wrap:balance}
#panel .kind{font-size:.8rem;color:var(--chalk-dim);letter-spacing:.05em}
#panel p{margin:0;line-height:1.7}
#panel .ex{border-left:3px solid var(--yellow);padding-left:10px;color:var(--chalk-dim)}
#panel .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
#panel a.btn{color:var(--board-deep);background:var(--yellow);border-radius:999px;padding:.45em 1.1em;text-decoration:none;font-weight:700}
#list{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,18,14,.6);padding:16px}
#list .box{width:min(640px,100%);max-height:86vh;overflow-y:auto;padding:22px;box-sizing:border-box}
#list h2{font-family:var(--font-chalk);margin:0 0 6px}
#list h3{font-family:var(--font-chalk);color:var(--yellow);margin:16px 0 6px;font-size:1.15rem}
#list ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#list li{display:flex;justify-content:space-between;gap:10px;align-items:center}
#list a{color:var(--chalk)}
#list .st{font-size:.82rem;color:var(--chalk-dim);white-space:nowrap}
#intro{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,18,14,.7);padding:16px}
#intro .box{width:min(560px,100%);padding:26px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
#intro h1{font-family:var(--font-chalk);margin:0;font-size:2rem;color:var(--yellow)}
#intro p{margin:0;line-height:1.7}
#intro kbd{border:1px solid var(--chalk-dim);border-radius:5px;padding:0 6px;font-family:var(--font-body)}
#stick{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px solid rgba(239,233,216,.35);background:rgba(26,43,35,.5);touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(242,193,78,.75)}
#act{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;font-family:var(--font-chalk);font-size:1.1rem}
@media (max-width:700px){
  #panel{left:0;right:0;top:auto;width:auto;max-height:62vh;border-radius:16px 16px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  #hud{max-width:58vw}
  #panel.compact{max-height:40vh}
  #toast{top:calc(118px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="scene" tabindex="-1" aria-label="AI 協作群島 3D 地圖"></canvas>

<div id="hud" class="glass" role="status" aria-live="polite">
  <div class="t" id="hudIsland">第一島：認識 AI 協作</div>

</div>

<div id="intro" role="dialog" aria-modal="true" aria-labelledby="introTitle">

    <h1 id="introTitle">AI 協作群島</h1>
    <p>你是這座群島的導演。四座小島對應四個單元；走到發光的講台或小幫手旁邊就能查看。完成一座島的任務，通往下一座島的橋就會亮起來。</p>
    <p>操作：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向鍵移動，<kbd>E</kbd> 或空白鍵查看；手機用左下搖桿和右下按鈕。</p>
    <p style="color:var(--chalk-dim);font-size:.9rem">四座島都開放了；完成一座島，下一座的橋才會亮。第一島西邊的橋通往 Skill 圖書館，隨時都能去查 skill。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="primary" id="btnStart">開始探索</button><button type="button" id="btnReset">重新開始進度</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== 內容（地圖清單、講台與小幫手共用）=====
const SITE='https://bai-collab.github.io/llm_teach/';
const GH='https://github.com/bai-collab/llm_teach/blob/main/lessons/';
const STATIONS=[
  {id:'s1a',island:1,pos:[-18,-14],kind:'動畫',title:'老師當導演',text:'AI 不是替你做事，而是你當導演、AI 當小幫手。這支動畫走一遍跟 AI 一起備課的流程。',url:SITE+'animations/teacher-as-director/'},
  {id:'s1b',island:1,pos:[2,-22],kind:'動畫',title:'教師儀表板導覽',text:'找學生、看作答時間軸，按下送出才請 AI 分析；回答附引用，老師核對後再採用。',url:SITE+'animations/teacher-dashboard/'},
  {id:'s1c',island:1,pos:[20,-14],kind:'動畫',title:'闖關教材製作',text:'用 Claude Code 把課本單元做成 2D＋3D 闖關：先出規格、老師核准、再驗收。',url:SITE+'animations/quest-material/'},
  {id:'s2a',island:2,pos:[66,10],kind:'講義',title:'01 什麼是 Harness',text:'模型外面那一層：上下文、工具、護欄、狀態、驗證。',url:GH+'01-what-is-a-harness.md'},
  {id:'s2b',island:2,pos:[96,18],kind:'動畫',title:'為什麼要換家審查',text:'答案地形、局部解與盲點。你現在腳下就是那片地形！',url:SITE+'animations/review-landscape/'},
  {id:'s3a',island:3,pos:[84,118],kind:'動畫',title:'本工作區的 Harness',text:'十段動畫走一遍：分類、翻筆記、路線圖、老師核准、派工、驗證、記錄與交接。',url:SITE+'animations/harness-tour/'},
  {id:'s3b',island:3,pos:[96,123],kind:'講義',title:'02 本機 Harness',text:'Adaptive Loop、Route Plan、三個執行者分工與驗證預算。',url:GH+'02-local-harness-adaptive-loop.md'},
  {id:'s3c',island:3,pos:[108,123],kind:'講義',title:'03 eduHarness Skill',text:'Skill 套件怎麼讓同一種工作可以重複、可以驗證。',url:GH+'03-eduharness-skills-workflow.md'},
  {id:'s3d',island:3,pos:[119,116],kind:'講義',title:'04 eduHarness_Nooa',text:'雲端版與 Registry v3 雙層治理。',url:GH+'04-eduharness-nooa-cloud-registry-v3.md'},
  {id:'s4a',island:4,pos:[-12,118],kind:'講義',title:'05 Claude Code Mod Hook',text:'Hook 在事件管線中插入檢查：收到事件、決定要不要改、再交給下一步。',url:GH+'05-claude-code-mod-hook-flow.md'},
  {id:'s4b',island:4,pos:[12,118],kind:'講義',title:'06 延伸專案',text:'瀏覽器端模型、教師工作台等可以拿來當課堂案例的專案。',url:GH+'06-related-llm-projects.md'},
  {id:'s2c',island:2,pos:[128,-14],kind:'講義',title:'07 AI Agent 架構',text:'Harness → Agent → 核心循環 → Hooks。',url:GH+'07-ai-agent-architecture-v4-1.md'}
];
const ROLES=[
  {id:'r1',name:'加快速度',color:0xf2c14e,line:'我負責把你已經想好的事做快一點。',ex:'例：十分鐘排好兩節課的流程草稿。'},
  {id:'r2',name:'協助發想',color:0xe8875b,line:'我會四處找資料，一次丟出很多點子。',ex:'例：一次想出二十種倍數單元的引起動機，你來挑。'},
  {id:'r3',name:'協助分析',color:0x8fd18a,line:'雜亂的資料交給我，我整理出脈絡。',ex:'例：把書單、學習單、週次表排成一張路網圖。'},
  {id:'r4',name:'協助批判',color:0xe66a5c,line:'我專門挑毛病、找反例。',ex:'例：指出評量題超出五年級的先備知識。'},
  {id:'r5',name:'協助整理',color:0x7fb6d9,line:'會議紀錄、筆記丟給我，我變成清楚的清單。',ex:'例：把教學會議紀錄整理成待辦清單。'}
];
const NPC2=[
  {id:'n1',pos:[84,8],color:0xe8875b,name:'作者 AI',line:'我覺得這裡就是最好的答案了，四周都是上坡啊。'},
  {id:'n2',pos:[86,1],color:0xf3b08a,name:'同家族審查者',line:'我也這麼覺得，沒問題！（我們的想法本來就很像。）'},
  {id:'n4',pos:[100,80],color:0xe8875b,name:'流程導覽員',line:'這座島的石板寫著 Harness 的六個步驟，但被打亂了。照正確順序踩亮它們，路線圖就會連起來！'},
  {id:'n3',pos:[103,-12],color:0x7fb6d9,name:'另一家審查者',line:'我從另一邊看過來：山脊東邊還有更低的地方喔，翻過去看看！'}
];
const ISLANDS=[
  {n:1,name:'第一島：認識 AI 協作',task:'和五個 AI 小幫手說話'},
  {n:2,name:'第二島：為什麼要這樣管 AI',task:'走到最深的谷，插旗的地方'},
  {n:3,name:'第三島：本工作區怎麼做',task:'依正確順序踩亮六塊石板'},
  {n:4,name:'第四島：動手改造工具',task:'在 Hook 閘門前決定放行或擋下'},
  {n:5,name:'第五島：Skill 圖書館',task:'找館員，選一個目的'}
];
// ===== 進度（只存在這台瀏覽器）=====
const KEY='aiIslands.v1';
let S={talked:[],visited:[],badges:[]};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object'){const arr=a=>Array.isArray(a)?a.filter(x=>typeof x==='string'):[];S={talked:arr(v.talked),visited:arr(v.visited),badges:arr(v.badges)}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const has=(arr,id)=>S[arr].includes(id);

const LIB={"CATS":{"teach":["教案與評量",15909198],"game":["闖關與遊戲",15239003],"art":["美術與 3D",8369881],"write":["寫作與協作",9425290],"tool":["解說與工具",15100508]},"SK":[{"id":"document-to-markdown-ingestion","name":"AI 文件 Markdown 轉換","cat":"tool","sum":"先把 PDF、Word、簡報轉成 Markdown 再讓 AI 讀，讀得準、也比較省；要核對版面或格式時才看原檔。","when":"讀課本、手冊、會議資料之前","text":"---\nname: document-to-markdown-ingestion\ndescription: Convert supported source documents to Markdown before the model reads, summarizes, searches, extracts, compares, or reviews their content. Use for content-focused ingestion of DOCX, PDF, PPTX, XLSX, XLS, MSG, HTML, CSV, JSON, XML, EPUB, or IPYNB files. Do not convert when the request concerns formatting, layout, typography, margins, pagination, visual placement, rendering, or format compliance; inspect the original file instead.\n---\n# AI 文件 Markdown 轉換\n\n這是一個工具型 Supporting Skill，負責把「內容閱讀」與「版面檢查」分流，不替使用者判斷文件內容，也不把轉換結果當成版面正確性的證明。\n\n## Classify first\n\n| Intent | Required path |\n|---|---|\n| 閱讀、摘要、搜尋、擷取、比較、翻譯或檢查論點 | 先轉 Markdown |\n| 檢查版面、字型、邊界、分頁、行距、圖表位置、渲染或官方格式 | 不轉換，檢查原始檔 |\n| 內容＋格式混合要求 | 格式例外優先，不對該檔案執行 MarkItDown |\n| 已是 Markdown 或原始碼 | 直接讀取，不需要轉換 |\n\n需求不清楚時，依使用者真正想驗證的結果分類，不只看副檔名。\n\n## Content ingestion workflow\n\n1. 確認輸入不是 secret、credential、token、key、auth export 或不相關私人檔案。\n2. 先執行 wrapper 的 plan-only 模式並檢查 `INGESTION_PLAN`。\n3. 確認輸入、副檔名、固定版本、相對 cache 與相對輸出位置。\n4. 只有在內容轉換確實適用時，才加上 `-Execute`。\n5. 後續內容分析優先讀產生的 Markdown；同一份未變更來源不要反覆轉換。\n6. 若表格、公式、圖片、掃描或擷取缺漏會影響結論，再回看原始檔相關頁面。Markdown 是文字讀取的主要前處理產物，不是視覺正確性的證據。\n\n```powershell\npwsh -File brain/skills/document-to-markdown-ingestion/scripts/convert-document.ps1 `\n  -WorkspaceRoot . `\n  -Purpose Content `\n  -InputPath \u003csource-file>\n\npwsh -File brain/skills/document-to-markdown-ingestion/scripts/convert-document.ps1 `\n  -WorkspaceRoot . `\n  -Purpose Content `\n  -InputPath \u003csource-file> `\n  -Execute\n```\n\n`WorkspaceRoot`、cache 與 output 都以 repository-relative path 為優先；實際根目錄由 Harness 的 Runtime Context 或 `HARNESS_ROOT` 決定，不寫死磁碟代號。\n\n## Format exception\n\n格式或視覺審查可把 wrapper 當 guard check：\n\n```powershell\npwsh -File brain/skills/document-to-markdown-ingestion/scripts/convert-document.ps1 `\n  -WorkspaceRoot . `\n  -Purpose Format `\n  -InputPath \u003csource-file>\n```\n\n必要結果是 `FORMAT_REVIEW_ORIGINAL_REQUIRED`；之後交給檔案類型對應的 formatter／renderer Skill。不可用轉換後 Markdown 證明頁面級正確性。\n\n## Tool boundary\n\n- MarkItDown 版本固定為 `0.1.6`，只使用必要的 format extra。\n- cache 預設為 `scratch/cache/markitdown`，output 預設為 `outputs/document-ingestion`。\n- 使用 `uvx` isolated run；不執行 `uv tool install`、`pip install`、全域 PATH 修改或專案依賴安裝。\n- source 不覆寫；output 必須是新的 `.md`。\n- `uvx` 不存在、輸入不合法或輸出越界時，回報 deferred／blocked，由 Route Plan 決定 fallback；不自行改用未知工具。\n\n## Report\n\n記錄來源路徑、來源 metadata、輸出路徑、converter version、是否需要回看原始檔與限制。轉換只能報告為 preprocessing，不是格式保真證明。\n"},{"id":"lesson-plan-authoring","name":"教案撰寫","cat":"teach","sum":"依課綱、學生、節數、科技與評量條件寫教案，讓學習目標、活動與評量彼此對齊。","when":"要寫一份新教案時","text":"---\nname: lesson-plan-authoring\ndescription: Author Taiwan-context lesson plans from supplied curriculum, learner, time, technology, assessment, and source constraints. Use for 教案撰寫, lesson plan authoring, or requests to align objectives, activities, and assessment. Do not use for differentiating an existing lesson, assessment item banking, or game design.\n---\n# 教案撰寫\n\n## 定位\n\n把已提供或已核准的課程脈絡轉為「目標—活動—差異化—評量」對齊的教案草稿。可以採用使用者指定的模板，但不把未知的年度格式當成既定事實。\n\n## 觸發與反觸發\n\n- 觸發：`教案撰寫`、`lesson plan`、教學活動設計、教案草稿。\n- 不觸發：已有教案的分層差異化（改用 `lesson-differentiation`）、題庫命題（改用 `item-authoring`）、教材轉遊戲。\n- 缺少學段、科目、節數、目標、教材、設備或評量時，先回報缺件，不自行補齊。\n\n## 必要輸入\n\n學段／年級、科目、節數、先備知識、教材範圍、核心素養／學習目標、可用設備、學習者差異、評量目的（形成性／總結性）、評量方式與限制、交付格式與來源。\n\n## 課綱知識庫來源與查詢契約\n\n教案中的「學習表現、學習內容」優先取自本機課綱鏡像；使用者另外提供的課綱檔案或年度文件優先於鏡像，兩者不一致時列出差異請使用者裁決。\n\n### 來源\n\n- 鏡像：`references/tw-curriculum-108/mirror/`（十二年國教課綱總綱與 10 個領域，含國小科技參考說明），來源釘選與限制見 `references/tw-curriculum-108/PROVENANCE.md`。\n- 索引：`references/tw-curriculum-108/code-index.json`（自動產生，代碼 → 領域、學習階段、`file:line`）。\n- 授權狀態「推定可用、待確認」；正式送件或對外發布時，在來源 ledger 註明並建議回教育部原始 PDF 核對。\n- 學習階段：Ⅰ＝國小一至二年級、Ⅱ＝三至四年級、Ⅲ＝五至六年級、Ⅳ＝國中、Ⅴ＝高中。數學學習內容用年級碼（例如 `N-3-1`＝三年級）。\n\n### 查詢步驟\n\n1. 依「領域＋年級（或學習階段）」列出候選，可加關鍵詞與種類：\n   `node harness/scripts/tw-curriculum/lookup.mjs --domain \u003c領域> --grade \u003c年級> [--kind performance|content] [--q \u003c關鍵詞>]`\n   （`--domains` 列出可用領域名稱；`--json` 取機器可讀輸出。）\n2. 對每個選用的代碼讀原文前後文再定案：\n   `node harness/scripts/tw-curriculum/lookup.mjs --domain \u003c領域> --code \u003c代碼> --context 8`\n   查詢結果只是定位；標示「需讀前後文」或位於表格碎片時，從前後文拼出完整原文（表格條目的標題列常在代碼上方數行，例如數學 `N-3-4` 的「除法：除法的意義與應用。」在代碼上方 5 行），拼不出就標 `⏳ 待確認`。拼接而成的原文要在來源欄註明「表格拼接」與起訖行號。\n3. 只有跨領域、總綱核心素養、議題融入或來源衝突時，才加查第二領域或閱讀 `00_總綱.md`（總綱沒有學習重點代碼，需直接讀檔）。\n4. 查無條目、年段對不上、原文不完整或版本不明時，標記 `⏳ 待確認`；不得用模型常識補寫成課綱內容，也不得把教材內容反向冒充課綱條目。\n\n### 引用規則\n\n- 學習表現、學習內容：保留代碼與原文；只取部分意涵時，分開寫「課綱原文」與「本課聚焦」。代碼的學習階段必須與本課年級相符，跨階段引用要寫明理由。\n- 學習目標是教案層級的轉化結果，不是課綱原文；每個學習目標至少回溯到一項已確認的學習表現或學習內容。\n- `standards-alignment.md` 每列至少包含：領域、學習階段／年級、代碼、課綱原文、來源 `references/tw-curriculum-108/mirror/\u003c檔名>:\u003c行號>`、來源 commit（前 7 碼即可）、由其轉化的本課學習目標。\n\n## 執行流程\n\n1. 建立 `context-brief.md` 與來源／版本 ledger；依「課綱知識庫來源與查詢契約」查出候選學習表現與學習內容，記入 ledger。\n2. 將學習目標拆成可觀察表現，建立 objective–activity–assessment matrix，並寫好 `standards-alignment.md` 的課綱回溯欄位。\n3. 依學習者差異設計 universal access、分層支援與補救／延伸；有證據才納入迷思概念與鷹架，沒有證據就標記待確認。\n4. 設計形成性／總結性評量、評量規準、成功條件、可及性調整與各 tier 的 assessment alignment；核心目標與評量標準不得因支援層級而降低。\n5. 設計 lesson flow、教材資源與教師／學生操作步驟。\n6. 產出草稿後，依 Route Plan 的 verifier policy 檢查目標—活動—差異化—評量對齊、證據與過度主張；格式要求另交文件處理 Skill。\n\n## 輸出契約\n\n輸出 `context-brief.md`、`standards-alignment.md`、`objective-activity-assessment-matrix.md`、`differentiation-plan.md`、`assessment-design.md`、`assessment-rubric.md`、`differentiation-assessment-alignment.md`、`lesson-flow.md`、`materials-and-resources.md`、`lesson-plan-draft.md`、`review-report.md` 與下一步核准清單。\n\n## 停止規則\n\n- 無來源、目標、學習者差異或評量目的／方式時，只輸出 `intake-gap.md`，不生成完整教案。\n- 引用的課綱代碼查不到、原文無法從鏡像確認，或學習階段與年級不符而未說明理由時，該列標 `⏳ 待確認`，不得當成已確認的課綱對齊交付。\n- 差異化支援缺少學科證據時，標記待確認或 deferred，不把模型推測當成迷思概念或教學定論。\n- 差異化後評量無法對應核心目標、成功條件或公平性時，阻擋交付。\n- 未指定年度／地方模板時，輸出 generic draft 並標示待確認，不冒充官方格式。\n- 涉及學生個資、外部發布、付費工具或正式送件時，先交給 User Authority。\n- 若使用者提供的是既有教案，轉交 `lesson-differentiation`，不可誤當新建教案。\n\n## Harness 整合\n\n- 本 Skill 是 Primary Skill；由 Skill Registry 與 Route Plan 決定是否載入。\n- `reasoning-kernel` 只在需要比較假設、處理衝突或設計查證時作為 Supporting Skill，不覆蓋本 Skill 的輸出契約。\n- 文件內容閱讀可依 Registry 條件載入 `document-to-markdown-ingestion`；格式與版面要求仍以原始檔檢查為主。\n- 所有輸出位置由 Runtime Context 提供，使用 repository-relative path；本 Skill 不寫死磁碟代號或使用者目錄。\n- 不自動安裝 provider、Plugin、MCP 或外部 runtime。\n"},{"id":"digital-learning-lesson-plan","name":"數位學習精進教案","cat":"teach","sum":"數位學習精進教案：先選定送件格式，再寫平台證據、師生操作、學習證據、隱私說明與備案。","when":"要送數位學習精進計畫時","text":"---\nname: digital-learning-lesson-plan\ndescription: Prepare Taiwan digital-learning improvement lesson plans with a selected submission profile, platform evidence, teacher-student operation matrix, learning evidence, privacy disclosure, and fallback. Use for 數位學習精進教案, digital learning improvement plan, or requests tied to a current education submission format. Do not apply an old or unspecified annual template as fact.\n---\n# 數位學習精進教案\n\n## 定位\n\n把教案內容包裝成可追溯的數位學習精進計畫草稿；profile、年度、地方徵件或使用者模板不同時，保留差異，不混用欄位。\n\n## 預選交付格式\n\n未指定其他 profile 時，預設採用 `assets/moe-digital-teaching-plan-format.md`（教育部「中小學數位教學指引—數位學習教學方案設計格式」基準骨架）作為交付格式，涵蓋基本資訊、核心／數位素養、議題融入、教學活動設計、數位教學教案檢核表與鷹架表。此為穩定的部頒指引基準，非特定年度地方徵件；使用者若指定當年度或地方徵件模板則改用其格式，且徵件差異仍須確認來源與日期，不宣稱符合特定年度徵件。\n\n## 觸發與反觸發\n\n- 觸發：`數位精進計畫教案`、`數位學習精進教案`、數位學習計畫／徵件格式。\n- 預設 profile 為教育部指引基準骨架（見「預選交付格式」）；使用者未另指定時即採用，指定當年度徵件、地方模板或使用者模板時改用其格式並保留差異。\n- 若 profile、年度、平台、學習證據或 AI／個資揭露不明，先啟動「提示詞優化」並回報缺件。\n\n## 必要輸入\n\n既有教案或課程脈絡、學段／科目／節數、學習目標、數位平台、教師／學生操作、設備與網路條件、評量與學習證據、profile 來源與日期、隱私／AI 揭露需求。\n\n## 課綱條目\n\n格式中的核心素養、學習表現、學習內容欄位，依 `lesson-plan-authoring` 的「課綱知識庫來源與查詢契約」查詢本機鏡像 `references/tw-curriculum-108/`（`node harness/scripts/tw-curriculum/lookup.mjs`），保留代碼、原文與 `file:line` 來源；查不到或原文無法確認時填 `⏳ 待確認`，不自行補寫。\n\n## 執行流程\n\n1. 建立 `submission-profile.md` 與 `platform-evidence-ledger.md`，記錄來源版本與適用年度；未指定其他 profile 時，`submission-profile.md` 預設綁定 `assets/moe-digital-teaching-plan-format.md` 並以其欄位為交付骨架。\n2. 建立 `digital-strategy-map.md`、`teacher-student-operation-matrix.md` 與 `learning-evidence-plan.md`。\n3. 對齊目標、活動、平台操作、評量、無網路 fallback 與教師審查。\n4. 產出 generic 或 profile-specific draft；格式與年度證據不足時標示 pending。\n\n## 輸出契約\n\n沿用 `lesson-plan-authoring` 的對齊輸出，增加 `submission-profile.md`、`platform-evidence-ledger.md`、`digital-strategy-map.md`、`teacher-student-operation-matrix.md`、`learning-evidence-plan.md`、`privacy-ai-disclosure.md` 與格式差異報告。\n\n## 停止規則\n\n- 未確認 profile／年度／來源時，不套用舊格式，不宣稱符合當年度徵件。\n- 平台功能、版本、個資或 AI 使用缺少證據時，輸出待確認欄位。\n- 正式送件、外部上傳或學生個資處理需使用者核准。\n- provider、MCP、bridge 或 runtime 不可用時，保留 deferred，不假造平台結果。\n\n## 工作區邊界\n\n一般文件內容先走 MarkItDown；格式／版面審查依原始檔例外。不得安裝工具、寫入 凍結的舊工作區 或輸出未授權資料。\n"},{"id":"lesson-differentiation","name":"教案差異化教學","cat":"teach","sum":"以既有教案為底，替不同程度的學生分層支持，核心目標與標準不變。","when":"教案寫好、要照顧學生差異時","text":"---\nname: lesson-differentiation\ndescription: Differentiate an existing lesson or explicitly supplied lesson source into supported tiers while preserving the core learning objective, task, and standard. Use for 教案差異化, lesson differentiation, tiered support, remediation, extension, or adapting an existing lesson for learner differences. Do not use for authoring a new lesson without a source lesson.\n---\n# 教案差異化教學\n\n## 定位\n\n在既有教案或明確來源上設計分層支援、補救與延伸；不重新發明核心目標，也不把「新建教案」誤路由為差異化。\n\n## 觸發與反觸發\n\n- 觸發：`教案差異化`、`教案差異化教學`、lesson differentiation、分層教學、補救／延伸活動。\n- 必須有既有教案、課程來源或使用者明確指定的 lesson draft。\n- 沒有來源 lesson 時，轉交 `lesson-plan-authoring` 或啟動「提示詞優化」列缺件，不猜測原始目標。\n\n## 必要輸入\n\n既有 lesson、科目、核心目標與評量、學習者差異／先備、分層數量、可用時間／設備、語言／可及性需求、補救與延伸限制。\n\n差異化分析最低必須產出三個分析面向：\n\n- 學科迷思概念：學生可能持有的錯誤概念、正確概念、來源證據與教學回應。\n- 易錯概念：容易出錯的步驟／表徵／術語、觸發條件、預防性檢核與 exit ticket。\n- 鷹架理論：採用的鷹架理論、由強到弱的支援層級、每個 tier 的支援對應與撤除條件。\n\n若來源沒有足夠證據，不得自行補成學科事實；改列待確認、intake-gap 或 deferred，並保留 evidence reference。\n\n## 課綱條目\n\n來源 lesson 已標示的學習表現、學習內容代碼，是不可降低的核心標準：各 tier 都要保留同一組代碼的對應，不得在 below tier 刪除或換成較低學習階段的代碼。需要核對代碼原文或補查時，依 `lesson-plan-authoring` 的「課綱知識庫來源與查詢契約」查詢本機鏡像 `references/tw-curriculum-108/`（`node harness/scripts/tw-curriculum/lookup.mjs`）；補救可引用前一學習階段的條目作為先備依據，但要標明是先備、不是本課目標。\n\n## 執行流程\n\n1. 讀取來源 lesson，鎖定核心目標、任務、評量與不可降低的標準。\n2. 建立 learner-profile 與 differentiation matrix，分別設計 access support、補救與延伸。\n3. 建立 concept-risk-register，分開記錄學科迷思概念與易錯概念；每項都要有 evidence、錯誤／迷思描述、教學回應與可觀察 look-for。\n4. 明示鷹架理論與支援退場路徑，將示範、提示、部分完成範例、同儕／工具支援與獨立作答對應到各 tier；不得把鷹架當成降低核心標準。\n5. 保持核心概念與評量對齊；below tier 只能增加支援，不得默默降低學習標準。\n6. 以 `verifier` 檢查每層的目標、活動、語言、可及性、迷思／易錯概念回應、鷹架撤除條件與評量映射。\n\n## 輸出契約\n\n輸出 `source-lesson-summary.md`、`learner-profile.md`、`differentiation-matrix.md`、`subject-misconception-analysis.md`、`error-prone-concept-analysis.md`、`scaffolding-theory-rationale.md`、`tier-support-plan.md`、`remediation-plan.md`、`extension-plan.md`、`assessment-alignment.md`、`artifact-alignment-report.md`、`teacher-implementation-notes.md` 與 review brief。\n\n## 停止規則\n\n- 無來源 lesson、核心目標或評量時，只輸出缺件報告。\n- 學科迷思、易錯概念或鷹架理論沒有來源證據時，不得把模型推測寫成定論；只輸出待確認分析與缺件報告。\n- 差異化方案會改變核心標準、評量公平性、學生個資或正式資格判定時，停在教師／使用者審查。\n- 美國 Knowledge Graph、MCP provider、provider-owned rubric 與外部課綱只可作參考索引；不得呼叫、安裝、上傳資料或當成臺灣官方規則。\n- 不安裝工具、不呼叫未核准 provider、不寫入 凍結的舊工作區。\n\n## 工作區邊界\n\n文件內容閱讀遵循 MarkItDown；格式／版面審查一律保留原始檔例外。提示詞缺口先交 `prompt-optimization`，不靜默改變原教案。\n"},{"id":"item-authoring","name":"試題命題","cat":"teach","sum":"依指標與來源命題，每題附答案、解析與人工審查欄位，可整理成題庫。","when":"要出評量題或建題庫時","text":"---\nname: item-authoring\ndescription: Create and review digital-learning assessment items with indicator, source, coverage, item-type, answer, rationale, and human-review contracts. Use for 試題命題, 命題, item authoring, item bank creation, or requests to turn a supplied curriculum source into an item bank. Do not use for generic lesson plans, game design, or unsupported official-policy claims.\n---\n# 試題命題\n\n## 定位\n\n將使用者提供的課綱、教學材料或已核准來源轉為可審查的數位學習題目規格；本 skill 只產生草稿與證據清單，不宣稱地方規範或題庫已通過正式審查。\n\n## 觸發與反觸發\n\n- 觸發：`試題命題`、`命題`、指定題數／題型／指標的命題請求。\n- 不觸發：一般教案、教材轉遊戲、教案差異化；這些請路由到對應 workflow。\n- 若目標、學段、科目、題數、題型、指標或來源不足以改變結果，先啟動「提示詞優化」並列出最小缺件；不得猜測。\n\n## 必要輸入\n\n學段、科目、教材／來源、題數、題型、學習指標範圍、難度、答案格式、使用語言與人工審查需求。來源需標記 `user-supplied`、`official`、`reference` 或 `unknown`。\n\n## 執行流程\n\n1. 建立 intake 與來源 ledger，記錄 URI／檔名、日期、版本、授權與證據狀態。\n2. 對齊指標、認知層次、題型、正確答案、干擾項、解析與難度；重複題與自相矛盾題先標記。\n3. 產生 coverage matrix、item blueprint 與 item-bank draft；每題保留來源定位與人工覆核欄位。\n4. 產出後以清單逐欄檢查欄位完整性與 coverage；如環境有獨立審查者（fresh reviewer），交付其做新鮮脈絡的內容檢查。\n\n## 輸出契約\n\n至少輸出 `intake-gap.md`（有缺件時）、`indicator-checklist.md`、`source-ledger.md`、`coverage-matrix.md`、`item-blueprint.md`、`item-bank-draft.md`、`review-report.md` 與 `human-review-brief.md`。\n\n## 停止規則\n\n- 缺少學段、科目、來源或指標時，停止正式命題，只輸出缺件報告。\n- 沒有官方證據時，不把工作坊／模型建議標為官方規範。\n- 涉及學生個資、未授權題庫、外部發布或正式評量時，停在使用者核准閘門。\n- 模型或工具不可用時如實回報 `unavailable`，不自動改派。\n\n## 工作區邊界\n\n不得安裝套件、不得讀取 secrets、不得覆寫使用者來源檔；所有輸出寫入使用者指定的輸出目錄。\n"},{"id":"conjecturing-five-stage","name":"臆測五階段","cat":"teach","sum":"把數學單元改成臆測五階段：造例、提出猜想、效化、一般化、證實；附造例卡、猜想池、反例與評量規準。","when":"想讓學生自己發現數學性質時","text":"---\nname: conjecturing-five-stage\ndescription: Convert a supplied mathematics unit into 林碧珍-model five-stage conjecturing lesson plans (造例 → 提出猜想 → 效化 → 一般化 → 證實), with a verified textbook-fact ledger, heterogeneous example-construction cards, a conjecture pool containing non-always-true and erroneous conjectures, counterexample sets, worksheets, assessment rubrics, and a scaffolding-vs-answer-giving criterion. Use for 臆測五階段, 臆測教學, 臆測任務, conjecturing teaching, or requests to redesign a textbook unit so students produce the mathematical property themselves instead of receiving it. Do not use for ordinary lesson authoring without conjecturing (use lesson-plan-authoring), for differentiating an existing lesson (use lesson-differentiation), or for item banking.\n---\n# 臆測五階段\n\n## 定位\n\n把**已提供的數學單元教材**改寫成林碧珍臆測教學模式的教案：學生自己造例、自己提出猜想、用反例效化、加限制條件一般化、最後以先備知識證實。**課本直接給定義的地方，改成學生產出後才命名。**\n\n參考實作：`參考文件/博論/教案-第七單元-臆測五階段-全單元/`（五上第七單元擴約分與加減，7 節，經七輪獨立驗證）。\n\n## 觸發與反觸發\n\n- 觸發：`臆測五階段`、臆測教學、臆測任務、把某單元改成臆測、conjecturing teaching。\n- 不觸發：一般教案撰寫（改用 `lesson-plan-authoring`）、既有教案分層（`lesson-differentiation`）、命題（`item-authoring`）、教材轉遊戲。\n- 缺教材、年級、節數或單元範圍時，只輸出缺件清單，不自行假設。\n\n## 必要輸入\n\n單元教材（課本／教師手冊原始檔）、年級與科目、單元教學目標、課本建議節數、班級人數與組數、可用教具、學生先備狀況。\n\n## 課綱條目\n\n教案引用的數學學習表現（如 `n-III-6`）與學習內容（如 `N-5-6`），依 `lesson-plan-authoring` 的「課綱知識庫來源與查詢契約」查詢本機鏡像 `references/tw-curriculum-108/`（`node harness/scripts/tw-curriculum/lookup.mjs --domain 數學 --grade \u003c年級>`），記入教材事實 ledger，保留代碼、原文與 `file:line` 來源。課本或教師手冊標示的代碼要與鏡像核對，不一致時照引並加註疑義，不代為修正。\n\n## 五階段規格\n\n| 階段 | 活動形式 | 學習內容 | 產出 |\n|---|---|---|---|\n| 造例 | 個人 → 小組 | 建立 → 檢驗 → 分類 → 彙整資料 | 小組工作單 |\n| 提出猜想 | 個人 → 小組 | 提出 → 分享 → 檢驗 → 支持／反駁 → 歸類 → 彙整 | **每組 1 條**小組猜想 |\n| 效化 | **全班** | 分享 → 檢驗 → 效化 → 歸類 → 彙整 | 全班猜想 |\n| 一般化 | 全班 | 推廣 → 加全稱量詞與限制條件 → 精緻化 | 數學命題 |\n| 證實 | 全班 | 列舉法／操作證明 → 演繹推理 | 被說服的恆真命題 |\n\n**術語固定為「造例／提出猜想／效化／一般化／證實」。** 文獻中五階段模式的出處年份有 2015／2016／2019／2021 四種歸屬並存，未解；引用時須查證，不得逕採單一年份。\n\n## 硬性設計約束\n\n1. **教材事實必須回原始檔視覺核對。** 文件轉檔會讓分數的分子插進分母數字中間（如 `1 2 8 4` ＝ 18/24），且箭頭、圖示全滅。所有數值、表徵樣式、圖示規格、活動編號一律以原檔為準，並建立 ledger 逐筆標註核對狀態。\n2. **造例材料必須異質分配。** 全班拿到同質起始素材時，猜想池會單薄、效化階段必然空轉。至少要讓「可雙向操作」與「只能單向」的素材同時出現。\n3. **猜想池必須同時含恆真、非恆真、錯誤三類。** 課本通常只提供恆真猜想；沒有可打的靶，效化與一般化會空轉。列為必要條件檢核。\n4. **定義延後到一般化階段才命名。** 學生產出性質之後才給名稱，名稱是學生發現的標籤而非先給的定義。分類欄名不得使用目標術語。\n5. **每組只交 1 條小組猜想。** 收斂是提出猜想階段的職責，不得外溢到效化階段。\n6. **不使用連等式**（若課本明文禁止）；**倍數變化以箭頭標在分子上方與分母下方**（若課本明文規定）。\n7. **引用課本發現疑似錯誤不得代為修正**，照引並加註疑義。\n8. **成功條件分個人層級與全班層級兩層**，全班層級明標「衡量教學設計，非學生成績」。\n9. **無文獻依據的數值一律標「設計者目標值」**；不得出現「已實施」「已驗證有效」。\n\n## 差異化的兩條判準\n\n- **判準 A（操作層）**：措施觸及該階段核心決策的**比例**。0 項 🟢／部分 🟡／**全部** 🔴。用比例而非絕對數，否則在決策數最少的任務上會失效。\n- **判準 B（概念層）**：是否說出目標猜想的**關係內容** → 一律 🔴，**不論用術語、白話或疑問句**。看的是話語指出了什麼，不是怎麼說。\n\n判準以**措施的完整內容含教師話語**為判定對象；措施名稱無法判定等級。🟡 措施須附四項約束：單次使用、學習單標記、研究計分排除、全班比例上限。\n\n## 執行流程\n\n1. **語料與術語**：確認五階段術語，並記錄出處爭議。已完成者沿用 `參考文件/博論/決策-臆測五階段術語定案與語料清單.md`、`收斂-臆測五階段教學流程與階段教學目標.md`，不重跑。\n2. **教材事實 ledger**：抽出目標、節數、活動、教學提醒、迷思清單、習作對應；數值類回原檔視覺核對（PDF 可用 `uvx --from pypdfium2 --with pillow pypdfium2 render` 隔離渲染為圖再讀）。\n3. **逐小節設計臆測任務**：核心猜想、異質造例材料、猜想池（含反例靶）、反例題組（每道須數學驗算）、一般化的限制條件與全稱量詞、證實的先備知識清單、逐事件時間帳。\n4. **全單元總表**：節數配置、目標涵蓋檢核、任務間依賴、課本活動處置對照、編號索引。\n5. **學習單、評量規準、差異化**：學生版不得出現待命名的目標術語；評量分「教學用成功條件」與「研究用編碼」兩層並禁止研究編碼用於成績。\n6. **獨立驗證**：交 fresh-context `verifier`，只回 CONFIRMED／REFUTED。\n\n## 驗證契約\n\n- 檢核項：目標涵蓋、時間帳逐層加總、**反例逐道數學驗算**、教材事實回 ledger／原檔、編號跨檔無衝突、術語一致、紅線逐條、跨檔矛盾掃描。\n- **交付前先跑機械 lint，失敗就不交付**：每份產物跑 `node harness/cli/harness.mjs lint forbidden-claims \u003c檔案>`；學生版另跑 `lint student-term-leak \u003c學生版檔案> --terms \u003c本單元待命名術語,以逗號分隔>`。照引原文需要保留宣稱字眼時，用 `\u003c!-- lint-allow forbidden-claims -->` … `\u003c!-- /lint-allow -->` 包起來。lint 只補字面檢查，不取代上面的人工與數學驗算。\n- **判 REFUTED 後修正，必須再驗。** 參考實作中 58 項缺失有 29 項（50%）是修正過程自己製造的，三種型態：**只加不改**（加了正確的一行沒刪錯的那行）、**局部修未掃全域**（改了一個檔沒掃其他檔）、**修正引入未宣告的規則**。\n- 修正時固定自問：舊的那句刪了嗎？其他檔有同一句嗎？\n\n## 輸出契約\n\n`ledger-教材事實.md`、各小節任務檔、`全單元總表.md`、`學習單內容稿.md`、`評量規準.md`、`差異化方案.md`、`未取得清單-待補.md`、`審查紀錄.md`。\n\n## 停止規則\n\n- 缺教材、年級、節數、班級組數時，只輸出缺件清單。\n- **時間帳塞不進配置節數時，停下來回報實際分鐘數請使用者裁決，不得灌水說塞得下。**\n- 原檔視覺核對仍看不清數值時，標待補、**不猜**，請使用者提供清楚影像。\n- 猜想池湊不出非恆真或錯誤猜想時，回頭改造例設計，不得跳過效化階段。\n- 教具附件、班級人數、是否有特殊需求學生未知時，標為阻塞定稿項，不得宣告完成。\n- 涉及學生個資、錄影錄音、IRB 或正式送件時，先要求使用者核准。\n\n## 工作區邊界\n\n文件內容閱讀先走 `document-to-markdown-ingestion`；**涉及數值、版面、圖示、符號位置的核對屬格式例外，一律檢視原檔**。不得安裝 provider Plugin／MCP、寫入凍結的舊工作區或輸出 secrets。PDF 渲染等新套件執行須先查 `runtime-registry.json` 並取得使用者核准。\n"},{"id":"playable-world-prep","name":"可玩世界備課","cat":"game","sum":"先判斷教材值不值得做成可玩探究頁、核對事實，再把製作交給合適的 skill。","when":"想把一課做成可以玩的之前","text":"---\nname: playable-world-prep\ndescription: 可玩世界備課（把一段教材/一個主題變成「會回應學生的可玩探究頁」的教師備課紀律）。當老師想把教材做成互動可玩頁、讓學生「調變因看回應／自己戳出關係」，或說「把這課變成可以玩的」「一本書變互動」「做成模擬讓學生發現」時觸發。本 skill 是**備課決策＋事實查核＋路由**的紀律層，**不自造生成**：判斷該不該做→跑四步 SOP→過三道查核關→把實際生成路由到既有 skill（多變因活系統→causal-sandbox-inquiry；闖關外殼→material-to-quest-game；完整 Web 編排→educational-web-game-workflow；要先講清機制→explain-visual）。反觸發：純記憶/單一答案/選擇題/連連看型教材（會退化成點擊考卷）、無互相影響變因的純事實、或使用者只要投影片/純文字。\nmetadata:\n  type: reference\n---\n\n# 可玩世界備課（playable-world-prep）\n\n把「把教材做成互動頁」的隨手嘗試，換成**可重現的備課紀律**：先判斷這主題該不該做成可玩世界、把 AI 產的知識庫**查核過**、再把實際生成**路由到既有生成 skill**，最後過三道查核關。\n\n此 skill **不自己生成頁面**——它管的是「該不該做、做哪種、事實對不對、指不指向學習目標」。真正的生成交給下方路由的 skill。\n\n規格全文：`projects/edu-playable-world-prep-sop/26-09-10-teacher-prep-sop.md`；示範知識庫：`projects/edu-playable-world-prep-sop/examples/`。\n\n## 何時觸發\n\n老師想把教材/主題變成「學生調一個東西、畫面會有意義回應」的可玩探究頁；或提到「把這課變可以玩／一本書變互動／做成模擬讓學生自己發現」。\n\n## 反觸發（優先於觸發）\n\n- 純記憶事實、單一正確答案、選擇題／連連看型 → 會退化成「點擊答題考卷」（正是要避免的反例）。\n- 沒有互相影響變因的純事實教材。\n- 使用者明說只要投影片或純文字。\n- 一句判準：**「學生調一個東西，畫面會不會有意義地回應？」** 不會 → 做成好圖或好投影片就夠，別硬做。\n\n## 四步 SOP（照做）\n\n1. **plan-mode 建知識庫**：先請 AI 把教材整理成結構化知識庫（概念/關係/關鍵數字），**先不做網頁**。\n2. **查錯（事實關）**：請 AI 回頭查自己哪裡寫錯/猜的；**數字、年代、因果一律以課本/官方為準**，AI 自述不採信；不確定者擱置或刪。\n3. **做可玩頁（路由生成）**：依主題型態把生成交給對應 skill（見下），**一頁一機制**、變因要有意義回應。\n4. **部署 + 課前自玩**：做成可離線/可分享頁；**課前自己先玩一遍**確認回應合理無誤導。\n\n## 路由規則（本 skill 不自造，一律轉派）\n\n| 主題型態 | 交給 |\n|---|---|\n| 多變因互相牽動的活系統 + 因果圖 | `causal-sandbox-inquiry` |\n| 循序關卡、學習機制外殼 | `material-to-quest-game` |\n| 完整 Web 遊戲編排（資產→實作→驗證） | `educational-web-game-workflow` |\n| 先講清楚機制再決定要不要做 | `explain-visual` |\n| 數學臆測單元的五階段素材 | `conjecturing-five-stage` |\n\n## 三道查核關（交付前必過）\n\n| 關 | 問 | 不過就 |\n|---|---|---|\n| 事實 | 數字/因果對過課本或官方？ | 刪或標「待查」，不上場 |\n| 回應 | 調變因，畫面回應是否有意義且正確？ | 調參數或縮範圍 |\n| 教學 | 互動有沒有指向學習目標？ | 換互動或改回投影片 |\n\n## 一節課範圍界定\n\n一頁一機制、一個要學生「發現」的關係；留時間給學生戳→發現→講出來；做不出或查核不過**要能退回投影片**。\n\n## 邊界\n\n- 不處理真實學生個資（用公開教材或去識別範例）。\n- 對外發布頁面屬副作用 → 交老師自行決定/發布，不自動公開。\n- AI 產的知識庫必是未查核輸入，事實關為硬關。\n"},{"id":"material-to-quest-game","name":"教材轉闖關遊戲","cat":"game","sum":"把教材轉成實體或網頁闖關規格：學習機制、關卡、回饋、素材、可及性與試玩。","when":"要把教材做成闖關時","text":"---\nname: material-to-quest-game\ndescription: Convert supplied educational material into physical, web, or dual-branch quest-game specifications with learning mechanics, levels, feedback, assets, accessibility, safety, and playtest contracts. Use for 教材轉闖關遊戲, educational quest game, physical game, or web learning game requests. When named characters, recurring scenes, continuous action, or camera-led events need visual planning, optionally offer the visual-art-storyboard skill without enabling storyboards by default. Do not use when the branch or learning source is unspecified.\n---\n# 教材轉闖關遊戲\n\n## 定位\n\n把教材與學習目標轉為可試玩的實體／Web 闖關遊戲規格；完成遊戲規格不等於完成程式、素材或部署。\n\n## 觸發與反觸發\n\n- 觸發：`教材轉闖關遊戲`、教材做成闖關、實體教具遊戲、Web 學習遊戲。\n- 必須明確指定 `physical`、`web` 或 `both`；未指定時只產生缺件報告，不自行選 Web。\n- 若教材、學習目標、年齡、場域或分支不足，先啟動「提示詞優化」。\n\n## 必要輸入\n\n教材／來源、學段與年齡、學習目標、遊戲分支、場域／設備、時間、玩家人數、可及性需求、評量方式與資產限制。\n\n## 執行流程\n\n1. 建立 material concept map 與 learning-mechanic matrix，確認每一關都服務學習目標。\n2. 設計 game-design spec、level map、題目／回饋 bank 與教師引導。\n3. `physical` 分支加入材料、印製、教室配置、年齡安全與備援玩法。\n4. `web` 分支加入 DOM／Canvas 分工、可及性、資料狀態、斷網與低效能 fallback。\n5. 建立 asset spec 與 playtest plan；PixiJS、Sprite Forge 只作候選參考，不安裝或執行。\n\n## 可選的美工與分鏡提醒\n\n- 分鏡預設不啟用，不因為設計闖關遊戲就自動增加分鏡工作。\n- 若關卡包含具名角色、重複場景、連續動作、Boss／事件演出或鏡頭轉場，詢問一次：\n  `角色或場景需要繪製分鏡或連續動作嗎？如果需要，可以使用「美工與分鏡設計」產生八格連續分鏡。`\n- 使用者拒絕、略過或沒有回答時，繼續完成遊戲與資產規格，不阻塞主要流程。\n- 若使用者同意或直接輸入 `/gb`，把 `asset-spec.md`、`level-map.md` 與相關事件交給 `visual-art-storyboard`。\n- 只有靜態圖示、單張背景、UI 裝飾或簡單資產清單時，不詢問分鏡。\n\n## 輸出契約\n\n輸出 `material-concept-map.md`、`learning-mechanic-matrix.md`、`game-design-spec.md`、`level-map.md`、`question-and-feedback-bank.md`、`asset-spec.md`、`accessibility-and-safety-review.md`、`playtest-plan.md`、`teacher-guide.md` 與分支專用 prototype spec。\n\n## 停止規則\n\n- 未指定分支、學習目標或教材時，不生成完整遊戲規格。\n- 實體活動有尖銳物、小零件、移動或競賽風險時，先停在年齡／安全 Gate。\n- Web 任務未核准 runtime、外部 API 或部署時，只產出規格與 Task Packet。\n- 不把資產生成、PixiJS 安裝、Sprite Forge 執行或部署誤報為完成。\n\n## 工作區邊界\n\n文件輸入遵循 MarkItDown；不把轉換結果當成版面證據。不得安裝工具、寫入 凍結的舊工作區 或傳送未授權學生資料。\n"},{"id":"educational-web-game-workflow","name":"教育 Web 教學遊戲工作流","cat":"game","sum":"從教學規格、素材、網頁實作到驗證，一路編排完整的教育網頁遊戲。","when":"闖關規格確定、要真的做成網頁時","text":"---\nname: educational-web-game-workflow\ndescription: >-\n  當使用者同時提供或要求教材／學習目標、Web 分支，以及從教學規格、資產、Web 實作到驗證的完整教育遊戲編排時使用；也適用於把已核准的 AI／程序化資產接入教育 Web 遊戲，但只能走可追溯的導入預覽。缺少教材、學習目標或 Web 分支時只輸出 intake 與缺件清單。不要用於只有教材轉遊戲規格（改用 material-to-quest-game）、已有遊戲只評估或加入 Three.js（改用 quest-threejs-adoption）、單一參考圖轉 Three.js 展示頁（改用 image-to-3d-scene）、只有角色／場景分鏡（改用 visual-art-storyboard），或 physical／both 分支。\n---\n\n# 教育 Web 教學遊戲工作流\n\n把教材變成可學習、可操作、可降級、可驗證的 Web 教學遊戲。先固定學習目標與 DOM-only 任務，再決定 2D 或可關閉的 Three.js 視覺層；AI 生成的圖片、模型與程式碼都只視為候選產物。\n\n回覆使用者時使用繁體中文。不要把規格完成、資產生成、導入或部署誤報為遊戲完成。\n\n## Workflow 路由\n\n1. 沒有教材、學習目標或 Web 分支：只輸出教師 intake、缺件清單與空白契約，狀態為 intake-only；不得猜年段、內容或成效。\n2. 只有教材轉 Web／實體／雙分支遊戲規格：路由至 material-to-quest-game；不要啟動完整實作編排。\n3. 已有 Web 遊戲，只要求評估或加入 Three.js：路由至 quest-threejs-adoption；不要重新產生教材遊戲規格。\n4. 只有一張參考圖且要求可旋轉 Three.js 展示頁：路由至 image-to-3d-scene；不要把展示頁結果宣稱為遊戲資產或 GLB。\n5. 只有角色、場景或連續演出規劃：需要時路由至 visual-art-storyboard；靜態資產不自動加入分鏡。\n6. 從教材與學習目標開始，且要求規格、資產、Web 實作與驗證串接：由本 Workflow 編排，仍需呼叫上述專門 skill。\n7. physical／both 分支不由本 Workflow 實作；回到 material-to-quest-game。\n8. 要建立程式、導入資產或安裝套件：先完成本 Workflow 的契約、Task Packet 與 implementation preview，取得精確變更核准後才執行。\n9. 只要任務包含遊戲畫面或互動戰鬥區，先完成 `web-layout-topology-analysis` 的版面先行 Gate；未達 `layout_plan.status=ready` 不進入 HTML／CSS／JavaScript 實作。\n\n## Gate 0：教師 Intake\n\n使用 assets/teacher-intake-template.md 收集：\n\n- 教材與來源、學習目標、年段與先備能力。\n- web 分支、教室場域、目標裝置、瀏覽器與網路。\n- 評量方式、可及性需求、資產政策、可用工時與停止條件。\n\n缺少會改變教學設計的資料時停在 intake-only。不要用 synthetic fixture 補足真實課程內容。\n\n## Gate 1：學習與遊戲規格\n\n呼叫 material-to-quest-game，確認以下輸出已存在：\n\n- material concept map 與 learning mechanic matrix。\n- game design spec、level map、question and feedback bank。\n- asset spec、accessibility and safety review、playtest plan、teacher guide。\n- 每一關的學習目標、DOM-only 任務、評量指標與停止條件。\n\n每個題目必須有答案、理由、提示、錯誤回饋與補救路徑。若只能描述世界觀或美術，尚未達到 spec-ready。題庫是 JSON 時，交付前先跑 `node harness/cli/harness.mjs lint item-fields \u003c題庫.json>`（欄位 `answer`、`rationale`、`hint`、`feedback.incorrect`、`remediation`），失敗就不算 spec-ready。\n\n## Gate 2：2D／3D 必要性\n\n先分類 3D 是遊戲美術還是學習物件：\n\n- 關卡入口、背景、寶箱、粒子、天氣與演出：只依動機、成本、裝置與可及性評估。\n- 需要旋轉、剖面、拆解、遮蔽或空間關係的物件：只有 2D 不足且能用指標比較時才進 3D Pilot。\n\n若文字、公式、平面圖、時間軸、表單或 2D 拖曳已足夠，選 DOM／SVG／Canvas。不要為了展示 AI 產物而加入 Three.js。\n\n3D 分支交給 quest-threejs-adoption，第一個 Pilot 限定一題、一個教學物件、3–5 個熱點，以及必要的旋轉、縮放、剖面或拆解。\n\n## Gate 3：資產管線\n\n### 2D\n\n建立資產清單、來源與授權；為關鍵資訊提供文字、形狀、圖示或替代文字，不只用顏色傳達。\n\n**候選外部 2D 素材來源**\n\n- AetherForge 免費素材（外部候選來源，僅在使用者明確核准且本機可用時查閱；local-only Harness 不自動下載）：2D sprite，粉彩／點陣風格；角色、生活道具、事件物品、消耗品與合成素材。每件素材仍須逐件記錄實際授權文字／條款、取得日期、來源 URL、版本與 SHA-256。\n- 採用規則：取用每件素材時，仍逐件記錄該素材的實際授權文字／條款、取得日期、來源 URL、版本與 SHA-256。本專案作品與 eduHarness 採 CC 授權，散布前確認素材授權與 CC 相容。頁面未標示 AI 生成狀態與檔案格式，於資產清單標註「格式／授權條款待逐件確認」。\n\n### 程序化 3D\n\n建立 scene art spec，使用程序化幾何、材質、光線與粒子。image-to-3d-scene 可協助參考圖構圖與展示頁研究，但其邊界仍是程序化展示，不是模型檔匯出。\n\n### GLB／AI 3D\n\n使用 references/asset-pipeline.md。流程固定為：\n\n~~~text\n參考圖或 AI 概念圖\n→ 物件 brief 與輸入影像授權\n→ 生成或重建候選模型\n→ 比例、朝向、pivot、階層、材質、UV、動畫、碰撞與檔案量檢查\n→ GLB + asset manifest + 預覽圖 + ledger\n→ 真實瀏覽器載入、效能與 fallback 驗證\n~~~\n\nimg2threejs 仍是 `experimental-blocked` candidate。沒有核准的 AI-to-GLB executor、pinned commit、隔離測試、P0 fidelity 修復、認證方式與授權證據時，只能保留 asset brief 或驗證使用者已提供的 GLB；不得自行下載未知遠端模型、生成 GLB 或進正式 Pilot。\n\n每個上線資產都要能回溯 assetId、來源、授權／SPDX、輸入影像、版本、SHA-256、尺寸、單位、up axis、元件、動畫、貼圖、預算與 fallback。\n\n## Gate 3.5：遊戲版面先行\n\n只要任務建立或重構 Web 遊戲介面，即使是既有遊戲，也先載入 `web-layout-topology-analysis`，完成 `layout_plan`；不得把它視為可略過的視覺選配。\n\n執行順序：\n\n1. 先在計畫書畫出 viewport／區塊線框與核心圖示預覽。\n2. 填寫 `layout_blocks`、`component_rects`、`icon_specs`、`relations`，包含 visual／hit rect、z-order、overflow 與 collision channel。\n3. 讓主要遊戲區、路線、敵人、目標和必要 HUD 先取得尺寸；下方道具列、商店與裝飾只能使用剩餘空間，超高時在自身父區塊提供內部捲軸。\n4. 解決未預期 overlap／occlusion／hit collision 與 `error`；`layout_plan.status` 達 `ready` 且 unresolved error=0 後才能進 HTML／CSS／JavaScript。\n5. 完成後才做 DOM → CUA；預覽圖不算 browser evidence。\n\n## Gate 4：DOM-first 實作契約\n\nDOM-only baseline 必須先能顯示題目、提示、輸入、回饋、進度並完成整個學習任務。Quest State 保存答案、得分、進度與完成狀態，是唯一真相。\n\nThree.js Art Island 只能透過 SceneAdapter 接收唯讀 state snapshot，並送出版本化語意事件。不得把 Mesh、Object3D、動畫完成或 WebGL 狀態當作學習進度。\n\n必要契約：\n\n- scene-event-contract：contractVersion、eventId、sceneInstanceId、questRevision、correlationId、type、payload。\n- 允許初始事件：scene.ready、hotspot.selected、object.collectRequested、animation.completed、scene.failed。\n- animation.completed 只能表示視覺動畫完成，不得直接推進關卡。\n- 每個 hotspot 都要有鍵盤、觸控、螢幕閱讀器與 DOM 等價操作。\n- WebGL 關閉、quest3d=off、低效能、載入失敗與 context loss 都要回到可完成任務的路徑。\n\n### DOM-first 硬閘門\n\n每一個 UI 或互動需求都固定依下列順序驗收：\n\n~~~text\n規格鎖定\n→ DOM／程式檢查\n→ DOM_PASS\n→ CUA 視覺與實際操作檢查\n→ CUA_PASS\n~~~\n\n- DOM／程式檢查失敗時，立即停止該需求，不啟動 CUA，也不以截圖掩蓋失敗。\n- DOM 檢查至少要能確認元素、事件、學習狀態、數值與必要尺寸；單元測試、瀏覽器 evaluate 與可重現的 selector 都可以作為證據。\n- CUA（Computer Use Agent，電腦操作代理）只確認美工、構圖、動畫、文字可讀性、畫面異常與實際點擊／觸控感受，不能取代單元測試、DOM 檢查或狀態驗證。\n- CUA 發現問題時，回到實作修正，再從 DOM 檢查重新開始；不能只補截圖。\n- 未同時取得 `DOM_PASS` 與 `CUA_PASS`，不得把該需求或整體功能標為完成。\n\n### 固定單頁與內部 overflow 契約\n\n若遊戲規格選擇固定單頁 Web 介面，實作前先鎖定 viewport 與容器契約：\n\n- `body` 與整體頁面不得產生上下捲軸；頁面本身使用 `overflow: hidden` 或等效的明確限制。\n- `app-shell`／`screen` 必須跟隨 viewport 高度，並允許 grid／flex 子項目縮小；動態內容所在的 grid 子項目要有 `min-height: 0`。\n- 可能超出的內容面板預先使用 `overflow-y: auto` 或 `overflow-y: scroll`、`overflow-x: hidden`；不要用 `overflow: hidden` 把尚未驗證的內容裁掉。\n- 內部捲動面板要能用滑鼠滾輪與觸控操作；不依賴某一個解析度的固定高度例外來遮住問題。\n\nDOM 驗收至少包含下列檢查；若正常內容未超出面板，另用「故意放入超長內容」的最小 fixture 驗證內部 bar：\n\n```js\nconst pageScroll = {\n  htmlFitsViewport: document.documentElement.scrollHeight === document.documentElement.clientHeight,\n  atTop: window.scrollY === 0,\n  bodyOverflow: getComputedStyle(document.body).overflow,\n  panelOverflowY: getComputedStyle(targetPanel).overflowY,\n  panelCanScroll: targetPanel.scrollHeight > targetPanel.clientHeight,\n};\n```\n\n必要結果為：`htmlFitsViewport === true`、`atTop === true`、body 不可頁面捲動；在超長內容案例中，目標面板必須滿足 `scrollHeight > clientHeight`，且 `panelOverflowY` 為 `auto` 或 `scroll`。\n\n### CUA 啟動時機\n\nCUA 不等到所有功能完成才啟動，而是在三個檢查點進入：\n\n1. **骨架檢查**：首頁、主要操作頁與裝備／設定頁第一次可操作後，先取得 `DOM_PASS`，再做 CUA 基準截圖。\n2. **功能檢查**：每完成一個視覺／互動功能，先驗證 DOM 事件與狀態，再以 CUA 操作實際流程。\n3. **回歸檢查**：功能完成後，以固定 viewport 與短 viewport 重跑 DOM → CUA；必要時加入手機尺寸。\n\nCUA 至少確認：重要角色、敵人、生命／進度 bar 與按鈕實際可見；攻擊或回饋動畫真的出現在畫面；內容面板沒有裁切或遮住控制列；文字與字卡可讀、可點擊、可觸控；沒有意外的 body 捲軸。低動態模式下也要驗證靜態回饋仍可見。\n\n### 規格－DOM－CUA 驗收矩陣\n\n每個 UI／互動需求都要填寫同一份矩陣，不能只在測試報告或截圖旁口頭說明：\n\n| 欄位 | 內容 |\n|---|---|\n| Requirement ID | 對應使用者需求或規格條文 |\n| DOM／程式預期 | 狀態、事件、元素、尺寸或公式 |\n| DOM 驗證 | 可重現的 selector、evaluate、單元測試或命令 |\n| CUA 操作 | 要點擊／觸控的實際步驟 |\n| CUA 視覺預期 | 截圖或操作畫面必須看到的結果 |\n| Viewport | 例如 `1280×720`、`1323×585`、手機尺寸 |\n| Evidence | 測試輸出、DOM 結果、截圖或錄影位置 |\n| Status | `PENDING`、`DOM_PASS`、`CUA_PASS`、`BLOCKED` |\n\n狀態只能依序前進：\n\n~~~text\nPENDING → DOM_PASS → CUA_PASS\n~~~\n\n`CUA_PASS` 不得跳過 `DOM_PASS`；任何停止條件、缺件或環境阻礙都標為 `BLOCKED`，修正後回到 `PENDING`，不可把 `BLOCKED` 直接改成通過。\n\n可直接套用到部件守城類版面的最小案例：\n\n| Requirement ID | DOM／程式預期 | CUA 視覺預期 |\n|---|---|---|\n| `LAYOUT-001` | body 高度等於 viewport，超長 Step 面板 `scrollHeight > clientHeight` 且 `overflow-y` 為 `auto`／`scroll` | 整頁沒有上下 bar，Step 02／Step 03 在自己的框內有 bar，控制列仍可見 |\n| `BATTLE-001` | 敵人與生命 bar 存在；攻擊事件更新可見效果層 | 敵人、城牆、bar 與普通／特殊攻擊效果實際出現在畫面 |\n| `WORD-001` | 字卡數量符合規格，點擊事件更新答案狀態，送出後回饋可讀 | 字卡可點擊／觸控、順序可辨識，結果面板沒有被裁切 |\n\n### 遊戲平衡參數集中管理\n\n遊戲平衡數值必須集中於單一設定模組，遊戲公式只讀取該模組，不把倍率與關卡成長值散落在事件處理器或畫面元件中。例如：\n\n```js\nexport const GAME_BALANCE = {\n  enemyMovementMultiplier: 0.25,\n  wallHpPerLevel: 100,\n  killTargetPerLevel: 50,\n  extraQuestionTiles: 2,\n};\n```\n\n集中管理範圍至少涵蓋敵人移動倍率與攻擊頻率、城牆生命與勝利擊殺數、關卡成長係數、字卡干擾數量、能力持續時間／傷害倍率／燃燒週期、裝備成長係數與提示懲罰倍率。每次調參都要留下舊值、新值、預期遊戲影響、對應單元測試、DOM／CUA 實測證據與 rollback 值。\n\n調參紀錄可用下列兩個範例起始：\n\n| 參數 | 舊值 → 新值 | 預期影響 | 測試與 DOM／CUA 證據 | rollback |\n|---|---|---|---|---|\n| `enemyMovementMultiplier` | `0.5 → 0.25` | 敵人前進速度降低，攻擊頻率與傷害公式不因該參數改變 | 測試比較速度；DOM 確認敵人存在與位置更新；CUA 確認仍看得到敵人持續前進 | `0.5` |\n| `extraQuestionTiles` | `3 → 2` | 每題少一張干擾字卡，答案仍完整保留且順序重新洗牌 | 測試驗證字卡數量與答案字元；DOM 確認字卡可操作；CUA 確認文字可讀且不溢位 | `3` |\n\n## Gate 5：Harness 導入預覽\n\n使用 references/import-preview-contract.md。Harness 的自動化範圍是產生可審核的導入預覽，不是跳過授權或核准：\n\n1. 產生符合 references/schemas/import-preview.schema.json 的 import-preview.json，列出 `previewId`、來源／目的地、舊／新 hash、依賴、覆寫行為、預計修改、rollback action 與 drift recheck。\n2. 驗證 allowed_paths；路徑正規化後不得逃出目前工作區。\n3. 涉及 setup、install 或 update 時，先通過安裝防重預檢。\n4. 使用者核准精確預覽後，才導入 manifest、loader、adapter、placeholder 或測試。\n5. 保留 last-known-good manifest；失敗時回退 placeholder 或 DOM-only。Registry、validator、fixture、metadata 或投影變更要有逐檔前後 hash 與可執行回退步驟。\n\n不要讀取、輸出、複製或提交 secrets、tokens、cookies、private keys 或學生個資。未知遠端模型、任意 URL loader、未驗證 CDN 與未授權輸入影像不得直接接入。\n\n## Gate 6：驗證與教師試點\n\n驗證至少涵蓋：\n\n- 學習：DOM-only 與 3D 版本的完成率、時間、錯誤類型、迷思概念與教師觀察。\n- 功能：題目、狀態、重新整理、載入失敗、上一關／下一關與 context loss。\n- 可及性：鍵盤、觸控、焦點、螢幕閱讀器、文字對比、reduced motion、動暈、三閃與靜音。\n- 視覺：構圖、比例、光線、色盤、熱點、responsive viewport；若使用參考圖，至少兩輪瀏覽器截圖驗證。\n- 效能：命名裝置與網路上的冷啟動 P50／P95、frame-time、記憶體、draw calls、10 分鐘操作與降級。\n- 安全與授權：輸入 schema、輸出消毒、CSP、路徑白名單、資產 ledger、hash 與依賴版本。\n\n### DOM → CUA 驗證順序與停止條件\n\n每一個功能固定依下列順序執行：\n\n1. 執行邏輯／單元測試。\n2. 啟動本機頁面並鎖定要驗證的 viewport。\n3. 執行 DOM／程式檢查，全部通過後才標記 `DOM_PASS`。\n4. 只有 `DOM_PASS` 成立時才執行 CUA；完成視覺與操作檢查後才標記 `CUA_PASS`。\n5. 將測試輸出、DOM 結果與 CUA 證據寫入驗收矩陣。\n6. 由 fresh verifier 重新檢查；fresh evidence 要說明實際檢查的檔案、畫面或命令，不能只複述 executor 結論。\n\n以下任一情況立即停止，不得往下宣稱完成：\n\n- body 出現頁面捲軸，或固定單頁的 `scrollHeight` 不等於 viewport 高度。\n- 內容面板超出卻沒有內部 bar，或控制列被裁切、遮住。\n- DOM 元素、事件、學習狀態、數值或公式不符合規格。\n- CUA 看不到應有元素、文字不可讀、畫面被遮住，或實際動畫只有事件紀錄而沒有視覺效果。\n- 調參後沒有對應測試、DOM／CUA 證據或 rollback 值。\n- verifier 沒有提供 fresh evidence，或 requested model 與 actual model 的執行期證據混用。\n\n使用 assets/pilot-acceptance-checklist-template.md 與 assets/pilot-budget-and-kill-switch-template.md。只有 fresh verifier 以直接證據確認後，才能使用 pilot-evidence-ready。\n\n## 輸出狀態\n\n- intake-only：缺少關鍵輸入，只輸出 intake 與缺件。\n- spec-ready：學習、遊戲、資產與 3D 判斷完成，尚未建立程式。\n- implementation-preview：Task Packet、依賴預檢與精確變更預覽完成，等待核准。\n- experimental-blocked：AI／GLB executor、認證、pinned runtime 或隔離測試未核准；只能保留 brief、使用者提供資產或 fallback。\n- pilot-evidence-ready：真實裝置、瀏覽器、可及性、效能與教學比較證據完成。\n- stopped：觸發成本、品質、學習、安全或授權停止條件，回退 DOM-only 或修訂規格。\n\n## 明確不做\n\n- 不把 Codex 宣稱為遊戲引擎；實際 runtime 仍是專案 Web 技術與瀏覽器。\n- 不把所有教育遊戲改成 3D。\n- 不把單張圖片重建宣稱為精確 3D 掃描或 photogrammetry。\n- 不在第一個 Pilot 製作完整 3D 世界、自由探索、物理、敵人 AI、多人連線或編輯器。\n- 不把資產生成、導入、部署或教師成效誤報為完成。\n- 不把 synthetic fixture 當成真實課程、瀏覽器 WebGL、效能或教學成效證據。\n\n## 參考與模板\n\n- 詳細輸入、狀態與 3D 判斷：references/workflow-contract.md\n- AI／GLB 資產與品質 Gate：references/asset-pipeline.md\n- Harness 導入與 rollback：references/import-preview-contract.md\n- 版本化契約：references/schemas/game-spec.schema.json、asset-manifest.schema.json、scene-event.schema.json、import-preview.schema.json、fixture-case.schema.json、fixture-suite.schema.json\n- 可重用模板：assets/teacher-intake-template.md、assets/game-design-spec-template.md、assets/asset-manifest-template.json、assets/asset-ledger-template.md、assets/scene-event-contract-template.md、assets/performance-budget-template.md、assets/pilot-acceptance-checklist-template.md、assets/pilot-budget-and-kill-switch-template.md、assets/import-preview-template.json\n- Synthetic fixture：assets/fixtures/fixture-cases.json 與同目錄的 Markdown 案例\n"},{"id":"educational-card-game","name":"教育卡牌遊戲設計與製作","cat":"game","sum":"把教材設計成網頁卡牌遊戲，含教師引導、規則、可及性、試算表保存與教師查分。","when":"想做卡牌遊戲時","text":"---\nname: educational-card-game\ndescription: >-\n  當教師要把教材與學習目標設計成可玩的教育 Web 卡牌遊戲，並需要教師引導、卡牌規則、可及性、GitHub 靜態前端、GAS／Google Sheet 保存與教師查分時使用；缺少教材、學習目標、年段或 Web 分支時只輸出 intake，不猜測。不要用於只有實體卡牌、只有一般教材轉遊戲規格，或已有遊戲的單純視覺改造。\n---\n\n# 教育卡牌遊戲設計與製作\n\n這個 Skill 把「先確認教學目的，再設計卡牌，最後產出可驗證的 Web 遊戲契約」固定成可重用流程。回覆教師時使用繁體中文，先說目前狀態與缺件，不把規格、資產、GAS、部署或教學成效誤報為完成。\n\n## 啟動與邊界\n\n啟動條件至少包含：教材或可核准來源、學習目標、學段／年齡、`web` 分支，以及預期的課堂場域。缺少會改變設計的資料時，只輸出 `intake-only`、問題清單與空白契約。\n\n以下請求應轉交或停在相鄰 Skill：\n\n- 只有教材轉成遊戲規格：使用 `material-to-quest-game`。\n- 需要從教材、資產、Web 實作一路串到瀏覽器與試點驗證：由 `educational-web-game-workflow` 編排。\n- 需要製作遊戲畫面：先使用 `web-layout-topology-analysis`；`layout_plan.status=ready` 前不得寫 HTML／CSS／JavaScript。\n- 只有實體卡牌、physical／both 分支：回到 `material-to-quest-game`，不要假設本 Skill 會產生印刷品。\n- 只有角色、場景或連續演出：必要時再詢問是否載入美工與分鏡；單張卡面與 UI 不自動啟動分鏡。\n\n## 固定流程\n\n### Gate 0：教師 Intake\n\n使用 `assets/teacher-intake-template.md`，收集教材來源、年段、先備能力、2–5 個可觀察學習目標、常見迷思、課堂時間、玩家人數、合作／競賽方式、裝置／網路、可及性、評量、資料保存目的與資產限制。不要用猜測補足教材或學習目標。\n\n### Gate 1：學習—機制矩陣\n\n先建立 `learning-mechanic-matrix.md`：\n\n`學習目標 → 可觀察行為 → 卡牌操作 → 正確證據 → 錯誤回饋 → 補救路徑 → 可保存事件`\n\n每個目標至少要有一個可觀察行為與正確證據；只有世界觀、卡面或分數，尚未達 `spec-ready`。\n\n### Gate 2：卡牌資料與規則\n\n使用 `references/card-data.schema.json` 與 `assets/educational-card-spec-template.md`。每張卡要有穩定 ID、目標／概念、題幹、答案規則、理由、提示、迷思標籤、正誤回饋、補救、來源、可及性與版本。\n\n規則引擎至少維持以下不變式：\n\n- 一張卡同一時間只能位於一個 Zone。\n- 合法性、目標、費用與答案先驗證，再用 remove-then-add 一次改變狀態；提交後檢查沒有重複卡或遺失卡。\n- effect queue 明確採 FIFO 或 LIFO；失效目標有固定的 fizzle、取消或重新選目標結果。\n- 洗牌固定 PRNG／shuffle 版本與 seed；replay fixture 能重現牌序、效果順序與結果。\n- 手牌上限、牌庫耗盡／疲勞、資源曲線、提示代價與勝負條件集中管理，調整要有測試與 rollback 值。\n- `GameState`、`LearningState`、`VisualSnapshot` 分離；動畫完成不能直接代表學習完成。\n\n### Gate 3：美術、版面與可玩性\n\n先選 DOM／SVG、Canvas 2D 或 hybrid，不為了外觀預設 3D。需要畫面時，先建立 viewport、layout blocks、component rects、icon specs、hit rect、z-order、overflow 與 collision channel；核心遊戲區與必要操作優先於裝飾。\n\nDOM-only baseline 必須能完成完整學習任務；Canvas／動畫只是呈現層。每個拖放操作要有點擊、鍵盤或語意替代。資產要有來源、授權、版本、hash 與 fallback。\n\n### Gate 4：Web、同步與資料權限\n\n讀取以下參考文件：\n\n- `references/gas-endpoint-contract.md`\n- `references/gas-threat-model.md`\n- `references/credential-and-role-model.md`\n- `references/sheet-schema.md`\n- `references/storage-performance-model.md`\n\n安全邊界固定如下：\n\n- GitHub 前端的 GAS URL 是公開路由，不是秘密；不得把 OAuth token、服務帳戶金鑰、Sheet ID 或固定寫入 secret 放進 bundle。\n- 校方先以受保護介面匯入 roster；公開學生端只有 login，不提供 register，不可搶註或覆寫 studentKey。\n- 國小短 PIN 是低強度課堂登入碼，不能冒充高可信正式身份；要配合課程 launch context、每學生／裝置／課程限速、冷卻／鎖定、教師重設與不枚舉錯誤。\n- 學生登入、教師查成績、校方 roster 匯入、管理者查回原 PIN 是不同權限面。教師不讀 credential vault；管理者查原 PIN 必須是 C2 外部 KMS／等價受控金鑰服務的單筆、重新驗證、理由碼、遮罩／一次性顯示與獨立稽核路徑。\n- C2 的 ciphertext envelope 與 verifier 都不可進事件資料；原 PIN 不進 Log、Sheet、瀏覽器長期儲存或分析事件。若沒有外部 KMS，不能用自製固定金鑰假裝完成 C2，改採 C1 重設。\n- 事件至少一次送達；以 `gameId + sessionId + eventId`（含 school／course scope）辨識 canonical key，raw events 不因重送被默默改寫，mastery rollup 必須先去重。\n- `receivedAtMs` 由 GAS 產生；`clientCorrect`、`clientScoreDelta` 等客戶端欄位只作未可信遙測。正式學習證據由伺服器題庫重算或標為非權威。\n- GAS 只接受固定白名單欄位，先做 body／batch／每日預算與 kill switch，再取得 Lock 或呼叫昂貴服務；Sheet 用批次二維寫入，不採每 click 一次的寫入。\n\n### Gate 5：產物與授權\n\n依目前任務輸出所需的最小集合：\n\n- `teacher-intake.md`\n- `learning-mechanic-matrix.md`\n- `educational-card-spec.md`\n- `question-and-feedback-bank.md`\n- `game-design-spec.md` 與 `level-map.md`\n- `layout_plan.json`、`asset-spec.md`、`accessibility-and-safety-review.md`\n- `gas-endpoint-contract.md`、`sheet-schema.md`、`playtest-plan.md`、`teacher-guide.md`\n\n需要建立專案程式、導入資產或部署設定時，先產生 implementation preview／Task Packet，列出相對路徑、依賴、schema 版本、資產 hash、rollback 與 drift recheck；未取得使用者對精確變更的授權，不建立或部署外部服務。\n\n## 輸出狀態\n\n- `intake-only`：缺少教材、學習目標、年段或 Web 分支。\n- `spec-ready`：學習目標、卡牌機制、資料契約、可及性與版面規劃完成，尚未建立遊戲程式。\n- `implementation-preview`：精確變更預覽、依賴預檢與 rollback 完成，等待授權。\n- `experimental-blocked`：KMS、認證、瀏覽器或外部資產條件未通過，只保留契約與 fallback。\n- `pilot-evidence-ready`：有 fresh 的邏輯、DOM、CUA、裝置、效能、可及性與教師試點證據。\n- `stopped`：觸發安全、資料治理、學習品質、授權或成本停止條件。\n\n## 參考資料路由\n\n- 初次規劃：`references/workflow-contract.md`、`assets/teacher-intake-template.md`。\n- 卡牌規則：`references/card-data.schema.json`、`references/learning-mechanic-matrix.md`。\n- GAS／身份：`references/gas-endpoint-contract.md`、`references/gas-threat-model.md`、`references/credential-and-role-model.md`、`references/credential-vault.schema.json`、`references/admin-audit.schema.json`。\n- Sheet／效能：`references/sheet-schema.md`、`references/storage-performance-model.md`、`references/migration-criteria.md`。\n- 試點：`assets/pilot-acceptance-checklist.md`、`assets/pilot-budget-and-kill-switch-template.md`。\n\n必要時執行：\n\n- `scripts/validate-card-game-contract.mjs`：驗證 card catalog 與規則不變式。\n- `scripts/validate-gas-payload.mjs`：驗證合成 request 是否越過身份／秘密邊界。\n- `scripts/validate-credential-policy.mjs`：驗證 C1／C2、短 PIN 與管理者查碼政策。\n- `scripts/estimate-sheet-budget.mjs`：估算 cells、事件量與輪替警戒。\n\n這些工具只處理合成資料與契約，不讀取或提交真實學生姓名、學號、PIN、token、cookie 或 private key。\n"},{"id":"learner-behavior-game-review","name":"學習者行為與挑戰驗收","cat":"game","sum":"用學生實際操作的證據審查遊戲：挑戰階梯、答案洩漏、錯誤恢復；先檢查畫面結構，再實際操作。","when":"遊戲做好、要驗收時","text":"---\nname: learner-behavior-game-review\ndescription: >-\n  當需要從可觀察的學生操作證據，審查教育 Web／卡牌／密室逃脫遊戲的學習行為、挑戰階梯、答案洩漏、錯誤恢復與驗收順序時使用；本 Skill 固定先完成 DOM 驗收，只有 DOM 通過後才進入 Chrome 視覺與實際操作驗證。不要用於臨床心理診斷、個別學生監控、人格推論、只有一般瀏覽器功能測試，或只有教材、教案、美術與分鏡製作。\n---\n\n# 學習者行為與挑戰驗收\n\n這個 Skill 研究「學生在介面上實際做了什麼」，把可觀察證據、合理假設、挑戰階梯與驗收證據接成一條可回溯的線。目標是讓學生需要自己找線索、做判斷、組合語句並從錯誤恢復，而不是把答案藏在卡牌、標籤或高亮效果裡。\n\n它是 supporting Skill，不取代主 Skill 的 Route Plan，也不自行新增、刪除或重排 Route Plan 節點。主 Skill 已指定流程時，遵守主流程；本 Skill 只補上行為設計與驗收契約。\n\n## 先確認範圍\n\n啟動前先確認：\n\n- 學習者是誰、學習目標是什麼、遊戲中的任務與成功條件是什麼。\n- 要觀察的是群體或匿名情境的操作行為，不是替某個孩子貼上能力、個性或健康標籤。\n- 是否包含 Web 介面、卡牌、拖放、句子組合、線索、NPC 對話或密室逃脫流程。\n- 是否需要只做行為／難度設計，或還要做 DOM 驗收與 Chrome 視覺驗收。\n\n若缺少會改變設計的年段、教材、學習目標或成功條件，只輸出 `intake-only` 與缺件，不猜測學生行為。若請求只有臨床、人格、注意力或個人監控，停止並說明本 Skill 不適用；不要把一次點錯解讀成診斷證據。\n\n## 證據規則：先記錄，再解釋\n\n每一筆判斷都要標記證據類型。可稽核摘要即可，不保存私有推理過程。\n\n| 證據類型 | 可以支持的說法 | 不可以直接推出的說法 |\n| --- | --- | --- |\n| `dom_measurement` | 元件存在、文字可見、按鈕 disabled、矩形重疊、狀態有轉移 | 學生理解或不理解內容 |\n| `interaction_trace` | 學生點了什麼、拖了幾次、在哪個狀態重試 | 學生懶惰、笨、沒有動機 |\n| `screenshot_visual` | 看得到的層級、裁切、遮擋、提示位置 | 學生一定看懂畫面 |\n| `teacher_report`／`student_report` | 使用者描述的困惑、偏好或阻塞 | 所有學生都會一樣 |\n| `research_reference` | 已查證的設計原則或研究結果 | 這個班級一定符合研究平均 |\n| `inference` | 帶有替代解釋的暫時假設 | 當成事實或診斷 |\n\n寫行為假設時固定使用以下格式：\n\n1. `觀察`：只寫可重現的操作或畫面證據。\n2. `可能原因`：至少列兩個合理原因，例如線索不明、目標不可點、工作記憶負荷太高。\n3. `可觀察預測`：若某原因為真，下一次會出現什麼操作證據。\n4. `最小測試`：一次只改一個變因，例如只改提示位置，不同時改文字、顏色和答案。\n5. `結果與決策`：保留、修正、回退或需要教師試用；沒有證據就保持不確定。\n\n不要用「學生不會」「學生不專心」當結論。一次錯誤可能來自按鈕被遮住、答案順序已洩漏、提示位置太遠、語句負荷太高或學習者尚未理解任務。\n\n## 學生不應直接拿到答案\n\n把「提示」和「答案」分開審查。玩家畫面遵守以下規則：\n\n- 指令說明要告訴學生要觀察的範圍、證據種類或下一個行動，不直接說出配對結果。例：「找出能打開出口的線索」可以；「鑰匙卡要拖到門上」不可以在尚未推理前直接出現。\n- 選英文證物卡只能表現「卡牌已選」；不可讓對應物件發光、加粗、跳動、出現外框或自動捲到目標位置。\n- 任何 `word → location`、`object → number`、`card → hotspot` 對照表只可存在於教師檢查、測試 fixture 或內部狀態，不可出現在玩家可見文字、ARIA 名稱、`title`、tooltip、`alt` 或可讀的隱藏內容。\n- 線索可以分層：先給觀察方向，再給分類提示，再給句型框架；只有學生已嘗試且主動要求後，才提高提示層級。提高層級時標示「提示」而不是假裝仍是發現。\n- 錯誤回饋說明錯在哪一類、下一步能做什麼，不直接補出正確答案。保留已完成進度，讓學生能重新嘗試。\n- 被鎖住或 disabled 的控制項不可沉默。要說明「還缺什麼狀態」與「下一步去哪裡」，但不要把尚未發現的解法直接寫出來。\n- 句子組合的詞塊預設打亂；完成區只顯示學生已放入的詞塊，不預先印出正確順序。需要支援時，可提供空格數、句首或詞性提示，不能直接排列完成。\n- 若介面採雙欄，固定左側為案件／線索與分頁、右側為證物／對話／解鎖操作；學生讀線索時仍能看見目前操作區，不要求在兩個垂直區段間反覆捲動對照。窄畫面才堆疊時，要保留「先線索、後操作」的標題與順序。\n\n### 本專案常見的答案洩漏反例\n\n以下是審查標記，不是玩家提示：\n\n- 點 `window` 卡後窗戶亮起：`BLOCK`，把搜尋任務變成看高亮。\n- 畫面直接列出「學校牌 → one、鉛筆 → two、尺 → three」：`BLOCK`，學生只需抄答案。\n- 拿到 `key` 後門沒有可辨識、可點擊或可恢復的狀態：`BLOCK`，這是狀態與回饋失敗，不是學生推理失敗。\n\n## 挑戰階梯：一次只增加一種負荷\n\n「略有挑戰」表示目前能力的下一小步，不是突然增加所有干擾。每升一階只改一個主要負荷；預設不使用倒數計時，只記錄闖關所花時間供學生回顧與教師分析。\n\n| 階段 | 學生要完成的行為 | 可用支援 | 進入下一階的證據 |\n| --- | --- | --- | --- |\n| `D0 導航` | 知道目標、操作方式與完成後會去哪裡 | 示範拖放／點選；不示範答案 | 能開始任務，知道目前唯一主要行動 |\n| `D1 辨識` | 從場景或對話辨認學過的單字／物件 | 圖像、中文義意或發音按鈕 | 能在低干擾下選對類別，不靠目標高亮 |\n| `D2 配對` | 將卡牌放到合理的場景物件或位置 | 顏色分類、空位數、一次一張卡 | 能完成配對，錯誤後能自行取回再試 |\n| `D3 推理` | 把兩個以上線索組成關係或順序 | 線索分頁、觀察問題、有限次提示 | 能說出或選出關係，答案不在對照表 |\n| `D4 句型` | 把打亂的詞塊組成正確句子並理解用途 | 句首、詞性、讀句按鈕；不自動排序 | 能組句並用句意支持下一個行動 |\n| `D5 遷移與恢復` | 在新場景或少一層提示下獨立解題 | 錯誤保留進度；可回看已發現線索 | 能從卡住狀態找到恢復入口並完成 |\n\n可調整的負荷包含：干擾項數量、線索距離、語言支援量、線索依賴數、工作記憶跨度與時間壓力。國小原型先固定「無倒數計時」，只在結果頁顯示經過時間；不要把快慢當成能力分數。\n\n每個關卡要寫清楚：`entry_criteria`、`target_behavior`、`one_changed_load`、`success_criteria`、`rollback_rule`。若學生大量停在同一狀態、反覆點同一不可用控制項，先檢查介面與提示，不要立即升級懲罰或增加倒數。\n\n## 狀態、主要行動與錯誤恢復\n\n每個畫面或遊戲狀態只保留一個主要下一步。審查表至少包含：\n\n| 欄位 | 要回答的問題 |\n| --- | --- |\n| `state` | 現在是找線索、組句、解鎖還是離場？ |\n| `learning_goal` | 此狀態練習哪個單字、句型或推理行為？ |\n| `primary_action` | 學生現在最該做的一件事是什麼？ |\n| `visible_cue` | 學生在畫面上從哪裡知道這件事？ |\n| `blocked_control_reason` | 不能點的控制項為何不能點？ |\n| `recovery_action` | 做錯或卡住後，最短恢復路徑是什麼？ |\n| `success_transition` | 完成後如何讓下一狀態可辨識？ |\n\n典型狀態可寫成：`evidence_collecting → hypothesis_ready → sentence_building → lock_ready → exit_ready → completed`。例如 `exit_ready` 必須同時具備可辨識的出口狀態、可點擊的實際命中區、鍵卡已啟用、以及一個不洩漏答案的下一步說明；不能只把「完成」寫在資料模型裡。\n\n固定的空間角色也要列入狀態驗收：左側看「為什麼要做」、右側做「現在要做什麼」。如果線索與操作不得不離開同一 viewport，應提供可回看的分頁或固定摘要，不要把學生的上下捲動次數誤判成推理能力。\n\n## 驗收順序：DOM 是門檻，Chrome 是第二關\n\n只有在 `DOM_PASS` 之後才可進入 `CHROME_PASS`。兩者不能互相代替，也不能因為截圖「看起來可以」就跳過 DOM。\n\n### Gate A：DOM_PASS\n\n先使用 repository 已存在的 DOM 測試、瀏覽器 DOM inspection 或本機驗證工具；不得安裝套件、呼叫外部服務或讀取秘密。固定檢查：\n\n1. 必要節點、按鈕、拖放區、對話與狀態標記存在，沒有重複 id 或孤兒控制項。\n2. 可互動元素有可理解的 accessible name、角色、鍵盤順序與 disabled／busy 狀態。\n3. 核心狀態能依序轉換；成功、錯誤、重試與恢復都有 DOM 證據。\n4. 玩家可見 DOM、ARIA、`title`、tooltip、`alt` 與 visually-hidden 文字沒有直接答案對照。靜態 HTML 先跑 `node harness/cli/harness.mjs lint answer-key-leak \u003chtml> --answer-key \u003c答案鍵.json>`（格式 `{\"pairs\":[{\"key\":\"…\",\"value\":\"…\"}]}`）；它看不到執行期由 JS 產生的 DOM，執行期的洩漏仍由本項的 DOM 檢查負責。\n5. 選卡只改變卡牌選取狀態，不改變目標物件的凸顯狀態；句塊順序由學生操作產生。\n6. 所有 disabled 控制項有原因與恢復入口；最後一個控制項完成後，下一步存在且可找到。\n7. `scrollWidth`／`clientWidth`、主要矩形與 `elementFromPoint` 基線沒有已知的裁切、重疊或命中區遮擋；狹窄 viewport 不出現水平溢位。\n8. 沒有 fatal runtime error；若 DOM／狀態檢查失敗，結果是 `DOM_BLOCKED`，停止，不啟動 Chrome 視覺驗收。\n\nDOM 證據要記錄 `check_id`、檢查方法、實際值、預期值、結果與產物路徑。不要只寫「DOM 沒問題」。\n\n### Gate B：CHROME_PASS\n\n只有 Gate A 通過後，且本機已存在 Chrome 控制能力時，才載入 Chrome Skill／套件進行視覺化與實際操作。優先使用新建的 agent tab，不要覆蓋使用者正在看的分頁；使用本機靜態伺服器與 `127.0.0.1`，不安裝套件、不呼叫外部服務。\n\nChrome 階段至少驗證：\n\n- 實際滑鼠／觸控拖放、點擊與鍵盤操作，不只用程式直接改 state。\n- 選卡後場景沒有洩漏目標；中文、英文、提示與進度在正確區域且不互相疊住。\n- 句子組合詞塊可讀、打亂、可退回；錯誤後提示下一步但不直接填答案。\n- 從拿到最後物件到解鎖、點出口的完整狀態鏈可操作；不可出現「資料已完成但門沒有命中區」的假完成。\n- 桌面與至少一個窄 viewport 的裁切、遮擋、溢位、焦點與可讀性。\n- console error／warning、頁面錯誤覆蓋層、實際 viewport、URL、操作序列與截圖證據。\n\n若 Chrome 工具不存在、無法啟動或無法取得實際操作證據，結果只能是 `DOM_ONLY` 或 `CHROME_BLOCKED`，不可宣稱視覺驗證完成。這不是失敗的 DOM 結果，而是未完成的第二關。\n\n## 輸出狀態與交付格式\n\n依證據使用下列狀態：\n\n- `intake-only`：輸入不足，尚未能建立行為假設。\n- `behavior-hypothesis-ready`：觀察、替代原因與最小測試已列出。\n- `challenge-ladder-ready`：階梯、支援、升級與回退條件已列出。\n- `dom-pass`：Gate A 的每項證據都通過。\n- `dom-blocked`：DOM、狀態、答案洩漏或可操作性有阻塞。\n- `chrome-pass`：DOM 通過後，Chrome 有實際視覺與操作證據。\n- `dom-only`：DOM 通過，但 Chrome 能力不存在或尚未執行。\n- `teacher-review-required`：功能可驗證，但內容、年段適切性或提示洩漏仍要教師裁決。\n\n交付摘要固定包含：`scope`、`evidence_ledger`、`behavior_hypotheses`、`challenge_ladder`、`answer_leak_audit`、`state_recovery_matrix`、`dom_gate`、`chrome_gate`、`decision`、`uncertainty`。可直接套用 `assets/review-template.md`；欄位沒有證據時填 `unknown`，不要補猜測。\n\n需要契約欄位、狀態碼或 gate 證據細節時，再讀 `references/behavior-review-contract.md`。只有要產出審查紀錄時才讀 `assets/review-template.md`，避免把模板內容誤當成實際測試結果。\n"},{"id":"quest-threejs-adoption","name":"闖關遊戲 Three.js 導入","cat":"art","sum":"在闖關遊戲中逐步加入 Three.js 3D，作答與學習狀態仍留在網頁層。","when":"想讓闖關有 3D 畫面時","text":"---\nname: quest-threejs-adoption\ndescription: Guide teachers and developers to progressively add Three.js to a web educational quest game while keeping learning state and accessible operation in DOM. Use for 闖關遊戲 Three.js 導入、教師 3D 闖關 Workflow、3D 教學物件 Pilot、DOM baseline 與 Three.js art island planning. When no material is supplied, produce only a teacher intake and blank contracts; do not invent teaching content. Do not use for rebuilding a scene from one image; use image-to-3d-scene instead.\n---\n\n# 闖關遊戲 Three.js 導入\n\n## 定位\n\n協助教師把「確實需要空間理解」的內容，以小型 Pilot 漸進加入 Web 闖關遊戲。Quest State 與 DOM 永遠承擔題目、得分、進度和等價操作；Three.js 只作可關閉的 3D 美術與互動層。\n\n本 Workflow 為實驗版規格流程，尚未代表通過真實課堂 Pilot。\n\n## 分支判斷\n\n1. **沒有教材或案例**：使用 `assets/teacher-intake-template.md`，輸出 `intake-only`。不得猜教材、年段或學習目標。\n2. **只有教材，尚無闖關規格**：先使用 `$material-to-quest-game` 建立 `web` 分支，再回到本 Workflow。\n3. **已有 Web 闖關規格與學習目標**：先分類這個 3D 的角色，再判斷是否不可替代。\n   - **遊戲美術層**（關卡入口、地圖、寶箱、Boss、演出、粒子、天氣）：與學習成效無關，僅以動機、成本與可及性決定；預設維持 2D／DOM，不進學習證據流程。\n   - **學習物件層**：內容本身是否為立體、且 2D 會遺失深度／遮蔽／內部構造？（判準：把它轉一圈，會不會看到平面圖看不到的東西？）\n     - 否（文字、公式、平面圖表、時間軸、2D 拖曳）：維持 DOM／SVG；大量 2D 畫面才評估 PixiJS。\n     - 是（如立體幾何剖面、向量與空間座標、電磁場與力的方向、拋體與圓周運動軌跡、分子結構、地層、機械傳動、人體解剖）：3D 能幫助空間理解，主動引導使用者建置 3D 教學物件 Pilot（進 Gate 2–3）。\n4. **只有一張場景參考圖且要求重建展示頁**：改用 `$image-to-3d-scene`。\n5. **要求建立程式或安裝套件**：先完成本 Workflow 全部契約、project-local Task Packet、安裝防重檢查與精確預覽；未核准前停止。\n\n## 執行流程\n\n### Gate 0：教師 Intake\n\n確認教材、學習目標、年段、場域、Web 分支、Pilot 物件、目標裝置、網路、可及性、評量方式、資產政策與可用時間。缺少會改變教學設計的資料時，只輸出缺件報告。\n\n### Gate 1：先完成 DOM-only baseline\n\n規格必須讓 WebGL 關閉、裝置過慢或教師停用 3D 時，學生仍能完成同一學習任務。每個 3D hotspot 都要有完整 DOM 等價操作。\n\n### Gate 2：單一 3D 教學物件\n\n第一個 Pilot 只含一題、一個 3D 物件、3–5 個熱點，以及旋轉、縮放、剖面或拆解中的必要操作。不製作 3D 地圖、戰鬥、物理、自由走動或多人連線。\n\n### Gate 3：建立契約\n\n以 `assets/` 內模板產生下列檔案：\n\n- `teacher-intake.md`\n- `quest-3d-use-case.md`\n- `scene-art-spec.md`\n- `scene-event-contract.md`\n- `asset-ledger.md`\n- `performance-budget.md`\n- `pilot-acceptance-checklist.md`\n- `pilot-budget-and-kill-switch.md`\n\nScene Event 至少含 `contractVersion`、`eventId`、`sceneInstanceId`、`questRevision`、`correlationId`、`type` 與 `payload`。使用 `object.collectRequested`，不要讓 `animation.completed` 控制進度。\n\n### Gate 4：驗證與停止判斷\n\n比較 DOM-only 與 3D 版的任務完成率、完成時間、迷思概念、教師觀察及學生不適。效能以命名裝置與網路量測冷啟動 P50／P95、frame-time、記憶體、draw calls、10 分鐘連續操作與降級結果。\n\n若 3D 沒有可觀察的學習增益、兩輪仍無法辨識、造成不適或超過 Pilot 預算，回退 DOM／SVG。\n\n### Gate 5：延後擴張\n\n第一個 Pilot 通過後，第二個不同類型 Pilot 才可評估 3D 關卡地圖。至少兩個不同類型 Pilot 通過，且完成一次「只列重複、不急著抽共用模組」的排練後，才評估共用 Adapter、編輯器或成熟 Skill。\n\n## 資產與授權\n\n- 第一個 Pilot 只用自製或直接驗證的 CC0 資產。\n- 聚合站只作搜尋線索；ledger 同時記錄聚合頁與原作者頁。\n- 輸入影像也要記錄作者、來源與授權；不得把未授權圖片轉成衍生 3D 資產。\n- Tiny World Builder 只作清淨室概念參考：規格整理者不讀 source，實作者不採用其 AGPL 程式碼或專有識別符。\n\n## 可及性與安全\n\n- 提供鍵盤、觸控、螢幕閱讀器與 DOM 等價路徑。\n- `prefers-reduced-motion` 必須停用鏡頭過場、晃動與非必要動畫。\n- 檢查 WCAG 2.3.1 三閃、動暈、動態背景上的文字對比、靜音與焦點順序。\n- WebGL context loss、載入失敗與 Kill Switch 不得破壞 Quest State。\n- 不載入未知遠端模型，不收集或輸出學生個資。\n\n## 輸出狀態\n\n- `intake-only`：缺少案例資料，只輸出教師 intake。\n- `spec-ready`：契約完整，但未建立程式、未安裝套件。\n- `implementation-preview`：具 project-local Task Packet、安裝預檢與精確變更預覽，等待核准。\n- `pilot-evidence-ready`：只有真實裝置、瀏覽器與教學比較證據齊全時才可使用。\n\n詳細欄位與 synthetic 示例見 `references/workflow-contract.md`；示例不得當成課程事實或課堂成效證據。\n"},{"id":"image-to-3d-scene","name":"圖片轉 3D 場景","cat":"art","sum":"把一張場景圖片重建成可環繞的 Three.js 3D 展示頁，用截圖比對到可以公開。","when":"手上有參考圖、想做 3D 場景時","text":"---\nname: image-to-3d-scene\ndescription: 'Rebuild a supplied scene image as an interactive, freely orbitable Three.js 3D showcase page that faithfully matches its spatial layout, lighting, palette, and atmosphere using only procedural assets (canvas textures, shaders, particles — no image generation), then verify fidelity by serving the page, screenshotting it in a real browser, and comparing against the original until publishable. Use whenever the user provides or references an image and wants a 3D or interactive scene built from it — 圖片轉3D, 3D 展示頁, 可環繞場景, hero section, product showcase, portfolio landing — even if Three.js is not mentioned. Not for photogrammetry or 3D model file export (GLB/OBJ/FBX).'\n---\n\n# 圖片轉3D\n\nTurn one scene image into a polished, orbitable Three.js showcase page that faithfully reconstructs the image's spatial layout, lighting, and atmosphere — procedural assets only, verified by screenshot comparison against the original.\n\nRespond to the user in their language (zh-TW by default in this workspace). Page UI strings follow the scene's implied audience.\n\n## Operating principles\n\n- **No image generation exists here.** Every material is procedural: canvas textures, shaders, gradients, noise, particles. Treat this as an advantage — tiny files, instant load, crisp at any resolution.\n- **Fidelity comes from the verify loop, not the first draft.** The page gets opened in a real browser, screenshotted, compared with the original, and fixed. Minimum two rounds.\n- **Faithful-stylized beats uncanny-realistic.** Match space, light direction, palette, and mood exactly; simplify surface detail deliberately. Never promise photorealism from primitives.\n- **The quality bar is 可公開發佈**: zero console errors, smooth orbit incl. touch, responsive resize, polished overlay, subtle idle motion. Say so in one line when delivering.\n\n## Workflow\n\n### 1. Analyze the image before any code\n\nView the image with the Read tool. If no image was provided, ask for one — the only blocking question. Then write a compact scene spec:\n\n| Field | Capture |\n|---|---|\n| Layout | Objects, positions, depth order, rough scale; original camera height + angle |\n| Geometry plan | Primitive per object: box / plane / cylinder / lathe / extrude / InstancedMesh |\n| Lighting | Key light direction + color temperature, fill, ambient, shadow hardness |\n| Palette | 6–8 dominant hex colors read off the image |\n| Atmosphere | Fog/haze, time of day, weather, mood |\n| Style call | stylized-faithful / low-poly / realistic-leaning — whichever can actually hit the bar |\n\nState the style call to the user in one line while building; do not wait for permission.\n\n### 2. Build the single-file page\n\nOne HTML file. Use the repository's existing local Three.js dependency or approved local vendor files; do not fetch a CDN or install a package automatically. If a local runtime is unavailable, stop at implementation preview and mark the route deferred. Full skeleton and recipes: [references/threejs-recipes.md](references/threejs-recipes.md) — read it before writing the page. Non-negotiables:\n\n- `outputColorSpace = SRGBColorSpace` + ACES tone mapping (without these, colors will not match the image)\n- Default camera pose reproduces the original image's composition — this is the shot that gets compared\n- OrbitControls with damping; clamp polar/azimuth/distance so the set never shows its unbuilt back side\n- Lighting rig and fog straight from the scene spec\n- Subtle idle life (drift, flicker, particles) so the scene never feels frozen\n- Overlay: title + 「拖曳環繞・滾輪縮放」 hint that fades on first interaction\n- Resize handler, `pixelRatio` capped at 2, works with touch\n\n### 3. Verify loop (mandatory, ≥2 rounds)\n\nES modules do not load over `file://` — serve the folder on localhost (any static server), then:\n\n1. Open the page in the browser pane, wait for first render, screenshot.\n2. Compare against the original image: composition from the default camera, proportions, palette, light direction, mood. List concrete diffs.\n3. Check zero console errors; drag the scene with the pointer to confirm orbit + damping actually work; watch for z-fighting and clipping while orbiting.\n4. Fix, re-screenshot. Stop when remaining diffs are taste, not error.\n\nThe default-camera screenshot must read as a recognizable sibling of the original image. If no browser tooling is available in the current environment, say plainly that visual verification was not performed — never claim it was.\n\n### 4. Deliver\n\n- Report the file path, the serve command, verification rounds run, and what changed per round.\n- Keep delivery local to the current workspace. If a standalone artifact needs a self-contained Three.js bundle, use only an already-approved local vendor file; do not download one automatically.\n\n## User add-ons\n\nWhen the user asks for extras (each has a recipe in the references file):\n\n| Request | Approach |\n|---|---|\n| 燈光效果 | Spotlights, emissive practicals, UnrealBloomPass |\n| 背景音樂 | WebAudio, gated behind first user gesture |\n| 天氣變化 | Particle systems + fog/lighting state lerp |\n| 鏡頭運動 | Eased intro flight to the default pose; optional slow idle orbit |\n| 使用者互動 | Raycaster hover/click highlights |\n| 粒子特效 | Additive-blended `THREE.Points` |\n\n## Scope honesty\n\nNot photogrammetry, not depth estimation, no GLB/OBJ export claims. Report actual screenshot findings — if the third round still misses the mood, say which part misses and what the next lever would be.\n\n\u003c!-- Origin: adapted from a community Codex prompt (image → Three.js scene, ImageGen assets); rebuilt for Claude/Codex dual runtime with procedural assets and a browser screenshot verify loop. -->\n"},{"id":"text-to-creature","name":"文字造獸","cat":"art","sum":"一句話生成可用在遊戲裡的 3D 生物（含骨架與動畫），用不知情的盲讀剪影做品管。","when":"需要 3D 角色或生物時","text":"---\nname: text-to-creature\ndescription: 文字造獸（text → game-ready 3D creature）。當使用者要「用一句話／一段描述生成一隻可用於遊戲的 3D 生物」時觸發——產生帶骨架、動畫、頂點著色的 glTF/GLB，走 anyCreature 引擎（程序化、無美術資產、engine 零依賴）。核心紀律：一句下單＋最多兩個澄清問題 → 寫 ACS JSON spec → `node engine/cli.js` 編 GLB → 用「瀏覽器 render + 不知情 subagent 盲讀剪影」做免裝品管閘（設計者不能自評）→ 交付 GLB＋離線 viewer。動畫要順：引擎只有線性內插，須加密關鍵影格假造 easing、驅動關節根、子關節做跟隨、端點回原點無縫循環。反觸發：2D／DOM／CSS 動畫、皮影戲（用 shadow-movie）、改既有 mesh 檔、單純美術分鏡（visual-art-storyboard）、或不需要 3D 生物的任務。\nmetadata:\n  type: reference\n---\n\n# 文字造獸（text-to-creature）\n\n把「一句生物描述」變成一隻**遊戲可用的 3D 生物 GLB**（帶骨架＋動畫＋頂點色＋離線 viewer），走 [anyCreature](https://github.com/Ariescar/anyCreature) 引擎：純程序化、不吃任何美術資產、**核心引擎零 npm 依賴**。\n\n此 skill 是**流程與品管紀律**，不是產生器；幾何由 anyCreature 的 `engine/` 編出、品管靠「瀏覽器 render + 盲讀 subagent」替代官方的 Playwright/Python 那套。價值在：① 引導出可編譯的 spec；② 用免裝盲讀閘客觀判「這隻讀不讀得出來」；③ 讓動畫在只有線性內插的引擎上看起來順。\n\n## 觸發 / 反觸發\n\n- **觸發**：文字造獸、一句話生成 3D 生物、程序化生物、anyCreature、make a creature、遊戲用怪物/動物 GLB。\n- **反觸發（優先）**：2D／DOM／CSS 動畫；皮影戲 → `shadow-movie`；把既有 mesh/貼圖檔改一改；純角色/場景分鏡美術 → `visual-art-storyboard`；一張圖轉 3D 展示頁 → `image-to-3d-scene`；不需要 3D 生物的任務。\n\n## 免裝架構（本 skill 的核心賣點）\n\nanyCreature 的核心是「spec → 幾何數字」，**畫不畫像素分兩層**：\n\n| 步驟 | 官方做法 | 本 skill 免裝做法 |\n|---|---|---|\n| 編 GLB | `node engine/cli.js`（node 內建 fs/path，零依賴） | 同 ✅ 免裝 |\n| 剪影 render | Playwright + Chromium（要 npm + 下載瀏覽器） | 瀏覽器分頁 + CDN three.js（`assets/silhouette_gate.html`） |\n| 剪影度量 | Python numpy/pillow | 瀏覽器 canvas `getImageData`，或盲讀者目測 |\n| 盲讀品管閘 | `judge.mjs` 模型判讀 | fresh-context **subagent** 盲讀 |\n\n→ 整條「造生物＋品管」可零本地安裝，只用 node、一個可驅動的瀏覽器、一個 Claude subagent。\n\n## 流程\n\n### 0. 準備 engine（一次性）\n`engine/` 零依賴，不需安裝，只需取得一次。優先用本機既有 clone；否則：\n```bash\ngit clone --depth 1 https://github.com/Ariescar/anyCreature.git\n```\n（clone 不是「安裝套件」；engine 只 `require('fs')`/`require('path')`。官方 `setup.sh` 裝的 three/playwright/python 只給官方品管用，本 skill 不需要。）\n\n### 1. 下單與訪談\n接一句生物描述（\"a menacing mountain giant\"）。**最多問兩個**會改變造型的澄清問題（體型比例？招牌部位？氣質偏兇/萌？），問完就做。\n\n### 2. 寫 ACS spec\n依 `references/acs-quickref.md` 寫 JSON：`joints → chains → volumes → parts → shading → animations`。關節即點、引擎自己推理比例；雙側用 `mirror`。先求**剪影可辨識**再談細節。\n\n### 3. 編譯（免裝）\n```bash\nnode engine/cli.js spec.json out/creature.glb\n```\n看輸出 JSON 的 `\"checks\":\"all green\"` 與 `\"contract\":\"ok\"` 才算過。\n\n### 4. 免裝盲讀品管閘（設計者不能自評）\n1. 用 `assets/silhouette_gate.html?glb=\u003c你的GLB>` 在瀏覽器 render 四視角**純黑剪影**、存成 PNG。\n2. 開一個**完全不知情的 subagent**（只給 4 張圖、不提你想做什麼），問「這是什麼動物」。\n3. 認得出＝Gate 1 過；認錯或認不出＝剪影未過，**回頭把剪影做更大膽/更清楚**，別自己說「這看起來就是 X」。後續每輪只能更有辨識度、不可退步（Gate 2）。\n\n### 5. 動畫（要順）\n引擎只有**線性內插**，所以：\n- **加密關鍵影格**：每個往復用正弦取樣 ~8–12 點，而非只 `[0, 峰值, 0]`——這是「不 robotic」的最大槓桿。\n- **驅動關節根、子關節做跟隨**：關節階層會自動帶動子關節；子關節只加小幅、相位延後的 follow-through。\n- **無縫循環**：每條 track `t=0` 與 `t=1` 同值。\n- 軸向慣例（照 wolf 範例）：尾巴左右擺＝`ry`；頭上下點＝`rx`；腿彎＝`rx`（`LFront*/LBack*`）；四足對角步態用 `mirror_phase:0.5`。\n- schema 與更多細節見 `references/acs-quickref.md`。\n\n### 6. 交付\n- `out/creature.glb`（標準 glTF 2.0，可進任何 three.js / `\u003cmodel-viewer>` / Babylon）。\n- 用 `assets/viewer.html?glb=\u003cGLB>&clip=\u003cclipName>` 給離線預覽；要單檔可雙擊版就把 GLB base64 內嵌進 viewer。\n\n## Model 路由（依專案慣例）\n\n- 計畫、品管判斷、盲讀閘裁決＝主 session（Opus）。\n- 大量寫 spec／調動畫這類粗工可派 `codex:codex-rescue`（gpt-6-luna max：任務文字帶 `--model gpt-6-luna`，不覆寫 effort）；**在 C: 類可寫路徑工作，別讓它寫進唯讀/同步磁碟**。\n- 任何安全敏感（憑證、外部 mutation）永不進 Codex。\n\n## 邊界（誠實）\n\n- 這是 **3D 骨骼 clip 播放**，不是 2D/DOM 動畫，也不做 morph target／IK／物理。\n- 「造型美不美」是 spec 的 geometry/shading 決定，**動畫改不了**；要更好看得改 spec 的 volumes/silhouette/配色。\n- 盲讀閘替代了官方 render 那套，但**不等於**官方的像素級 mask 度量；要嚴格數值就自己在 canvas 算 bounding box/質量分佈。\n"},{"id":"procedural-world-field-metrics-workflow","name":"程序化場景共用世界與量測迭代工作流","cat":"art","sum":"程序化場景的共用世界欄位、材質與效能量測，讓視覺迭代有可回溯的證據。","when":"3D 場景要反覆調整時","text":"---\nname: procedural-world-field-metrics-workflow\ndescription: 建立可重現的程序化場景 workflow：抽取共用世界欄位、接入材質與生態模組、執行固定條件的截圖與效能量測。當任務涉及 WorldField、程序化地形、植被 instancing、材質烘焙、baseline/candidate 比較或需要把主觀視覺迭代變成可回溯證據時使用。\n---\n\n# 程序化場景共用世界與量測迭代工作流\n\n## 核心原則\n\n將工作拆成三層：\n\n1. 可攜契約：`WorldSpec`、`WorldSample`、`GpuCacheManifest`、`CapturePlan`、`CaptureReport`。\n2. 參考實作：世界欄位、材質烘焙、生態實例化、capture metrics 四個模組。\n3. Workflow：輸入盤點、fixture、固定 capture、量測、verdict 與交接報告。\n\nCPU 世界欄位是 canonical source；GPU texture 只能是有誤差預算的快取。不要複製第三方 repo 的程式碼、素材或未驗證效能宣稱。\n\n## 執行流程\n\n1. 先讀取專案治理、核准計畫與現有 task state；確認 Skill／projection 防重預檢已通過。\n2. 定義 `WorldSpec`：schema／generator 版本、座標系、bounds、grid、root seed、RNG algorithm、具名 RNG streams、feature source digest。\n3. 實作 `WorldField.sample(xM, zM)` 與 `sampleBatch`。MVP 只支援有限網格、單一無分岔路徑與一個地形來源。\n4. 固定欄位語意：距離用公尺、比例用 `0..1`、path 要有 `featureId`／進度／帶符號距離／半寬；超界回傳 `valid=false`，不可默默夾到邊界。\n5. 將連續通道與分類欄位分開。`zone`、`surfaceTag`、`roofDensity` 與多路徑語意不是 MVP 欄位，也不可對分類 texture 做線性插值。\n6. 建立 `GpuCacheManifest`，記錄通道格式、編碼、濾波、no-data 與每欄 `maxAbsError`；以 golden points 做 CPU/GPU parity test。\n7. 建立 `CapturePlan`：固定 baseline/candidate build hash、world hash、viewport、DPR、瀏覽器／GPU、tier、camera poses、warmup、simulation time 與 temporal freeze policy。\n8. 每次只改一個 named parameter，交錯執行 baseline/candidate；收集 frame time/p95、draw calls、triangles、像素統計、PNG 與 diff。\n9. 效能優先使用 timer query；若只有 fence 同步的 wall-frame time，必須在報告標明方法，不能冒稱純 GPU time。\n10. 套用 verdict：門檻通過為 `pass`，明確超標為 `fail`，缺少可靠視覺門檻或量測方法不可用為 `inconclusive`，並標 `needs_review`。\n\n## 驗證與交付\n\n- 先寫會失敗的契約與邊界測試，再做最小實作；維持 RED → GREEN → REFACTOR。\n- 至少測試：同 seed fingerprint 三次一致、不同 seed 可辨識、具名 RNG stream 不漂移、邊界／超界、GPU parity、缺 stop、效能超標與無視覺門檻。\n- 將 JSON report、PNG、diff、設定 fingerprint 與測量環境一起保存；不要只回報「看起來比較好」。\n- 完成後交 fresh verifier；`REFUTED` 必須修正後複驗。Skill canonical 檔可建立，但 `.claude`／`.agents` projection 必須先預覽並取得另外的使用者核准。\n\n## Reference implementation\n\n若目前專案提供參考實作，先由 Runtime Context 解析其 repository-relative 路徑，再執行 `node --test` 或專案的 `npm test`；不需安裝外部套件。若參考實作不存在，只交付契約、測試計畫與量測報告格式，不假造已執行結果。\n"},{"id":"visual-art-storyboard","name":"美工與分鏡設計","cat":"art","sum":"規劃美術方向、角色、場景與素材提示詞，需要時加上八格分鏡。","when":"需要角色、場景或分鏡時","text":"---\nname: visual-art-storyboard\ndescription: 規劃美術方向、角色、場景、素材提示與可選的八格連續分鏡。當使用者提到美工、美術設計、角色設計、場景設計、分鏡、運鏡八格、/gb、PREVIS、連續動作、Pixel Art 分鏡，或闖關遊戲需要角色／場景視覺規劃時使用。分鏡預設關閉；沒有明確要求時，只在多場景、連續動作或鏡頭演出能帶來明顯價值時詢問一次。/Hyperframes 屬影片流程，不在本 Skill 執行。\n---\n# 美工與分鏡設計\n\n## 核心原則\n\n- 預設使用 `art-only`：只規劃美術方向、角色、場景與素材，不自行加入分鏡。\n- 使用者輸入 `/gb`、`運鏡八格` 或明確要求分鏡時，直接切換為 `storyboard-on`，不重複詢問。\n- 未明確要求時，只有內容包含多個重要場景、角色連續動作、鏡頭移動或敘事轉折，才詢問一次：\n  `是否要加入八格分鏡設計？若不需要，我會只完成角色與場景美術規格。`\n- 使用者拒絕、略過或未回答非必要詢問時，繼續 `art-only`，不得阻塞主要任務。\n- 靜態圖示、單張角色立繪、單一背景、UI 裝飾或簡單資產清單不詢問分鏡。\n\n## 執行流程\n\n1. 確認用途、受眾、媒介、風格、尺寸／比例、角色與場景限制，以及既有參考素材。\n2. 建立美術方向：視覺語彙、色彩、光線、構圖、角色辨識特徵、場景層次與資產清單。\n3. 維持角色一致性：固定服裝、輪廓、比例、配色、道具、表情範圍與不可變特徵。\n4. 若啟用分鏡，讀取 [分鏡提示與八格契約](references/storyboard-prompts.md)，建立八個連續鏡頭。\n5. 使用者明確要求生成圖片且目前環境具備圖片生成工具時，依核准提示生成；否則只交付可直接使用的生成提示與分鏡規格，不宣稱已產圖。\n\n## 八格分鏡契約\n\n- 預設為 8 個連續畫格，可用 2×4 版面呈現。\n- 每格標示：景別、鏡頭方向／運動、角色動作、場景變化、敘事目的與銜接點。\n- 固定角色外觀、道具、光源方向、左右位置與空間軸線；任何變化都要能由前一格推導。\n- 避免把八個無關插圖拼在一起；每格必須推進同一段事件。\n- Pixel Art 分鏡須固定像素密度、調色盤、角色比例與輪廓，不在畫格間任意改變解析風格。\n\n## 闖關遊戲整合\n\n- 接收 `material-to-quest-game` 的 `asset-spec.md`、`level-map.md` 或場景需求。\n- 只有關卡包含具名角色、重複出現的場景、連續動作、Boss／事件演出或需要鏡頭節奏時，提醒使用者可選用本 Skill。\n- 使用者同意後，把八格分鏡對應到關卡事件、玩家操作、回饋與轉場；不同關卡不得混成同一段連續鏡頭。\n- 使用者不同意時，保留原闖關遊戲流程，只完成資產規格。\n\n## 邊界\n\n- `/gb` 是圖片分鏡快捷指令；`/Hyperframes` 是影片生成流程，兩者不得視為同一功能。\n- 使用者要求影片、補幀、動態生成或影片模型參數時，停止在分鏡與提示交接，不自行啟動 `/Hyperframes`。\n- 教育內容避免只靠顏色傳達關鍵資訊，並確保角色、符號與場景符合年齡及文化情境。\n\n## 輸出契約\n\n`art-only` 輸出美術方向、角色／場景規格、資產清單與生成提示。\n\n`storyboard-on` 另輸出八格分鏡表、角色一致性錨點、鏡頭連續性檢查，以及可直接交給圖片生成工具的完整提示。\n"},{"id":"pixel-ai-secretary","name":"Pixel AI 美術提示詞祕書","cat":"art","sum":"產生同一個角色的像素風 AI 祕書提示詞包，維持角色一致。","when":"需要一致的像素風角色時","text":"---\r\nname: pixel-ai-secretary\r\ndescription: >\r\n  Create safe prompt packages for turning a reference person or default character\r\n  brief into a consistent same-character Pixel Art virtual AI secretary library.\r\n  Use when Claude or Codex needs to produce character-lock prompts, a baseline character\r\n  sheet prompt, one-action four-view reference sheet prompts, safety rewrites,\r\n  negative prompts, or reusable prompt-package Markdown for a 16-bit anime pixel\r\n  art office assistant character. This v1 skill only writes prompts and does not\r\n  generate images, call image APIs, batch-run assets, or handle API keys.\r\n---\r\n\r\n# Pixel AI 美術提示詞祕書\r\n\r\n## Do Not Use When(anti-triggers)\r\n- 一般 pixel art 或 Canvas 遊戲(→ instincts/pixel-agents-canvas)\r\n- 非固定角色的一次性圖像 prompt\r\n\r\n## Overview\r\n\r\nUse this skill to convert a reference person or the default character brief into\r\na prompt package for a same-character Pixel Art AI secretary library. The output\r\nis text-only: baseline prompt, action plan, one-action four-view prompt, reusable\r\ntemplate, negative prompt, and validation checklist.\r\n\r\nHighest priority order:\r\n\r\n1. Character identity\r\n2. Pixel art style\r\n3. Action or pose\r\n4. Scene composition\r\n\r\n## Capability Statement\r\n\r\nStart every run by stating these limits in plain language:\r\n\r\n- Can produce prompts, prompt packages, safety rewrites, and checklists.\r\n- Can preserve explicit character identity instructions in every prompt.\r\n- Can rewrite risky actions into professional, office, or everyday scenes.\r\n- Does not directly generate images in v1.\r\n- Does not guarantee model-side face consistency; it only maximizes prompt-side consistency.\r\n- Does not batch call image APIs or manage API keys.\r\n\r\n## Inputs\r\n\r\n- `reference_image`: optional. If present, label it as the identity reference.\n- `character_notes`: optional traits to preserve from the reference person.\n- `actions`: optional list of actions. Default to `遞文件`.\n- `output_path`: optional. Default, when saving is requested:\n  `outputs/pixel-ai-secretary-prompt-package.md`.\n\r\nIf no reference image is provided, use the default Character Bible below.\r\n\r\n## Character Bible\r\n\r\nUse these stable character details unless the user explicitly overrides them:\r\n\r\n- young adult East Asian virtual AI secretary\r\n- long black hair\r\n- straight bangs\r\n- soft pale skin\r\n- gentle neutral expression with a cool professional tone\r\n- white office shirt\r\n- gray inner top\r\n- black office skirt or black suit pants\r\n- office ID card\r\n- office accessories\r\n- professional OL atmosphere\r\n- Pixel Art / 16-bit anime pixel style\r\n\r\nNever use \"young female\" as the character phrase. Use \"young adult East Asian\"\r\nto avoid age ambiguity.\r\n\r\n## Required Prompt Locks\r\n\r\nInsert this identity lock into every positive prompt:\r\n\r\n```text\r\nsame character as reference image,\r\nmaintain identical face,\r\nmaintain facial identity,\r\nsame hairstyle,\r\nsame bangs,\r\nsame facial proportions,\r\nsame eye shape,\r\nsame skin tone,\r\nconsistent character identity,\r\npreserve original appearance\r\n```\r\n\r\nInsert this pixel style lock into every positive prompt:\r\n\r\n```text\r\nhigh detail pixel art,\r\n16-bit anime pixel style,\r\nretro Japanese game aesthetic,\r\nsoft pixel shading,\r\ndetailed pixel eyes,\r\ncinematic pixel lighting,\r\ncozy office atmosphere,\r\nclean composition,\r\ngame character reference sheet\r\n```\r\n\r\nLoad detailed reusable components from `references/prompt-components.md` when the\nrequest includes multiple actions, risk-prone actions, or asks for an output\npackage that should be saved. Use `templates/prompt-package.md` for the final\npackage shape; both files are bundled in this Skill.\n\r\n## Safety Rewrite Rules\r\n\r\nBefore writing the final prompts, normalize each requested action.\r\n\r\n| User action | Safe prompt action |\r\n| --- | --- |\r\n| `洗澡沐浴` | `daily grooming at a bathroom sink, wearing complete home loungewear or a modest robe, tidy bathroom setting, focus on face, hair, and routine objects` |\r\n| `躺在椅子上熟睡` | `briefly resting in an office chair, face and hairstyle visible, calm office mood, professional outfit kept neat` |\r\n| `運動伸展` | `office wellness stretching, loose sporty jacket, neutral posture, balanced framing` |\r\n| `低角度` | `desk-height spatial perspective focused on room depth, desk planes, and environmental perspective` |\r\n\r\nApply the same principle to any risky clothing, camera, or pose wording: rewrite\r\nit as professional, fashionable, office, or everyday activity wording. Keep the\r\nscene professional and character-focused.\r\n\r\n## Workflow\r\n\r\n1. State capability and v1 limits.\r\n2. Decide whether the input uses a reference image or default Character Bible.\r\n3. Build a short `Character Bible` section.\r\n4. Normalize the action list with the safety rewrite table.\r\n5. Output Step 1 baseline character prompt first.\r\n6. Output the action list.\r\n7. For each requested action, output one four-panel prompt only. Do not combine\r\n   multiple actions into one image prompt.\r\n8. Use these fixed four views for every action:\r\n   - front view\r\n   - side view\r\n   - top-down view\r\n   - desk-height spatial perspective\r\n9. Output the negative prompt.\r\n10. Output the validation checklist.\r\n11. If saving is requested, write the package through Runtime Context under the\n    default repository-relative output path unless the user provides another\n    approved repository-relative path.\n\nUse `templates/prompt-package.md` for the final package shape.\n\r\n## Output Contract\r\n\r\nEvery prompt package must include:\r\n\r\n- Title\r\n- Capability and limits\r\n- Character Bible\r\n- Reference image handling note\r\n- Step 1 character lock sheet prompt\r\n- Safe action list\r\n- First action four-view prompt, default `遞文件`\r\n- Reusable one-action four-view template\r\n- Negative prompt\r\n- Identity / Style / Safety / Composition checklist\r\n\r\nThe positive prompts must not include banned safety terms. Banned terms belong\r\nonly in the negative prompt or safety documentation.\r\n\r\n## Validation\r\n\r\nBefore finalizing, verify:\r\n\r\n- The output includes the identity lock in every positive prompt.\r\n- The output includes the pixel style lock in every positive prompt.\r\n- The default action is `遞文件` when no action is provided.\r\n- Each action is separate and produces exactly one four-view prompt.\r\n- Risk-prone actions are rewritten before prompt generation.\r\n- The package does not ask the image model to produce text, logos, or watermarks.\r\n- The package stays prompt-only and does not call image generation tools.\r\n- Saved output, if any, stays inside the current workspace and uses a\n  repository-relative path.\n"},{"id":"shadow-movie","name":"皮影戲網頁電影","cat":"art","sum":"把故事、劇本與分鏡做成傳統皮影戲風格的網頁電影。","when":"想用故事動畫講課文或歷史時","text":"---\nname: shadow-movie\ndescription: 將故事、劇本與分鏡轉換為傳統皮影戲風格的可播放 HTML 網頁電影；使用 v0.2 結構化 JSON、可混用的 SVG／PNG 資產、24 FPS 時間軸、骨架／物件連動、核准主視覺錨點與可驗證的本機 Build 流程。當使用者提到皮影戲、皮影動畫、皮影電影、故事轉皮影、/shadow 或 shadow-movie 時使用；不適用於需要音效、互動問答或正式影片匯出的工作。\n---\n\n# 皮影戲網頁電影\n\n## 定位\n\n此 Skill 將故事依序轉換為：\n\n```text\nStory → Script → Scene → Shot → Asset → Timeline → HTML Runtime\n```\n\nv0.2 的正式輸入是結構化 JSON 與資料根目錄內的相對路徑 SVG／PNG。單一 `assets.json` 可以讓不同 asset 混用兩種格式：SVG 保留可拆解的骨架與關節語意，PNG 用於單張背景／角色或固定 artboard 的逐格動作。Runtime 與 Demo 必須由同一份資料 Build 產生，不得在 Demo 內另外維護 `ASSETS` 或 `SHOTS`。\n\n## v0.2 支援範圍\n\n- Story／Script／Scene／Shot 結構化資料。\n- 24 FPS 時間軸、相機平移與縮放、分層視差。\n- SVG／PNG 角色與背景；單張角色可用 `src`／`views`，PNG 角色也可用 `frame_sequence` 播放固定 artboard 的逐格動作。\n- 同一份 JSON 混用 SVG 與 PNG；Build 會驗證格式、PNG header／透明通道與逐格尺寸，並把素材內嵌到自包含 HTML。\n- parent-child 骨架樹、bone attachment 與可動物件掛載；可動素材需保存可稽核的 joint anchor，不能只保存圖片框的左上角。\n- 根骨架位移、支撐腳／擺動腳步態與手持物件 attachment；角色移動用 root-motion channel，信件等手持物件綁到 hand／arm 子骨架，不能逐件改舞台座標。\n- 可選 WebGPU rig compute：先算 bone world matrix，再算 attachment／prop world matrix；沒有 WebGPU 時使用同一 PoseState 的 SVG／CPU fallback。\n- 24 FPS pose clock 與 render interpolation，讓電影時間軸固定而畫面保持平順。\n- 字幕、Play／Pause／Restart／Seek／逐幀／Shot navigation。\n- 本機零外部依賴的 validator 與 Build。\n\n音效、旁白、互動 Quiz、完整 Props 素材製作、Transition 與完整 keyframe 編輯器目前是延後功能；但已生成物件的 bone attachment 與 world transform 屬於支援範圍，不得混為一談。\n\n## 必要流程\n\n1. 先讀取 [pipeline-contract.md](references/pipeline-contract.md) 與相關 Schema。\n2. 先判斷任務是否有主視覺／風格參考；有的話讀取 [master-visual-prompt.md](references/master-visual-prompt.md)，啟用 `reference-driven` 流程，先用固定 prompt 產生或確認先生圖，再把核准圖登錄為 visual anchor。\n3. 以 `from`／`to` 描述時間變化；不要新增 `startX`／`endX` 等平行欄位。\n4. 需要拆解角色或可動物件時，先建立無循環的 `rig.bones`；將 parent id 編譯為 `parentIndex` 與 `depth`，再把部件、郵袋、圍巾、信封、操偶桿等 attachment 綁到 bone-local transform。不得讓子部件各自繞固定舞台 pivot。\n5. 拆解 PNG／SVG 部件時，為每個可動件記錄 `joint_anchor`（語意角色、素材像素座標與來源尺寸），把該 anchor 映射到 bone origin；`mirror=true` 的 attachment 沒有 `joint_anchor` 時，validator 必須拒絕。鏡像只反轉 anchor 的 x 偏移，不可直接把整張圖片框的左上角拿來做負 scale。父子 bone 的 local vector 也要由素材的兩個關節 anchor 校準，例如髖→膝，而不是用估計的框座標。若 PNG 是逐格動作，八格共用同一個 artboard、anchor 與來源尺寸，使用 `frame_sequence.frames`、`hold_ticks`、`phase_ticks`、`loop` 描述時間，不在 Runtime 偷裁切或逐格縮放。\n6. 需要角色沿地面、橋面或道路移動時，將背景掛在不移動的 `world-root`，角色掛在有 `position_control` 的 `stage-root`；移動只更新 root cha
