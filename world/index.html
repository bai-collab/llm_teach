nnel，不能把位移分散到每個部件。\n7. 需要角色走路時，先由同一個 `gaitChannels(progress)` 推導 `baseWalkX`、步相位、支撐腳與前後腿角度；`stage-root.position_control` 必須同時接收 `walkX`／`walkY`。用腳端 probe 反算支撐腳接觸位置，支撐腿保持接觸，擺動腿才抬起折膝；播放與 seek 不能只更新 root。\n8. 步態驗收至少取兩個相反支撐相位，並合計前後大腿／小腿四個 channel；檢查 `walkX` 單調前進、支撐腳接觸誤差、擺動腳抬升與 CPU／GPU world matrix。只檢查當前前腿會漏掉「前腿支撐、後腿擺動」的錯誤。\n9. 需要手持信件、旗子或其他物件時，先建立 hand／grip 子 bone，再以 attachment 的 `joint_anchor` 與 bone-local offset 綁定；驗收手臂旋轉與 root 位移中段，確認物件沒有脫手。\n10. 若選用 WebGPU，依 [webgpu-rig.md](references/webgpu-rig.md) 執行 bone depth passes → object attachment pass → texture quad renderer；不能在同一個 unordered dispatch 讀取尚未完成的 parent，也不能讓 GPU 直接假裝更新 SVG DOM。圖片紋理建立、外部圖片複製與 render pipeline 必須使用 validation error scope，錯誤要顯示在 gate 狀態，不得只讓畫面靜默變黑。\n11. 所有資產路徑必須是資料根目錄內的相對路徑；不得讀取路徑外檔案或外部 URL。每個 asset 的 `format` 必須與其 SVG／PNG 副檔名一致；背景可用 `src` 作單張全幅圖，或用 `layers.far`／`middle`／`ground` 做分層視差。\n12. 依序完成 A 劇本、B 分鏡、C 素材視覺對照、D 代表幀視覺對照、E HTML 實機視覺對照；每一關都要停下來取得使用者確認。\n13. Build 前先執行 `scripts/validate.mjs`；reference-driven 任務還要執行 `scripts/validate-visual-review.mjs --required --gate C`，通過後才可正式 Build。\n14. Build 產生可重播的自包含 HTML；不要把外部 bearer URL、秘密或本機絕對路徑放入輸出。交付前要以 `--gate E` 完成最後視覺與使用者確認。\n\n## 骨架與物件連動固定規則\n\n成功的走路連動不是「每個部件的 transform 字串都改變」，而是可驗證的父子拓樸：\n\n```text\nworld(child) = world(parent) × translate(local_position) × rotate(local_rotation)\nobjectWorld = boneWorld × translate(local_position) × rotate(local_rotation) × scale(local_scale)\n```\n\n- 大腿是髖部之後的 parent；小腿是大腿的 child。大腿改變時，小腿局部 `0°` 也必須跟著膝部 world position 移動。\n- 小腿單獨改變時，膝部 world position 不可跟著漂移；只改變膝部以下方向。\n- 可動圖片的 `joint_anchor` 必須先對準對應 bone origin，再套用旋轉與鏡像；鏡像件的 anchor 必須與非鏡像件使用同一個語意關節，不能只鏡像圖片框。\n- 父子 bone 的 local position 必須等於父部件「上一個關節 anchor」到「下一個關節 anchor」的向量；驗收時要檢查 rest、正負父角度與 child-only 角度都沒有可見縫隙。\n- 物件先綁定 `boneIndex`，再進 attachment pass；不要把郵袋、圍巾或操偶桿複製成另一套固定 stage 座標。\n- 根位移使用 `position_control` 綁定到 stage-root；背景留在 world-root，角色子部件與其 prop 一起平移。\n- 步態的 `position_control` 要包含 x／y；同一個 progress 先決定 `supportFoot`，再以支撐腳 probe 和橋面函數反算 root x／y。支撐腿保持接觸，擺動腿才改變大腿／小腿角度；不可用單一 `walkX` 事件讓人物滑過舞台。\n- 前後腿的 linked check 必須同時讀取兩條腿，並保存 `maxContactError`、`walkX` 單調性與有效擺動相位的抬腳高度；矩陣一致但腳未動仍判定失敗。\n- 手持物件先掛到 hand／grip child bone，再用物件自己的 `joint_anchor` 計算 local offset；物件預設繼承手部旋轉，不能只在第一幀看起來接近。\n- 部件圖層可維持 flat SVG sibling 以保留 z-order；parent-child 關係放在 rig data／GPU buffer，不靠 nested SVG 偶然形成。\n- movie 的 pose 仍以 24 FPS 保存；render loop 可插值相鄰 pose。seek、逐幀與 restart 必須回到精確 pose，不得累積前一幀矩陣。\n- WebGPU 建立失敗、瀏覽器不支援或 shader／buffer 驗證失敗時，回到同一 PoseState 的 SVG／CPU fallback，並在驗收紀錄中標明實際 backend。\n\n詳細的 rig schema、GPU buffer layout、WGSL compute 與最低測試案例見 [webgpu-rig.md](references/webgpu-rig.md)。\n\n## 視覺錨點與視覺比對\n\n當使用者提供、核准或要求比照一張圖片時，該圖片是主視覺錨點，不只是參考靈感。先看懂它的構圖、剪影、透光材質、邊框／鏤空細節、色彩、景深與遮擋，再依同一套規則拆成關節與物件；不能只抽幾個色碼，另畫一套一般扁平幾何圖形。\n\n視覺審查與技術驗證分開：JSON／SVG／DOM／播放控制通過，只能表示「能執行」，不能表示「畫風一致」。要用輸入根目錄內的 `visual-review.json` 記錄 visual anchor、素材來源映射、C／D／E 截圖或並排證據、檢查項目與使用者核准。詳細欄位與判定規則見 [visual-review-contract.md](references/visual-review-contract.md)。\n\nreference-driven 任務的最低視覺 gate 是：\n\n- C：主視覺與拆解素材並排比對；剪影、材質、細節密度、關節／操偶桿、景深與遮擋不一致就退回修改。\n- D：檢查動畫第一幀、中段與最後一幀；走路骨架、掛載與操偶桿不能破壞素材的造型與層次。\n- E：在目標 viewport 的本機瀏覽器預覽 HTML，將代表幀與主視覺比對，再取得使用者明確核准。\n- 接點專項：逐一檢查頸、肩、髖、膝等 anchor；若 CPU／GPU 數值一致但畫面在關節處分離，仍判定 E 不通過，必須回到素材 anchor／bone vector 校準。\n- 移動／手持專項：檢查 root-motion 的第一幀、中段、最後一幀；背景不得跟著角色移動，手持物件不得脫離 grip，也不得因 arm rotation 產生可見漂移。\n- 步態專項：至少檢查前腳支撐／後腳擺動與後腳支撐／前腳擺動兩個相反相位；支撐腳要貼住橋面，擺動腳要離開支撐面，並確認 `walkX` 與兩腿 world probe 都有連續變化。\n\n可重複的結構與證據檢查由 [validate-visual-review.mjs](scripts/validate-visual-review.mjs) 執行；它不會假裝以像素差取代人的美術判斷。缺少 visual anchor、來源映射、視覺證據或使用者核准時，不得稱為完成品。\n\n## 先生圖固定 Prompt（跨對話鎖定）\n\n先生圖是後續拆解與網頁組裝的風格母版。固定使用 [master-visual-prompt.md](references/master-visual-prompt.md) 的 `prompt_id`、`prompt_version`、`STYLE LOCK` 與 Negative Prompt；只替換故事主角、場景、單一動作與構圖欄位。不要在不同對話中憑記憶改寫成另一種「差不多」的亞洲皮影戲風格。\n\n先生圖核准後，將 `prompt_id: shadow-puppet-master-visual`、版本與 `status: locked` 寫入 `visual-review.json` 的 `prompt_lock`。後續角色、背景與物件必須沿用同一核心 prompt，並在 C／D／E gate 檢查材質、剪影、關節、景深與 HTML 畫面是否仍一致；若先生圖或風格要變，必須升 prompt 版本並重新走 C gate。\n\n## 資產安全\n\nSVG 只能通過 `scripts/sanitize-svg.mjs` 的白名單檢查。PNG 必須通過 PNG signature／IHDR、尺寸與檔案大小檢查；角色與逐格角色 PNG 必須保留 alpha 透明通道，同一序列的所有 frame 必須有相同寬高。拒絕 script、事件屬性、JavaScript URL、外部資源、`foreignObject` 與未知元素。字幕和使用者文字使用 `textContent`，不可直接當 HTML 插入。\n\n## 參考資料\n\n- [pipeline-contract.md](references/pipeline-contract.md)：資料、Build、Checkpoint 與路徑契約。\n- [master-visual-prompt.md](references/master-visual-prompt.md)：先生圖固定核心 prompt、Negative Prompt、可變欄位與跨對話版本規則。\n- [visual-review-contract.md](references/visual-review-contract.md)：主視覺、素材映射、C／D／E 視覺 gate 與證據契約。\n- [feature-support-matrix.md](references/feature-support-matrix.md)：支援與延後功能。\n- [webgpu-rig.md](references/webgpu-rig.md)：骨架／物件 WebGPU buffer、WGSL、depth dispatch、插值與 fallback 契約。\n- [references/schemas/](references/schemas/)：v0.2 JSON Schema。\n\n## 指令\n\n```powershell\nnode brain/skills/shadow-movie/scripts/validate.mjs --root brain/skills/shadow-movie/demo\nnode brain/skills/shadow-movie/scripts/validate-visual-review.mjs --root \u003cdemo-root> --required --gate C\nnode brain/skills/shadow-movie/scripts/build.mjs --root brain/skills/shadow-movie --output outputs/shadow-movie\nnode brain/skills/shadow-movie/scripts/build.mjs --root \u003cpackage-root> --input \u003cdemo-root> --output \u003coutput-root> --require-visual-review --visual-review-gate C\nnode brain/skills/shadow-movie/scripts/migrate-v0.1-to-v0.2.mjs --input \u003clegacy-storyboard.json> --output \u003cstoryboard.v0.2.json>\n```\n\nBuild 預設採 create-only；若輸出目錄已存在，必須明確傳入 `--force` 才能重建，而且只允許覆寫含有本工具 `build-manifest.json` 的既有輸出。\n\n禁止用技術 validator、DOM 通過、單一色票相近或「可以播放」取代視覺比對；也禁止在未取得使用者 E gate 確認前宣稱交付完成。\n"},{"id":"explain-visual","name":"圖解先行","cat":"tool","sum":"解釋機制、流程或狀態時，先給最小的一張圖，文字只補圖說不出的。","when":"要把概念講清楚時","text":"---\nname: explain-visual\ndescription: 圖解先行（visual-first explanation）。當使用者要「理解／解釋」一個機制、流程、架構、依賴關係或狀態轉移時觸發——尤其 route plan、.harness/topology、agent 依賴圖、orchestration 流程、pilotfish/Baton 生命週期、狀態機（enum/transaction state machine）、資料流、before/after 或方案 A vs B 對比、模組重構、檔案/元件結構。原則：先給最小視覺（Mermaid／內建 show_widget 的內聯 SVG／樹狀／pseudocode／diff／custom HTML），文字只當輔助。反觸發：純事實問答、單行就能答完、使用者明說只要文字、已經很清楚不需圖、或涉及需嚴謹逐項錨定的文獻分析（那用「文獻研究」）。\nmetadata:\n  type: reference\n---\n\n# 圖解先行（explain-visual）\n\n把「用一段散文解釋複雜機制」的預設，換成「**先給一張最小的圖，文字只補圖說不出的部分**」。核心原則：Skip preamble, show visually first, explain secondarily。\n\n此 skill 是**解說風格紀律**，不是產生器；真正把圖畫好的能力來自既有工具（見「渲染路由」）。它的價值在**兩件事**：① 判斷此刻該不該給圖；② 給的話選哪一種最小形式、用哪個工具渲染。\n\n## 何時該給圖（觸發判準）\n\n出現以下之一，且文字解釋會讓讀者得自己在腦中重組結構時，改用圖解先行：\n\n- **route plan / 計畫書節點與依賴**：節點、owner/model、依賴邊、platform、verifier gate。\n- **`.harness/topology.md`、排程器狀態**：RUNNABLE / ALL_DONE / WAITING_HUMAN / DEP_ERROR / STATE_ERROR 的轉移。\n- **agent 依賴 / 分工 / fan-out**：誰產出、誰消費、哪些可平行、worktree 隔離邊界。\n- **orchestration 生命週期**：discovery→plan→approval→execution→verification 各 gate 的流動。\n- **狀態機 / 交易式流程**：狀態、觸發事件、副作用（尤其會寄信／呼叫付費 API／不可逆者）。\n- **資料流 / 檢索管線 / RAG 架構**：資料經過哪些節點、在哪裡被切/存/取。\n- **對比**：before/after、方案 A vs B、有無某條邊的差異。\n- **檔案 / 元件 / 呼叫結構**：目錄樹、component tree、call tree。\n\n## 何時不要給圖（反觸發，優先於觸發）\n\n- 純事實問答、定義、單行答案、是非題。\n- 使用者明說只要文字、或情境需要可複製的純文字。\n- 一兩句就講得清楚——**硬塞圖會讓輸出顯得 AI 生成、增加雜訊**。\n- 需要逐項頁碼/表號錨定的文獻深讀 → 用 `文獻研究`。\n- 版面/區塊/碰撞規劃 → 用 `web-layout-topology-analysis`；純數據圖表 → 用 `dataviz`。\n\n不確定時：一句話能更快說清楚，就寫那句話。\n\n## 選型：用最小的形式承載那一個重點\n\n| 內容型態 | 最小形式 |\n|---|---|\n| 邏輯 / 演算法 | pseudocode（fenced code） |\n| 執行期呼叫序 | call tree（縮排文字樹） |\n| 檔案 / 目錄 / 元件結構 | file tree / component tree（文字樹） |\n| 流程 / 依賴 / 狀態轉移 / 資料流 | Mermaid（flowchart / stateDiagram / sequenceDiagram） |\n| 兩案 / 前後對比 | 並排 SVG，或 diff |\n| 密集或需互動的概念 | custom HTML（Artifact） |\n\n一圖一主張：一張圖只回答一個問題；箭頭一律標動詞（`writes` / `invalidates` / `polls 30s`），別留「不知怎地有關」的裸箭頭；畫機制本身，不要只畫一個叫「cache」的方框。\n\n## 渲染路由（用既有工具，不自己造輪子）\n\n1. **樹 / pseudocode / diff**：直接用 fenced code block（terminal 一定讀得到，最省）。\n2. **流程 / 狀態機 / 依賴圖，想留在對話裡**：優先 `mcp__visualize__show_widget`（內聯 SVG/HTML，先 `read_me`）；或 Mermaid fenced block（Artifact/支援的 renderer 會畫）。\n3. **要一張可分享 / 可互動 / 較講究的頁**：做成 **Artifact**；此時**務必先載入 `artifact-design` 與 `artifact-diagramming`**，內聯 SVG 的機制、雙主題 token、`viewBox`、`currentColor`、marker 箭頭、`\u003cfigure>+\u003cfigcaption>` 都照那份規範走。\n\n內聯 SVG 快則：`viewBox` 定尺寸、`currentColor` 吃雙主題、只保留一個有意義的語意色、箭頭用 `\u003cmarker>` 或 `\u003cpolygon>`、文字 11–13px、長句放 figcaption 不放圖內。\n\n## 流程\n\n1. **判斷**：符合觸發、且不落入反觸發 → 給圖；否則正常回文字。\n2. **選型**：挑能講清那一個重點的最小形式。\n3. **渲染**：依上表選工具。\n4. **配一句話**：圖擺前面，文字只補圖說不出的（為什麼、注意事項、下一步）。\n\n## 反例（別做）\n\n- 為了「看起來完整」而畫的裝飾圖、把散文重講一遍的方框清單、每個名詞都框起來卻沒有一條有意義的邊。\n- 明明一句話的事，硬做成 Artifact。\n- 箭頭全裸、沒有主張、一張圖塞五件事。\n"},{"id":"web-layout-topology-analysis","name":"網頁版面拓樸分析","cat":"tool","sum":"做網頁或遊戲前先規劃版面區塊，避免重疊、遮擋與點擊衝突。","when":"動手寫網頁或遊戲之前","text":"---\nname: web-layout-topology-analysis\ndescription: >-\n  在開始製作或重構一般 Web 遊戲、塔防、Canvas、教育 Web 遊戲、Dashboard、表單或互動場景前，先把 viewport、頁面區塊、元件矩形、anchor、safe area、z-order、containment、overlap、pointer collision 與 2D／3D collision channel 整理成可稽核的 layout_plan；遊戲還必須先繪製區塊與核心圖示預覽。用於使用者要求先規劃版面、切割區塊、避免重疊／遮擋／點擊衝突、responsive layout 或 DOM／Canvas／Three.js 混合頁面；不取代瀏覽器實測、DOM／CUA 或物理引擎。\n---\n\n# 網頁版面拓樸分析\n\n## 定位\n\n在寫 HTML／CSS／React 或建立 Three.js 場景前，先建立版面與元件的空間模型。輸出 `layout_plan`，不直接修改程式、不宣稱瀏覽器實測通過，也不改寫 Harness 的 `route_plan`。\n\n使用者對內容優先級、固定與可捲動區域、可接受的裝飾重疊及 responsive 取捨擁有最後決定權。資料不足時提出問題與建議，不能用固定螢幕尺寸或猜測內容代替。\n\n## 遊戲製作硬性 Gate\n\n當任務包含遊戲、塔防、敵人、地圖、Canvas 或可互動戰鬥區時，先完成版面與圖示規劃，再允許建立或修改 HTML／CSS／JavaScript。不可先把下方工具列、商店或裝飾塞滿畫面，再回頭壓縮主要遊戲區。\n\n執行以下順序：\n\n1. 先建立至少一個桌面、一個平板或窄版的 `viewport_profile`，使用 normalized `0..1` 座標描述可視範圍、safe area 與固定／可捲動策略。\n2. 先切割 `layout_blocks`，明確分配主要遊戲區、HUD、孳生／入口區、目標／終點區、次要控制區與裝飾區的比例、最小尺寸、最大尺寸及 priority。主要遊戲區與核心目標優先於下方道具列。\n3. 在 `component_rects` 先列出敵人、路線、障礙物、玩家武器、目標、孳生點、按鈕與每個必要 hit area；每個核心物件要有暫定圖示、visual rect、hit rect、z-index 與 anchor。\n4. 在計畫書中先放入圖示草圖／圖示圖例，至少呈現核心敵人、障礙物、武器、目標、事件與主要操作的形狀或 emoji／SVG placeholder。圖示預覽不是完成素材，但不得等到程式完成後才第一次決定圖示與尺寸。\n5. 先計算 `containment`、`overlap`、`occlusion`、`overflow`、`hit-collision` 與明確 collision channel。區分「視覺重疊」「UI 點擊衝突」「2D 互動碰撞」「3D proxy 碰撞」，不可混稱。\n6. 先處理所有核心區塊與必要 hit target 的 `error`；對可接受的內部 overflow 指定實際承載捲軸的父區塊。整頁不得靠 body 捲軸逃避布局規劃；若控制內容超高，讓控制面板或遊戲框架自己捲動。\n7. `layout_plan.status` 未達 `ready` 前，停止遊戲程式實作。完成程式後才可依 DOM／瀏覽器／CUA 量測把狀態推進到 `verified`；預覽圖與預估矩形不可冒充實測證據。\n\n## 適用範圍與邊界\n\n適用於：\n\n- Web 頁面、教育 Web 遊戲、Dashboard、表單、互動展示頁。\n- DOM／SVG／Canvas／Three.js 混合介面的區塊切割與元件配置。\n- 開始實作前的重疊、遮擋、點擊區衝突、裁切與 responsive 風險分析。\n\n不適用於：\n\n- 只需要文案、資料整理或單純視覺風格提案。\n- 取代完成後的 DOM、瀏覽器、CUA 或真實裝置驗證。\n- 宣稱 3D 物理引擎碰撞已實作；本 Skill 只建立碰撞代理與關係預案。\n\n## 執行流程\n\n### 1. 建立分析輸入\n\n先記錄：\n\n- viewport profile：以相對座標 `0..1` 描述，必要時附目標寬高作驗證標籤，不把單一解析度寫死。\n- 頁面模式：固定單頁、可捲動頁面、遊戲畫布、面板式或混合模式。\n- layer：DOM、SVG、Canvas、Three.js、overlay、pointer／focus layer。\n- 元件清單：內容、控制、提示、裝飾、互動熱點、fallback。\n- 使用者優先級：不可被遮住、可捲動、可點擊、可鍵盤操作、可降級等限制。\n\n### 2. 切割 `layout_blocks`\n\n把頁面切成有責任的區塊，而不是只列 CSS class。每個區塊至少記錄：\n\n- `id`、`parent_id`、`role`、`layout_model`。\n- 相對 `rect`：`x`、`y`、`width`、`height`。\n- `min`／`max` 約束、anchor、safe area 與 overflow policy。\n- 內容、控制、互動、裝飾的 priority。\n\n區塊可以巢狀，但不要為了方便把所有元件放進一個大矩形；每個區塊應能說明自己的溢位與遮擋責任。\n\n### 3. 建立 `component_rects`\n\n為每個可見或可操作元件記錄：\n\n- `id`、`block_id`、`kind`、`rect`、`anchor`、`layer`／`z_index`。\n- `visual_rect` 與 `hit_rect`；點擊區不可只靠圖片外觀猜測。\n- `scroll_context`、responsive variant、`collision_channels`。\n- 必要時記錄 3D `bounds`、collision proxy、hotspot 或 socket。\n\n### 4. 計算關係\n\n依每一個 viewport profile 計算並記錄：\n\n- `containment`：元件是否在父區塊或 safe area 內。\n- `overlap`：兩個 visual rect 或 hit rect 的交集面積及比例。\n- `occlusion`：高 layer 元件是否遮住低 layer 的必要內容。\n- `adjacency`／`alignment`：區塊是否保持預期間距與對齊。\n- `overflow`／`clipping`：內容是否超出容器且沒有明確內部捲動。\n- `collision`：只針對指定 channel 分析 UI hit collision、2D interaction collision 或 3D proxy collision；不要把視覺重疊誤稱為物理碰撞。\n\n每一個 warning 都要保留 `source_ids`、viewport、計算值、threshold、severity、是否為刻意設計及建議處置。\n\n### 5. 實作前 Gate\n\n在 `layout_plan.status` 變成 `ready` 前，先處理：\n\n- 核心內容、主要控制列或必要 hit target 的未預期重疊。\n- hit rect 重疊造成的點擊歧義或鍵盤焦點順序衝突。\n- 必要內容被遮住、裁切、超出 safe area 或 responsive variant 沒有替代位置。\n- 3D hotspot、collision proxy、socket 與物件 bounds 不一致。\n\n裝飾與背景的刻意重疊可以保留，但要標記 `intentional: true`，不可用它掩蓋功能性衝突。\n\n### 6. 交給實作與驗證\n\n把穩定的 block／component ID 帶入 implementation preview。完成頁面後再用瀏覽器 `getBoundingClientRect()`、`elementFromPoint()`、scroll metrics、截圖與實際操作重新量測；把實測結果放入 `verification`，不可把預測的 `layout_plan` 當成 `DOM_PASS` 或 `CUA_PASS`。\n\n## 輸出契約\n\n使用 [layout-plan-contract.md](references/layout-plan-contract.md) 與 [layout-plan-template.json](assets/layout-plan-template.json) 建立 `layout_plan`。至少包含：\n\n- `viewport_profiles`\n- `layout_blocks`\n- `component_rects`\n- `icon_specs`\n- `relations`\n- `responsive_variants`\n- `warnings`\n- `assumptions`\n- `unresolved_questions`\n- `verification`\n\n狀態使用 `draft`、`ready`、`blocked` 或 `verified`。只有瀏覽器與實際裝置證據完成後才可使用 `verified`。\n\n## 與 Harness 的邊界\n\n- 本 Skill 的輸出是獨立 `layout_plan`，不能新增、刪除、重排或改寫 `route_plan` 節點。\n- 不因為發現重疊就自行改變 agent、platform 或 verifier 預算；只提出 warning 與建議，交由使用者裁決。\n- 若版面分析需要額外瀏覽器工具，先由平台 preflight 確認；工具不可用時保留 `draft`／`blocked`，不能假報完成。\n"},{"id":"teacher-workspace-ui","name":"教師工作台建立","cat":"tool","sum":"建立教師工作台：找學生、看作答紀錄、請 AI 分析，並集中管理連線設定。","when":"想看全班的學習紀錄時","text":"---\nname: teacher-workspace-ui\ndescription: 建立或改造教師工作台，整合學生搜尋、作答紀錄、教師端 AI 分析，以及 API 金鑰、GAS 網址和 RECORD_TOKEN 設定。適合為既有教學程式加入教師介面；附暖米色本機範本與校內學生端 Node.js 區網設定工具。\n---\n\n# 教師工作台建立\n\n將教師常用的三件事放在同一工作台：找學生、看作答、決定下一步引導。先讀 [功能與資料契約](references/workspace-contract.md)；需要實作時使用 [可執行範本](assets/template/) 並讀其 [啟動說明](assets/template/README.md)。[範例圖片](references/examples.md) 呈現 osep-judge 的實際教師頁及假資料。\n\n## 套用到專案\n\n1. 先確認現有紀錄來源、教師登入、AI服務及試算表接線。沿用使用者指定的服務與權限；別把示範伺服器替換成既有正式後端。資料格式不同時寫轉接層，不改原分數或虛構程式快照。\n2. 版面採左側導覽／學生搜尋、中央紀錄／AI分析／設定三頁。桌面學生清單常駐，窄版由明確按鈕開關；主內容與清單分別捲動。保留44px操作目標、鍵盤焦點、長文字換行及局部程式捲動。\n3. 複製範本資源到使用者指定專案，再修改品牌、資料接線與AI回應轉接。先檢查目標；已有檔案先比較、合併，避免直接覆蓋。範本只依賴Node.js內建模組，不需要安裝套件。\n4. 設定介面提供API金鑰、GAS正式 `/exec` URL、RECORD_TOKEN。此公開範本token為8～200碼，前端、後端、GAS一致；留白保留既有值，清除需明確勾選。不要替既有專案降低token要求，除非使用者也指定修改該專案。\n5. AI預設為「本機摘要（不呼叫AI）」。真AI由教師按送出才觸發，旁邊清楚寫出選取範圍、外傳內容與費用可能性。後端依紀錄id重取資料，回覆分直接觀察、待確認推測、教學建議及資料限制，引用能跳回原紀錄。id存在只代表引用有效，不證明模型敘述正確。\n6. 用假資料驗證搜尋、篩選、最後有效成績、紀錄展開、設定保存／留白／清除、分析／引用／取消／登出。同時間戳以較後保存紀錄優先；無效、範例或評分期间程式變動不取代有效成績。驗證桌面、手機與平板，確認輸入及送出可見、無橫向溢出。\n7. 需要校內其他電腦連線時，讀 [校內區網設定](references/school-lan.md)。先區分學生端與教師遠端登入；沿用原程式權限。工具可列網卡、明確保存IPv4／埠號並轉接原osep區網入口，啟動前再查網卡；不以私人網段推定學校，不自動改防火牆。獨立範本沒有學生編輯器，不能把教師後端直接改成區網監聽。\n\n## 不可省略的接線界線\n\n- API金鑰和token只由後端保存及使用，不讀回瀏覽器、不寫入學生紀錄或Git；教師密碼雜湊保存。範本的服務金鑰在本機是明文，不是加密保險箱。\n- 範本教師伺服器只監聽loopback；保留Host、同來源、教師工作階段檢查。學生端區網設定與教師遠端部署分開；教師遠端／雲端需HTTPS與存取控制，不能只改監聽位址就稱安全。\n- 模型與學生文字用textContent顯示；不要將回覆當HTML、程式或工具指令。不要把求助次數當能力、做排名或診斷，也不改評分結果。\n- 直接開HTML只預覽版型，不發API；完整功能從localhost開啟。修改後端後需重啟服務。\n- 範本目前支援Responses相容的非串流JSON回覆；服務不相容時先做轉接。外部AI／GAS實测須在使用者已授權且設定完成的範圍內；別用模擬成功宣稱正式服務完成。\n\n交付修改清單、啟動方式、假資料操作截圖、實測結果及未驗證項目。審查和公開發布依當次使用者要求進行，本技能本身不授權傳送學生資料或推送任何儲存庫。\n"},{"id":"creative-collaboration-loop","name":"AI 創作協作循環","cat":"write","sum":"發散、收斂各兩輪的 AI 協作；每一步先決定 AI 要替代、加速、擴張還是挑戰。","when":"構想還不清楚、想跟 AI 一起發想時","text":"---\nname: creative-collaboration-loop\ndescription: \"Guide cross-domain creative, design, research, planning, analysis, and decision work through a bounded diverge-converge collaboration loop: initial divergence, convergence, second divergence, and final convergence. Recommend whether AI should substitute, accelerate, expand, or challenge; keep a user-visible topology; estimate a soft divergence limit with an absolute maximum of 10 layers; propose child files in the main record but create them only after explicit user approval; and always stop after final convergence before delivery. Use for brainstorming, writing, presentations, products, software, research, strategy, planning, or ambiguous creation tasks where the user wants to decide how AI helps. Do not use for purely mechanical tasks with a fully specified output.\"\n---\n\n# AI 創作協作循環\n\n## 定位\n\n把 AI 從「直接產出器」轉成可調整的協作流程控制器。適用於文章、故事、腳本、簡報、課程、產品、服務、UX、程式、研究、策略、流程改善、決策與其他需要探索及取捨的工作。\n\n這個 Skill 管理的是協作節奏與使用者權限，不取代領域專業。需要領域知識、外部資料或特定工具時，依 Route Plan 載入其他 Skill 或工具；不得自行改寫 Route Plan、平台選擇或 verifier 預算。\n\n把兩套軸分開：\n\n- **流程軸**：發散 → 收斂 → 再發散 → 再收斂。\n- **協作軸**：替代、加速、擴張、挑戰。\n\n不要把協作軸硬綁成固定階段。AI 可以在同一階段推薦一種或多種功能，也可以依使用者決定切換。\n\n## 觸發與反觸發\n\n觸發於使用者要求或暗示以下工作：\n\n- 發想、腦暴、設計、規劃、創作、研究、策略或方案比較。\n- 想知道 AI 應該代做、加速、增加觀點，或反駁檢查什麼。\n- 想把一個模糊目標整理成多個方向，再選定並深化。\n- 想要求 AI 找漏洞、反例、風險或替代方案。\n- 需要可追蹤的流程拓樸、分支紀錄、主檔與受控子檔。\n\n不觸發於：\n\n- 使用者已給出完整規格，只要求純機械轉換、逐字抄錄、簡單格式化或明確單步操作。\n- 使用者明確要求只做既定的小型修改，且沒有需要探索或取捨的決策。\n\n若任務看似簡單但仍有重要取捨，採用微型四階段流程，不要默默跳過使用者的最終授權閘門。\n\n## 使用者權限\n\n遵守以下優先順序：\n\n1. 使用者決定目標、限制、取捨、是否採用推薦，以及何時交付。\n2. AI 提出推薦、候選、反例、風險、摘要與下一步。\n3. AI 可以將方向標記為「暫定」，但不得把暫定方向寫成使用者已批准。\n4. 第二次收斂完成後，一律停止並等待使用者明確授權。\n5. 沒有明確授權時，不得直接完成、發布、送出或執行超出範圍的成品工作。\n\n如果使用者要求「只給建議，不要自動往下做」，在每個階段都停止等待回覆。若沒有這項要求，可在可逆的分析階段繼續，但仍要在重要方向選擇、檔案建立與最終交付處遵守本規則。\n\n## 協作功能\n\n| 功能 | 定義 | 適合時機 | 硬性邊界 |\n|---|---|---|---|\n| 替代 | 把一段明確工作交給 AI 完成 | 方向、標準與範圍已確認後 | 完整交付必須在第二次收斂後取得授權 |\n| 加速 | 使用者已有方向，AI 減少整理、改寫、比較或重複工作的時間 | 收斂後、深化與執行準備 | 不得藉加速名義改變目標 |\n| 擴張 | 增加方案、觀點、資料、案例、問題與可行路徑 | 發散與深化 | 每個新增方向都要連回目標或成功標準 |\n| 挑戰 | 反駁假設、找漏洞、提出反例、模擬失敗與揭露風險 | 收斂與壓力測試 | 每個重要批評要說明影響，並盡量給出修正或測試方式 |\n\n在每次切換功能時，先簡短呈現：\n\n~~~text\n建議功能：\n建議原因：\n本輪產物：\n預期下一步：\n若不採用此功能：\n~~~\n\n預設推薦如下，但要依任務調整：\n\n- 第一次發散：擴張。\n- 第一次收斂：挑戰，可搭配加速比較。\n- 第二次發散：擴張＋加速；可製作小型原型，但不交付成品。\n- 第二次收斂：挑戰＋加速整理。\n- 第二次收斂之後：停止，讓使用者選擇替代、加速、再擴張、再挑戰或暫停。\n\n## 四階段流程\n\n使用以下穩定節點 ID。可因任務需要回退，但不得遺失目前階段、回退原因與下一步。\n\n~~~mermaid\nflowchart TD\n    P0[\"P0 任務定位與協作契約\"]\n    P1[\"P1 第一次發散：擴張可能性\"]\n    P2[\"P2 第一次收斂：比較與選方向\"]\n    P3[\"P3 第二次發散：深化與建原型\"]\n    P4[\"P4 第二次收斂：壓力測試與定稿\"]\n    P5[\"P5 停止閘門：等待使用者授權\"]\n    P6[\"P6 交付執行：依授權替代或加速\"]\n    P7[\"P7 等待使用者：不執行後續工作\"]\n\n    P0 --> P1\n    P1 --> P2\n    P2 -->|方向足夠| P3\n    P2 -->|仍有關鍵未知| P1\n    P3 --> P4\n    P4 -->|已達標| P5\n    P4 -->|仍有關鍵缺口| P3\n    P4 -->|達到硬上限| P5\n    P5 -->|使用者明確授權| P6\n    P5 -->|尚未授權| P7\n~~~\n\n### P0：任務定位與協作契約\n\n先取得或整理：\n\n- 目標與預期使用者。\n- 限制、資源、時間、格式與不可違反條件。\n- 成功標準與要保留給使用者的決策。\n- AI 協作功能的推薦與理由。\n- 是否需要持久化主檔。\n- 任務複雜度、建議發散上限與絕對上限。\n\n問題要少而關鍵。若使用者沒有指定功能，先推薦，不要把四種功能當成必填表單。\n\n### P1：第一次發散\n\n以擴張為主：\n\n- 提出 3–7 個方向或候選方案。\n- 分組相似方案，避免重複堆疊。\n- 標記假設、已知資料、未知資料與需要查證的事項。\n- 不過早寫成完整成品。\n\n如果候選內容很大，先在主檔提出子檔建議，不得直接建立子檔。詳見「主檔與子檔治理」。\n\n### P2：第一次收斂\n\n以挑戰為主：\n\n- 對照成功標準、限制與使用情境。\n- 比較方案的價值、成本、風險、可逆性與依賴。\n- 找出反例、失敗條件與尚未回答的問題。\n- 提出推薦方向、備選方向與推薦理由。\n\n輸出「選擇包」：\n\n~~~text\n推薦方向：\n推薦理由：\n主要風險：\n尚未決定：\n保留的備選：\n需要使用者決定：\n~~~\n\n如果使用者尚未授權 AI 代為選擇，不要把推薦寫成定案。可等待使用者選擇；若使用者已授權在可逆選擇上採用推薦，將它標記為「暫定方向」並進入 P3。\n\n### P3：第二次發散\n\n針對選定或暫定方向深化：\n\n- 展開內容結構、版本、例子、使用情境與執行路徑。\n- 用加速整理使用者已有素材。\n- 用擴張補充變體、替代做法與必要資料。\n- 可產生小型原型或片段，供比較，不得視為最終交付。\n- 每一層發散都要說明要解決的新問題。\n\n如果分支內容將遮蔽主流程，先提出子檔建議並等待同意。\n\n### P4：第二次收斂\n\n以挑戰為主：\n\n- 做反例、失敗預演、風險排序與條件檢查。\n- 刪除重複、不必要或無法符合目標的內容。\n- 形成最後方向、規格、提綱、執行清單或驗收條件。\n- 標記仍然存在的不確定性與使用者需要知道的取捨。\n\n完成後建立「最終收斂包」，然後必須進入 P5，不可直接執行。\n\n### P5：停止閘門\n\n呈現：\n\n~~~text\n目前階段：P5 第二次收斂完成\n最終方向：\n已符合的標準：\n剩餘風險與未知：\n建議交付方式：替代／加速／再擴張／再挑戰／暫停\n是否授權我開始交付？\n~~~\n\n等待使用者明確回答。只有清楚的同意、授權或等義指令才可進入 P6。\n\n### P6：交付執行\n\n只執行使用者授權的範圍與功能：\n\n- 替代：完成已確認的成品或工作段落。\n- 加速：整理、改寫、格式化或執行已確認流程。\n- 再擴張：重新開一個受深度限制的發散層，完成後再次收斂。\n- 再挑戰：追加驗證與反例，完成後再次收斂。\n\n執行後驗證輸出是否符合最終收斂包；不得自動延伸成未授權的新任務。\n\n## 深度與分支上限\n\n### 計算方式\n\n使用 **divergence_depth** 計算目前活動路徑上的發散層數。每進入一次新的發散層就加 1；收斂不增加層數；子檔不能重設計數。\n\n設定：\n\n~~~text\n建議上限 = 2 × complexity_band\n絕對上限 = 10\n~~~\n\n依以下條件將 **complexity_band** 設為 1–5：\n\n1. 單一目標、限制少、容易修改。\n2. 有多個限制或工作條件。\n3. 有多個利害關係人、依賴或評估標準。\n4. 跨領域、高不確定性或需要較多資料。\n5. 高影響、不可逆，或使用者明確要求完整探索。\n\n因此建議上限為 2、4、6、8 或 10。顯示目前深度、建議上限與絕對上限。\n\n到達建議上限時，先做一次收斂檢查。如果仍有一個新的、具體且重要的未解問題，說明理由後才可再增加一層；不得只因「還可以想更多」而繼續。\n\n到達第 10 層時，強制整理成目前最佳方案、備選方案與剩餘不確定性，進入收斂與停止閘門。\n\n### 防止分支爆炸\n\n- 每一層最多保留 3–7 個候選方向。\n- 每次收斂後保留 1 個主方向與最多 2 個備選。\n- 相似方案先合併，不用不同名稱製造假分支。\n- 新增一層前，必須列出「本層要解決的新問題」。\n- 若新內容沒有新觀點、決策或證據，立即收斂。\n\n## 主檔與子檔治理\n\n### 主檔\n\n需要持久化流程紀錄時，在使用者允許的工作區使用 repository-relative path 建立主檔。建立前檢查目標；已存在且內容不同時停止，不得無聲覆寫。\n\n主檔是流程拓樸、決策、深度、狀態與子檔索引的唯一入口。至少記錄：\n\n~~~text\ntask_id：\n目前節點：\n目前協作功能：\ndivergence_depth：\ncomplexity_band：\n建議上限／絕對上限：\n主要方向：\n未決問題：\n子分支索引：\n最近 checkpoint：\n~~~\n\n### 子檔建立提案\n\n分支過大時，只在主檔新增以下提案，並停止等待使用者：\n\n~~~text\n分支建檔提案\nproposal_id：\nbranch_id：\n提出原因：\n預計保存內容：\n建議相對路徑：\n目前流程深度：\n建立後回到節點：\n狀態：awaiting-user\n~~~\n\n未取得同意前：\n\n- 不建立子檔。\n- 不把子檔路徑寫成已存在。\n- 不把該分支的細節移出主檔後再繼續。\n\n使用者同意後，依序：\n\n1. 將提案狀態改為 **approved**。\n2. 建立子檔，採 create-only。\n3. 把實際相對路徑與狀態回寫主檔。\n4. 完成分支後把摘要、決策、證據與下一步回寫主檔。\n\n### 子檔深度\n\n預設只允許：\n\n~~~text\n主檔 → 子檔\n~~~\n\n子檔可以用章節或節點保存內部分支，但不得自行建立新的子檔。如果子檔需要再拆分，停止並請使用者選擇：\n\n~~~text\nA. 把複雜度收回主流程並重新規劃\nB. 允許目前分支再建立一層子檔\n~~~\n\n若使用者選 B，授權只對指定分支與指定層級有效；新子檔仍不得無限建立下一層。每個已建立的子檔都必須在主檔有可找到的相對路徑、狀態與回程節點。\n\n## 拓樸圖與進度呈現\n\n遵守以下呈現節奏：\n\n- 任務開始：顯示完整拓樸圖。\n- 發生分支、回退、深度變化、建檔提案或重新規劃：更新完整拓樸圖。\n- 普通回合：只顯示目前節點、目前功能、深度與下一步。\n- 子分支很大：主檔顯示子檔提案或已核准的相對路徑；不要把全部細節塞進主圖。\n\n對使用者可見的計畫拓樸圖，每個節點要包含：\n\n1. 穩定節點 ID。\n2. 節點功能。\n3. 實際使用 agent；沒有委派時寫「主 agent」。\n4. 狀態：只能寫「已執行」、「未執行」或「有問題」。\n\n只有在檢查證據已保存後，才把節點標為「已執行」。若有問題，補一句可稽核原因。不要在圖中寫絕對路徑、使用者名稱、帳號或秘密。\n\n## 輸出契約\n\n每個階段至少提供：\n\n~~~text\n目前節點：\nAI 建議功能：\n本輪產物：\n主要假設／證據：\n目前發散深度：\n下一步：\n需要使用者決定：\n~~~\n\n完成 P4 時，提供最終收斂包；完成 P5 時，提供停止與授權問題。若使用者要求落檔，主檔保存流程 SSOT，子檔只在同意後保存大型分支細節。\n\n只提供可稽核摘要、假設、證據、檢查、結果、不確定性與決策；不要輸出私有 chain-of-thought。\n\n## 停止與錯誤處理\n\n在下列情況停止並回報：\n\n- 使用者尚未授權 P6 的成品交付。\n- 子檔提案尚未獲得使用者同意。\n- 需要建立子檔的子檔，但尚未取得額外授權。\n- 發散深度達到 10。\n- 目標、成功標準或重要限制互相衝突。\n- 缺少會改變方向的關鍵資料。\n- 目標路徑已存在且可能造成覆寫。\n- 實際範圍、路徑、agent、權限或 verifier 與 Route Plan 不一致。\n\n使用者改變主要目標時，停止目前路徑，更新主拓樸，重新執行 P0；不要把舊方向的產物假裝成新目標的決策。\n"},{"id":"hemingway-writing","name":"海明威寫作法","cat":"write","sum":"去掉副詞與抽象形容，用具體可見的畫面寫作。","when":"文章、講稿想更有畫面感時","text":"---\nname: hemingway-writing\ndescription: Hemingway-style writing constraint for AI-assisted prose. Ban adverbs and abstract adjectives; force concrete, observable imagery so writing shows instead of tells. Use when the user asks for 海明威寫作法, vivid writing, 畫面感, prose polish, or when drafting articles, stories, essays, marketing copy, or speeches where flat abstract wording weakens the text. Not for technical/legal documents where precise qualifiers carry meaning.\n---\n# 海明威寫作法\n\n## 核心原則\n\n> 📖 白話：不要「說」感覺，要「演」給讀者看。刪掉副詞和抽象形容詞，用具體的動作、物件、數字讓畫面自己說話。\n\n利用 AI 寫文章時，禁止它使用副詞與抽象形容詞，文字會立刻變得有畫面感。這就是海明威寫作法：\n\n1. **禁用副詞**——尤其是修飾動詞的程度副詞：「非常」「十分」「極其」「真的」「慢慢地」「靜靜地」等。動詞本身要選得夠準，不需要副詞撐腰。\n2. **禁用抽象形容詞**——「美麗的」「重要的」「驚人的」「溫馨的」這類詞是作者的結論，不是讀者的體驗。把結論換成可觀察的細節。\n3. **Show, don't tell**——把情緒與評價翻譯成動作、物件、聲音、數字。\n\n## 改寫對照\n\n| 禁用寫法（tell） | 海明威寫法（show） |\n|---|---|\n| 她非常生氣。 | 她把筷子拍在桌上，碗裡的湯濺了出來。 |\n| 那是一棟很美麗的老房子。 | 紅磚牆爬滿藤蔓，木門推開時鉸鏈叫了一聲。 |\n| 他跑得非常快。 | 他衝過終點時，第二名還在三十公尺外。 |\n| 這個功能極其重要。 | 這個功能一掛，全站登入跟著停擺。 |\n| 天氣冷得可怕。 | 呼出的氣在圍巾上結了一層白霜。 |\n\n## 執行程序\n\n寫作或改稿時依序執行：\n\n1. **起草前宣告約束**：在寫作指令中明列「禁止使用副詞與抽象形容詞」。\n2. **逐句自查**：完稿後掃描每一句——\n   - 找出副詞（中文常見「地」字結尾、程度詞；英文常見 -ly 結尾），刪除或改選更強的動詞。\n   - 找出抽象形容詞，改寫成具體細節：這個「美」讀者用哪個感官接收？給出那個感官的畫面。\n3. **強動詞優先**：「快速地走」→「衝」；「小聲地說」→「耳語」。\n4. **保留必要的限定詞**：技術文件、法律文字、學術論文中承載精確語意的修飾語（「顯著差異」「僅限」「至少」）不在禁用範圍——本法適用於敘事、散文、文案、演講稿，不適用於需要精確量化語言的文體。\n\n## 交付檢查\n\n- [ ] 全文零程度副詞（「非常」「十分」「真的」…）\n- [ ] 抽象形容詞已換成可觀察的細節\n- [ ] 每個場景至少一個具體感官錨點（視、聽、觸、嗅、味其一）\n- [ ] 動詞經過挑選，不依賴副詞補強\n"}],"PURPOSES":[{"id":"p1","name":"寫一份新教案","steps":[["document-to-markdown-ingestion","先讓 AI 讀懂課本與教師手冊"],["lesson-plan-authoring","寫出目標、活動、評量對齊的教案"],["explain-visual","替關鍵概念配一張圖"],["item-authoring","出評量題"],["lesson-differentiation","替不同程度的學生分層"]]},{"id":"p2","name":"數位學習精進教案送件","steps":[["document-to-markdown-ingestion","讀懂送件格式與課本"],["digital-learning-lesson-plan","寫精進教案與平台證據"],["item-authoring","準備學習成效評量"],["teacher-workspace-ui","收集與查看學習紀錄"]]},{"id":"p3","name":"數學臆測教學","steps":[["document-to-markdown-ingestion","讀懂數學單元"],["conjecturing-five-stage","改寫成臆測五階段"],["lesson-differentiation","替不同程度的學生分層"],["item-authoring","出檢核學習的題目"]]},{"id":"p4","name":"把教材做成闖關遊戲","steps":[["playable-world-prep","先判斷值不值得做、核對事實"],["material-to-quest-game","寫出闖關規格"],["web-layout-topology-analysis","規劃畫面版面"],["visual-art-storyboard","規劃角色與場景"],["educational-web-game-workflow","做成網頁遊戲"],["learner-behavior-game-review","用學生操作驗收"]]},{"id":"p5","name":"讓闖關加入 3D","steps":[["quest-threejs-adoption","決定 3D 放在哪裡、作答留在網頁層"],["image-to-3d-scene","從參考圖做 3D 場景"],["text-to-creature","做 3D 角色或生物"],["procedural-world-field-metrics-workflow","反覆調整並量測"],["learner-behavior-game-review","驗收學生實際操作"]]},{"id":"p6","name":"做教育卡牌遊戲","steps":[["educational-card-game","設計卡牌規則與網頁"],["visual-art-storyboard","規劃卡面美術"],["pixel-ai-secretary","做一致的像素風角色"],["learner-behavior-game-review","用學生操作驗收"]]},{"id":"p7","name":"把概念講清楚（圖解、動畫）","steps":[["explain-visual","先畫一張最小的圖"],["creative-collaboration-loop","跟 AI 發想表現方式"],["shadow-movie","做成故事動畫"]]},{"id":"p8","name":"跟 AI 一起寫文章或計畫","steps":[["creative-collaboration-loop","先發散再收斂"],["hemingway-writing","把文字寫得有畫面"],["explain-visual","重點配圖"]]}]};

function matchPurpose(q){
  const grams=s=>{const r=new Set();const t=String(s).replace(/\s+/g,'');for(let i=0;i+1<t.length;i++)r.add(t.slice(i,i+2));return r};
  const qg=grams(q);if(!qg.size)return [];
  const scored=LIB.SK.map((b,i)=>{const g=grams(b.name+b.sum+b.when);let n=0;qg.forEach(x=>{if(g.has(x))n++});return {b,i,n}}).filter(x=>x.n>0).sort((a,b)=>b.n-a.n||a.i-b.i).slice(0,4);
  return scored.sort((a,b)=>a.i-b.i).map(x=>x.b);
}

    if(i===2){h+=`<li><span>任務：走到最深的谷</span><span class="st">${has('badges','b2')?'完成':'未完成'}</span></li></ul><ul style="margin-top:8px">`;NPC2.forEach(n=>{h+=`<li style="display:block"><b>${esc(n.name)}</b>：「${esc(n.line)}」</li>`});h+=`<li style="display:block"><b>重點</b>：淺坑四周都是上坡，容易以為已經最好；同家族的審查者站在相近的位置，容易一起說沒問題。換不同家族的審查者，比較可能提出反例、跳出局部解。（地形是比喻；換家審查不保證找到最好，只是降低一起錯的機會。）</li>`}
    if(i===3){h+=`<li><span>任務：依順序踩亮石板</span><span class="st">${has('badges','b3')?'完成':flowK+'/6'}</span></li></ul><ol style="margin:8px 0 0;padding-left:1.4em">`;FLOW.forEach(f=>{h+=`<li><b>${esc(f.name)}</b>：${esc(f.why)}</li>`});h+='</ol><ul>'}
    if(i===4){h+=`<li><span>任務：Hook 閘門</span><span class="st">${has('badges','b4')?'完成':'剩 '+hookQ.length+' 個'}</span></li></ul><ul style="margin-top:8px"><li style="display:block"><b>重點</b>：唯讀、可重跑的檢查放行；刪除檔案、外流秘密、不可逆的外部變更、沒驗證就宣告完成，都要擋下來先問老師。</li>`}
    h+='</ul>'});
  $('listBody').innerHTML=h;
}
$('btnList').onclick=()=>{buildList();$('list').hidden=false;$('btnListClose').focus()};

$('btnReset').onclick=()=>{S={talked:[],visited:[],badges:[]};save();flowK=0;flowLast=-1;hookQ=[0,1,2,3,4,5];hookAnim=null;route=null;things.forEach(t=>{if(t.type==='book'){t.from=null;t.fromFlat=0}});P.x=-4;P.z=14;renderHud();toast('進度已重新開始。')};
addEventListener('keydown',e=>{
  if(!$('intro').hidden||!$('list').hidden){if(e.key==='Escape'){if(!$('list').hidden){$('list').hidden=true;$('btnList').focus()}else{$('btnStart').click()}}return}
  const k=e.key.toLowerCase();

  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys[k]=true;e.preventDefault()}
  if((k==='e'||k===' ')&&document.activeElement.tagName!=='BUTTON'&&document.activeElement.tagName!=='A'){e.preventDefault();interact()}
  if(k==='escape'&&panelOpen)closePanel();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
// 觸控搖桿
const isTouch=matchMedia('(pointer:coarse)').matches;
if(isTouch){$('stick').hidden=false;$('act').hidden=false}
$('act').onclick=interact;
(()=>{const st=$('stick'),kn=$('knob');let id=null;
  const set=(cx,cy)=>{const r=st.getBoundingClientRect(),dx=cx-(r.left+60),dy=cy-(r.top+60),m=Math.min(1,Math.hypot(dx,dy)/50),a=Math.atan2(dy,dx);stick={x:Math.cos(a)*m,y:Math.sin(a)*m};kn.style.transform=`translate(${stick.x*35}px,${stick.y*35}px)`};
  st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);set(e.clientX,e.clientY)});
  st.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e.clientX,e.clientY)});
  const end=()=>{id=null;stick={x:0,y:0};kn.style.transform=''};st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);})();

// ===== 每格更新（遊戲以真實時間推進；step 可固定 dt 供測試）=====
let clock=0;const confetti=[];
function celebrate(cx=DEEP[0],cy=H(...DEEP)+8,cz=DEEP[1]){if(!THREE_OK)return;for(let k=0;k<80;k++){const m=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.1),new THREE.MeshBasicMaterial({color:[0xf2c14e,0xe8875b,0x7fb6d9,0x8fd18a][k%4]}));m.position.set(cx,cy,cz);m.userData.v=[(Math.random()-0.5)*14,10+Math.random()*10,(Math.random()-0.5)*14];scene.add(m);confetti.push(m)}}
function step(dt){
  clock+=dt;
  // 輸入 → 移動方向（畫面向上＝-z）
  let ix=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+stick.x, iz=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0)+stick.y;
  if(panelOpen||!$('intro').hidden||!$('list').hidden){ix=0;iz=0}
  const im=Math.hypot(ix,iz);if(im>1){ix/=im;iz/=im}
  // 地形坡度：上坡變慢，陡坡會往下滑（第二島的淺坑會把人拉進去）
  const e=0.4,gx=(H(P.x+e,P.z)-H(P.x-e,P.z))/(2*e),gz=(H(P.x,P.z+e)-H(P.x,P.z-e))/(2*e),slope=Math.hypot(gx,gz);
  const uphill=(ix*gx+iz*gz);const speed=11*(uphill>0?Math.max(0.45,1-uphill*0.5):1);
  let tvx=ix*speed,tvz=iz*speed;
  const onB=onBridge(P.x,P.z)&&H(P.x,P.z)<1;
  if(!onB&&slope>0.28){const k=Math.min(4,(slope-0.28)*9)*(im>0.1?0.25:1);tvx-=gx/slope*k;tvz-=gz/slope*k}
  P.vx+= (tvx-P.vx)*Math.min(1,dt*8);P.vz+=(tvz-P.vz)*Math.min(1,dt*8);
  const nx=P.x+P.vx*dt,nz=P.z+P.vz*dt;
  if(walkable(nx,nz)){P.x=nx;P.z=nz}else if(walkable(nx,P.z)){P.x=nx;P.vz=0}else if(walkable(P.x,nz)){P.z=nz;P.vx=0}else{P.vx=P.vz=0;
    const b=onBridge(nx,nz);if(b&&!b.B.open()&&toastT<=0)toast(b.B===BRIDGES[0]?'橋還沒亮：先和五個 AI 小幫手說話。':b.B===BRIDGES[1]?'橋還沒亮：先在第二島走到最深的谷。':'橋還沒亮：先在第三島踩亮全部石板。')}
  if(im>0.1){P.heading=Math.atan2(ix,iz);P.walk+=dt*10}
  const isl=islandAt(P.x,P.z);if(isl&&isl!==P.isl){P.isl=isl;renderHud();
    if(isl===2&&!has('badges','b2'))toast('歡迎來到第二島：這座島本身就是一片「答案地形」，越低代表答案越好。',5);
    if(isl===3&&!has('badges','b3'))toast('歡迎來到第三島：照 Harness 的流程順序，踩亮六塊石板。',5);
    if(isl===5)toast('歡迎來到 Skill 圖書館：每本書是一個 skill。找綠色的館員選目的，書會依序排到展示台上。',6);
    if(isl===4&&!has('badges','b4'))toast('歡迎來到第四島：走到紅色控制台，決定哪些 AI 動作要擋下。',5)}
  // 第三島石板
  let onStone=-1;STONES.forEach((st,k)=>{if(Math.hypot(P.x-st.x,P.z-st.z)<2.4)onStone=k});
  if(onStone>=0&&onStone!==flowLast&&!has('badges','b3')){const step=STONE_ORDER[onStone];
    if(step<flowK){}else if(step===flowK){flowK++;toast(`第 ${flowK} 步「${FLOW[step].name}」：${FLOW[step].why}`,4);if(flowK===6&&add('badges','b3')){celebrate(100,H(100,100)+8,100);toast('路線圖連起來了！拿到第三島徽章，西邊的橋亮了。',5)}renderHud()}
    else{const need=FLOW[flowK].name;flowK=0;toast(`順序不對，石板全部熄滅。提示：第一步是「${FLOW[0].name}」${need!==FLOW[0].name?'，你剛剛應該接「'+need+'」':''}。`,5);renderHud()}}
  flowLast=onStone;
  // 局部解提示
  const inPit=Math.hypot(P.x-84,P.z-4)<7&&!has('badges','b2');
  P.inPit=inPit?P.inPit+dt:0;
  if(P.inPit>2.5&&!P.pitHinted){P.pitHinted=true;toast('四周看起來都是上坡……這裡就是最好的嗎？去問問旁邊的審查者。',6)}
  if(Math.hypot(P.x-DEEP[0],P.z-DEEP[1])<4&&!has('badges','b2')&&!panelOpen)winIsland2();
  // 找最近的可互動物件
  near=null;let best=6;
  for(const t of things){if(t.type==='role'&&!(demo&&demo.t===t)){const a=clock*0.4+t.phase;t.x=t.home[0]+Math.cos(a)*2.4;t.z=t.home[1]+Math.sin(a)*2.4}
    const d=Math.hypot(t.x-P.x,t.z-P.z)+(t.type==='book'?1.2:0);if(d<best&&t.type!=='flag'){best=d;near=t}}
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.hidden=true}
  updateDemo(dt);
  if(route)route.t+=dt;
  for(const t of things){if(t.type!=='book')continue;const k=route?route.ids.indexOf(t.id):-1;const sl=t.slot,px=PED_X0+k*PED_DX;
    const shelf=[sl[0],H(sl[0],SHELF_Z)+sl[1],sl[2]], target=k>=0?[px,H(px,PED_Z)+1.8,PED_Z]:shelf, tFlat=k>=0?1:0, from=t.from||shelf;
    const f=route?easeIO(cl01((route.t-(k>=0?k*0.25:0))/1.1)):1, moving=Math.hypot(from[0]-target[0],from[2]-target[2])>0.1;
    t.pos=[lerp(from[0],target[0],f),lerp(from[1],target[1],f)+(moving?Math.sin(f*Math.PI)*4:0),lerp(from[2],target[2],f)];t.flat=lerp(t.fromFlat||0,tFlat,f);
    const a=bookAnchor(sl);if(k>=0&&f>0.5){t.x=px;t.z=PED_Z+1.8}else{t.x=a[0];t.z=a[1]}}
  if(near&&!panelOpen){promptEl.innerHTML=`<b>${isTouch?'點「查看」':'按 E'}</b>：${esc(near.type==='station'?near.data.title:near.data.name)}`;promptEl.hidden=false}else promptEl.hidden=true;
}
function draw(){
  if(!THREE_OK)return;
  const pl=objs.player;pl.position.set(P.x,groundY(P.x,P.z)+Math.abs(Math.sin(P.walk))*0.25,P.z);pl.rotation.y=P.heading;
  for(const t of things){
    if(t.type==='role'){if(!(demo&&demo.t===t)){t.obj.position.set(t.x,H(t.x,t.z),t.z);t.obj.rotation.y=Math.atan2(P.x-t.x,P.z-t.z)}t.obj.userData.check.visible=has('talked',t.id);t.obj.userData.check.rotation.y=clock*2}
    if(t.type==='station'){t.obj.userData.gem.rotation.y=clock;t.obj.userData.gem.position.y=4.3+Math.sin(clock*2+t.x)*0.25;t.obj.userData.gem.material.emissiveIntensity=has('visited',t.id)?0.15:0.6}
    if(t.type==='npc'){t.obj.rotation.y=Math.atan2(P.x-t.x,P.z-t.z)}
  }
  objs.bridges.forEach((g,i)=>g.children.forEach(p=>p.material.color.setHex(BRIDGES[i].open()?0xf2c14e:0x6b5a48)));
  const lit=has('badges','b3')?6:flowK;objs.stones.forEach((m,k)=>{m.userData.top.material.emissiveIntensity=STONE_ORDER[k]<lit?0.55:0});
  const rp=[];for(let q=0;q<lit;q++){const k=STONE_ORDER.indexOf(q),st=STONES[k];rp.push(new THREE.Vector3(st.x,H(st.x,st.z)+0.8,st.z))}if(rp.length<2)rp.push(new THREE.Vector3(),new THREE.Vector3());objs.route.geometry.setFromPoints(rp);objs.route.visible=lit>=2;
  const by=H(0,100)+1.9;if(hookAnim){hookAnim.t+=0.016;const k=Math.min(1,hookAnim.t/1.6);if(hookAnim.allow){objs.hookBox.position.set(-16+32*k,by,100)}else{const k1=Math.min(1,k*2);objs.hookBox.position.set(-16+19*k1,by-Math.max(0,k-0.5)*6,100+Math.max(0,k-0.5)*8)}objs.hookBox.material.color.setHex(hookAnim.allow?0x8fd18a:0xe66a5c);if(k>=1)hookAnim=null}else{objs.hookBox.position.set(-16,by,100);objs.hookBox.material.color.setHex(0xefe9d8)}objs.hookBox.visible=!has('badges','b4')||!!hookAnim;
  objs.beam.visible=has('badges','b4');objs.beam.rotation.y=clock*0.8;objs.lhTop.material.emissive&&objs.lhTop.material.emissive.setHex(has('badges','b4')?0x553311:0x000000);
  for(const t of things){if(t.type!=='book'||!t.pos)continue;t.obj.position.set(...t.pos);t.obj.rotation.set(-Math.PI/2*t.flat,0,0);t.obj.material.emissiveIntensity=near===t?0.45:(route&&route.ids.includes(t.id)?0.2:0)}
  objs.peds.forEach((p,k)=>{p.num.visible=!!route&&k<route.ids.length&&route.t>k*0.25+1;p.num.lookAt(camera.position)});
  objs.libRoute.visible=!!route&&route.ids.length>1&&route.t>1.2;
  objs.flag.rotation.y=Math.sin(clock)*0.2;objs.sea.material.uniforms.uT.value=clock;
  for(let k=confetti.length-1;k>=0;k--){const m=confetti[k],v=m.userData.v;v[1]-=18*0.016;m.position.x+=v[0]*0.016;m.position.y+=v[1]*0.016;m.position.z+=v[2]*0.016;m.rotation.x+=0.2;if(m.position.y<-5){scene.remove(m);confetti.splice(k,1)}}
  // 跟隨鏡頭（固定斜角，方向鍵與畫面一致）
  let tx=P.x,ty=groundY(P.x,P.z),tz=P.z,oy=26,oz=30;
  if(demo){const narrow=innerWidth<700;tx=demo.O.x+(narrow?0:6);ty=demo.O.y;tz=demo.O.z+(narrow?6:1);oy=narrow?15:13;oz=narrow?17:17}
  camera.position.lerp(new THREE.Vector3(tx,ty+oy,tz+oz),0.08);camera.lookAt(tx,ty+2,tz);
  renderer.render(scene,camera);
}
function resize(){if(!THREE_OK)return;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;step(dt);draw();requestAnimationFrame(loop)}
renderHud();
if(THREE_OK){camera.position.set(P.x,30,P.z+30);requestAnimationFrame(loop)}
// 測試用：固定 dt 模擬按鍵（不影響一般遊玩）
window.__game={P,get S(){return S},keys,step,draw,things,H,teleport:(x,z)=>{P.x=x;P.z=z;P.vx=P.vz=0},sim:(k,sec)=>{for(const key of k)keys[key]=true;for(let t=0;t<sec;t+=1/60)step(1/60);for(const key of k)keys[key]=false;draw()},interact,get near(){return near}};
