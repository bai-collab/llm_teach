<!doctype html>
<html lang="zh-Hant">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>老師當導演</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：一塊教室黑板當舞台，下方是字幕與講者用的分段控制列（刻意只用黑板單一外觀） */
:root{
  --board:#23392f;      /* 黑板 */
  --board-deep:#1a2b23; /* 黑板陰影與頁面底色 */
  --frame:#6e4c31;      /* 木框 */
  --chalk:#efe9d8;      /* 白粉筆 */
  --chalk-dim:#a9b3a6;  /* 擦過的粉筆 */
  --yellow:#f2c14e;     /* 黃粉筆：重點 */
  --orange:#e8875b;     /* 作者 AI */
  --blue:#7fb6d9;       /* 審查 AI */
  --green:#8fd18a;      /* 通過 */
  --red:#e66a5c;        /* 退件 */
  --font-chalk:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--board-deep);color:var(--chalk)}
body{margin:0;font-family:var(--font-body);padding-inline:16px;padding-block:20px 28px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--font-chalk);font-weight:700;font-size:clamp(1.5rem,3.2vw,2.1rem);margin:0;color:var(--chalk);text-wrap:balance}
.sub{color:var(--chalk-dim);font-size:.95rem;margin:0}
.board{box-sizing:border-box;position:relative;border:14px solid var(--frame);border-radius:6px;background:var(--board);box-shadow:inset 0 0 60px rgba(0,0,0,.45);max-width:100%}
.board svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.caption{font-family:var(--font-chalk);font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.5;min-height:2.3em;margin:0;color:var(--chalk)}
.caption b{color:var(--yellow);font-weight:700}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button{font:inherit;font-size:.95rem;color:var(--chalk);background:transparent;border:1.5px solid var(--chalk-dim);border-radius:999px;padding:.4em 1em;cursor:pointer}
button:hover{border-color:var(--yellow);color:var(--yellow)}
button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#play{min-width:5.5em;border-color:var(--yellow);color:var(--yellow)}
#scrub{flex:1 1 220px;min-width:0;accent-color:var(--yellow)}
#time{font-variant-numeric:tabular-nums;color:var(--chalk-dim);font-size:.9rem;min-width:6.5em;text-align:right}
.chapters{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chapters button{font-size:.88rem;padding:.3em .85em;border-color:rgba(239,233,216,.25);color:var(--chalk-dim)}
.chapters button[aria-current="true"]{border-color:var(--yellow);color:var(--yellow)}
.note{color:var(--chalk-dim);font-size:.85rem;margin:0}
.works h2{font-family:var(--font-chalk);font-size:1.15rem;margin:0 0 6px;color:var(--yellow)}
.works ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px}
.works li{min-width:0}
.works a{color:var(--chalk);text-decoration-color:var(--chalk-dim);text-underline-offset:3px}
.works a:hover{color:var(--yellow)}
.works span{display:block;color:var(--chalk-dim);font-size:.85rem}
/* 舞台內文字 */
.t-chalk{font-family:var(--font-chalk);fill:var(--chalk)}
.t-body{font-family:var(--font-body);fill:var(--chalk)}
@media (prefers-reduced-motion: reduce){ .board{box-shadow:none} }
</style>

<div class="wrap">
  <header>
    <h1>老師當導演：我跟 AI 一起備課的方法</h1>
    <p class="sub">兩分鐘・十段・可停在任一段解說</p>
  </header>
  <div class="board"><svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="AI 協作備課動畫"></svg></div>
  <p class="caption" id="caption" aria-live="polite"></p>
  <div class="controls">
    <button id="prev" type="button" aria-label="上一段">上一段</button>
    <button id="play" type="button">播放</button>
    <button id="next" type="button" aria-label="下一段">下一段</button>
    <input id="scrub" type="range" min="0" max="123" step="0.05" value="0" aria-label="時間軸">
    <span id="time">0.0 / 123.0</span>
  </div>
  <ul class="chapters" id="chapters"></ul>
  <section class="works" aria-labelledby="works-h"><h2 id="works-h">影片中的作品</h2><ul id="works"></ul></section>
  <p class="note">鍵盤：空白鍵播放／暫停，左右方向鍵切換段落。畫面只由時間決定，可用 window.seek(t) 逐格輸出成影片。</p>
</div>

<script>
// ===== 時間表（秒）=====
window.DURATION = 123;
// o：舊版場景的原始起點（舊場景以絕對時間撰寫，換算後沿用）；新場景收本段的經過秒數。
const SEGS = [
  {a:0,   b:8,   name:'開場',      cap:'AI 不是替你做事，是<b>你當導演</b>，AI 當小幫手。'},
  {a:8,   b:20,  name:'先說清楚',  cap:'一句話需求，先展開成<b>給誰、學什麼、多長</b>，再開始做。'},
  {a:20,  b:34,  name:'五種角色',  cap:'同一個 AI 可以<b>加快速度、協助發想、分析、批判、整理</b>。先決定這次要它當哪一種。'},
  {a:34,  b:49,  name:'協助發想',  cap:'協助發想：AI 會<b>用各種工具四處找資料</b>，給出很多點子，老師挑出適合自己班的。'},
  {a:49,  b:63,  name:'協助分析',  cap:'協助分析：把散落的書單、學習單、週次表，<b>整理成一張看得懂的路網</b>。'},
  {a:63,  b:77,  name:'先畫路線圖',cap:'先畫路線圖，關鍵處停下來，<b>老師點頭才往下走</b>。'},
  {a:77,  b:91,  name:'分工',      cap:'不同 AI 各領一張任務卡，<b>最後決定權在老師</b>。'},
  {a:91,  b:103, name:'協助批判',  cap:'協助批判：做完交給<b>另一家 AI</b> 挑毛病，作者不能自己審自己。'},
  {a:103, b:115, name:'錯誤筆記本',cap:'被糾正的事寫進筆記本，<b>下次備課前自動翻到那一頁</b>。'},
  {a:115, b:123, name:'成果牆',    cap:'這些都從一句話開始。<b>你也可以。</b>'}
];

// ===== 純函數工具 =====
const clamp=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));
const P=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const typed=(s,x)=>s.slice(0,Math.round([...s].length*clamp(x,0,1))).replace(/[<>&]/g,'');
function sceneOpacity(t,s,last){
  const fin=P(t,s.a,s.a+0.5), fout=last?1:1-P(t,s.b-0.4,s.b);
  return Math.min(fin,fout);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// ===== 圖形元件 =====
function teacher(x,y,o=1,s=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}">
    <circle cx="0" cy="-118" r="34" fill="none" stroke="var(--chalk)" stroke-width="5"/>
    <path d="M-12 -122 q4 -5 8 0 M8 -122 q4 -5 8 0" stroke="var(--chalk)" stroke-width="3" fill="none"/>
    <path d="M-8 -104 q8 7 16 0" stroke="var(--chalk)" stroke-width="3" fill="none"/>
    <path d="M-48 0 Q-48 -78 0 -80 Q48 -78 48 0 Z" fill="none" stroke="var(--chalk)" stroke-width="5"/>
    <rect x="-34" y="-60" width="68" height="26" rx="6" fill="var(--yellow)"/>
    <text x="0" y="-41" text-anchor="middle" class="t-body" style="font-size:17px;font-weight:700;fill:var(--board-deep)">導演</text>
  </g>`;
}
function helper(x,y,color,label,o=1,s=1,tag=''){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}">
    <line x1="0" y1="-62" x2="0" y2="-82" stroke="${color}" stroke-width="4"/>
    <circle cx="0" cy="-86" r="7" fill="${color}"/>
    <rect x="-46" y="-62" width="92" height="74" rx="18" fill="none" stroke="${color}" stroke-width="5"/>
    <circle cx="-16" cy="-28" r="7" fill="${color}"/><circle cx="16" cy="-28" r="7" fill="${color}"/>
    <path d="M-12 -8 q12 8 24 0" stroke="${color}" stroke-width="3.5" fill="none"/>
    <text x="0" y="44" text-anchor="middle" class="t-chalk" style="font-size:26px;fill:${color}">${esc(label)}</text>
    ${tag?`<text x="0" y="72" text-anchor="middle" class="t-body" style="font-size:17px;fill:var(--chalk-dim)">${esc(tag)}</text>`:''}
  </g>`;
}
function card(x,y,w,h,title,body,o=1,color='var(--chalk)'){
  return `<g transform="translate(${x} ${y})" opacity="${o}">
    <rect x="0" y="0" width="${w}" height="${h}" rx="10" fill="rgba(239,233,216,.06)" stroke="${color}" stroke-width="3" stroke-dasharray="2 0"/>
    <text x="22" y="40" class="t-body" style="font-size:20px;fill:var(--chalk-dim)">${esc(title)}</text>
    <text x="22" y="${h-28}" class="t-chalk" style="font-size:32px;fill:${color}">${esc(body)}</text>
  </g>`;
}
function doc(x,y,o=1,s=1,rot=0){
  let lines='';
  for(let i=0;i<5;i++) lines+=`<line x1="18" y1="${36+i*22}" x2="${i===4?70:102}" y2="${36+i*22}" stroke="var(--chalk-dim)" stroke-width="4"/>`;
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity="${o}">
    <path d="M0 0 H96 L120 24 V150 H0 Z" fill="var(--board)" stroke="var(--chalk)" stroke-width="4"/>
    <text x="18" y="26" class="t-body" style="font-size:15px;fill:var(--yellow)">教案</text>${lines}
  </g>`;
}
function stamp(x,y,text,color,o,s,rot=-12){
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity="${o}">
    <rect x="-110" y="-38" width="220" height="76" rx="10" fill="none" stroke="${color}" stroke-width="6"/>
    <text x="0" y="14" text-anchor="middle" class="t-chalk" style="font-size:40px;font-weight:700;fill:${color}">${esc(text)}</text>
  </g>`;
}

// ===== 各段畫面（每一格只由 t 決定）=====
function s1(t){
  const title='老師當導演';
  let g=`<text x="800" y="250" text-anchor="middle" class="t-chalk" style="font-size:118px;font-weight:700">${typed(title,P(t,0.3,2.6))}</text>`;
  g+=`<text x="800" y="335" text-anchor="middle" class="t-chalk" style="font-size:40px;fill:var(--yellow)" opacity="${ease(P(t,2.8,3.8))}">AI 不是替你做，是你當導演</text>`;
  g+=teacher(800,700,ease(P(t,3.2,4)));
  const hs=[[470,640,'var(--orange)','規劃'],[640,500,'var(--blue)','製作'],[960,500,'var(--green)','查資料'],[1130,640,'var(--yellow)','檢查']];
  hs.forEach((h,i)=>{const x=P(t,4.2+i*0.45,4.9+i*0.45);g+=helper(h[0],h[1],h[2],h[3],x,back(x)*0.95)});
  return g;
}
function s2(t){
  let g=teacher(230,720,1);
  const bub=ease(P(t,8.3,9));
  g+=`<g opacity="${bub}"><path d="M300 520 Q290 430 380 420 H860 Q930 420 930 480 V520 Q930 580 860 580 H400 L320 630 Z" fill="none" stroke="var(--chalk)" stroke-width="4"/>
    <text x="410" y="515" class="t-chalk" style="font-size:44px">${typed('幫我做一份臆測教案',P(t,8.8,11))}</text></g>`;
  const arrow=ease(P(t,11.4,12.2));
  g+=`<path d="M950 500 H${lerp(950,1040,arrow)}" stroke="var(--yellow)" stroke-width="5" opacity="${arrow}"/>`;
  g+=`<text x="1000" y="130" class="t-chalk" style="font-size:34px;fill:var(--yellow)" opacity="${ease(P(t,11.6,12.4))}">先問清楚，再動手</text>`;
  const cs=[['給誰','國小五年級'],['學什麼','倍數的規律'],['多長','兩節課・80 分鐘'],['只用哪些事實','課本第 3 單元']];
  cs.forEach((c,i)=>{const x=ease(P(t,12.4+i*1.1,13.2+i*1.1));g+=card(lerp(1180,1060,x),170+i*170,470,140,c[0],c[1],x,i===3?'var(--yellow)':'var(--chalk)')});
  return g;
}
function s3(t){
  const nodes=[['規劃路線','主 AI'],['老師核准','等你點頭'],['製作','小幫手'],['檢查','另一家 AI'],['交付','給老師']];
  const y0=110, dy=165, x=620;
  let g=`<text x="1060" y="170" class="t-chalk" style="font-size:40px">先畫路線圖</text>
    <text x="1060" y="230" class="t-body" style="font-size:24px;fill:var(--chalk-dim)">每一站做什麼、誰負責、</text>
    <text x="1060" y="266" class="t-body" style="font-size:24px;fill:var(--chalk-dim)">哪裡要停下來等老師。</text>`;
  // 點的位置：0→1 站，停在第 2 站（核准），再走到最後
  let pos;
  if(t<22) pos=0;
  else if(t<24.5) pos=lerp(0,1,ease(P(t,22,24.5)));
  else if(t<28.5) pos=1;
  else pos=lerp(1,4,ease(P(t,28.5,32.5)));
  const draw=ease(P(t,20.3,21.8));
  g+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${lerp(y0,y0+dy*4,draw)}" stroke="var(--chalk-dim)" stroke-width="4" stroke-dasharray="10 10"/>`;
  const approved=t>=28;
  nodes.forEach((n,i)=>{
    const o=ease(P(t,20.4+i*0.25,20.9+i*0.25));
    const reached=pos>=i-0.01;
    const isGate=i===1;
    let col=reached?'var(--yellow)':'var(--chalk-dim)';
    if(isGate) col=approved?'var(--green)':(reached?'var(--yellow)':'var(--chalk-dim)');
    const pulse=isGate&&reached&&!approved?(1+0.08*Math.sin((t-24.5)*6)):1;
    const shape=isGate
      ?`<path d="M0 -50 L60 0 L0 50 L-60 0 Z" fill="var(--board)" stroke="${col}" stroke-width="5" transform="scale(${pulse})"/>`
      :`<circle r="40" fill="var(--board)" stroke="${col}" stroke-width="5"/>`;
    g+=`<g transform="translate(${x} ${y0+i*dy})" opacity="${o}">${shape}
      <text x="${isGate?90:70}" y="-4" class="t-chalk" style="font-size:34px;fill:${col}">${esc(n[0])}</text>
      <text x="${isGate?90:70}" y="30" class="t-body" style="font-size:20px;fill:var(--chalk-dim)">${isGate&&approved?'已核准':n[1]}</text></g>`;
  });
  g+=`<circle cx="${x}" cy="${y0+pos*dy}" r="14" fill="var(--yellow)" opacity="${draw}"/>`;
  // 老師在核准站點頭
  const tOp=ease(P(t,24.6,25.4));
  g+=teacher(300,y0+dy+120,tOp,0.85);
  g+=`<text x="300" y="${y0+dy-30}" text-anchor="middle" class="t-chalk" style="font-size:30px;fill:${approved?'var(--green)':'var(--yellow)'}" opacity="${tOp}">${approved?'好，往下做':'這樣可以嗎？'}</text>`;
  return g;
}
function s4(t){
  let g=teacher(250,760,1);
  const hs=[[820,300,'var(--orange)','Claude','規劃・寫教案','寫教案'],[1100,300,'var(--blue)','Codex','動手做網頁','做闖關網頁'],[1380,300,'var(--green)','Gemini','大量閱讀・審查','查課綱與文獻']];
  hs.forEach((h,i)=>{
    const o=ease(P(t,34.3+i*0.3,35+i*0.3));
    g+=helper(h[0],h[1],h[2],h[3],o,1,h[4]);
    const f=ease(P(t,36+i*1.6,37.4+i*1.6));
    const cx=lerp(330,h[0]-90,f), cy=lerp(620,470,f)-Math.sin(f*Math.PI)*120;
    g+=`<g transform="translate(${cx} ${cy}) rotate(${lerp(-8,0,f)})" opacity="${P(t,35.8+i*1.6,36.1+i*1.6)}">
      <rect x="0" y="0" width="180" height="70" rx="8" fill="var(--board)" stroke="${h[2]}" stroke-width="4"/>
      <text x="90" y="45" text-anchor="middle" class="t-chalk" style="font-size:28px;fill:${h[2]}">${esc(h[5])}</text></g>`;
  });
  const st=P(t,43.2,44);
  if(st>0) g+=stamp(560,640,'最後決定權',`var(--yellow)`,st,lerp(1.6,1,ease(st)),-8);
  g+=`<text x="140" y="150" class="t-chalk" style="font-size:40px">粗工交給小幫手</text>
      <text x="140" y="205" class="t-body" style="font-size:24px;fill:var(--chalk-dim)">各自擅長的事，分開做。</text>`;
  return g;
}
function s5(t){
  let g=`<text x="800" y="110" text-anchor="middle" class="t-chalk" style="font-size:46px;fill:var(--yellow)">協助批判：自己不審自己</text>`;
  g+=helper(330,560,'var(--orange)','作者 AI',1,1.25);
  g+=helper(1270,560,'var(--blue)','審查 AI',1,1.25,'不同家的模型');
  const mv=ease(P(t,49,51.5));
  const dx=lerp(420,740,mv);
  g+=doc(dx,330,1,1.6);
  // 放大鏡掃描
  const sc=P(t,52,55.5);
  if(t>=51.8){
    const my=lerp(360,540,(Math.sin(sc*Math.PI*2-Math.PI/2)+1)/2);
    g+=`<g opacity="${ease(P(t,51.8,52.3))*(1-P(t,57.5,58))}"><circle cx="${1000}" cy="${my}" r="44" fill="none" stroke="var(--blue)" stroke-width="6"/>
       <line x1="1031" y1="${my+31}" x2="1078" y2="${my+78}" stroke="var(--blue)" stroke-width="10" stroke-linecap="round"/>
       <line x1="${dx+10}" y1="${my}" x2="${dx+190}" y2="${my}" stroke="var(--blue)" stroke-width="2" opacity=".6"/></g>`;
  }
  const found=P(t,55.6,56.2);
  const fo=found*(1-P(t,57.6,58));
  if(fo>0){
    g+=`<ellipse cx="${dx+95}" cy="${330+36+22*2}" rx="110" ry="26" fill="none" stroke="var(--red)" stroke-width="5" opacity="${fo}"/>
        <text x="${dx+95}" y="640" text-anchor="middle" class="t-chalk" style="font-size:30px;fill:var(--red)" opacity="${fo}">這一行的數字不對</text>`;
  }
  const ok=P(t,58,58.6);
  if(ok>0) g+=stamp(dx+100,470,'修正後通過','var(--green)',ok,lerp(1.7,1,ease(ok)));
  return g;
}
function s6(t){
  const open=ease(P(t,60.2,61.8));
  const w=lerp(40,560,open);
  let g=`<g transform="translate(800 470)">
    <rect x="${-w}" y="-280" width="${w}" height="520" rx="8" fill="rgba(239,233,216,.06)" stroke="var(--chalk)" stroke-width="4"/>
    <rect x="0" y="-280" width="${w}" height="520" rx="8" fill="rgba(239,233,216,.06)" stroke="var(--chalk)" stroke-width="4"/>
    <line x1="0" y1="-280" x2="0" y2="240" stroke="var(--chalk)" stroke-width="5"/>`;
  const inner=ease(P(open,0.8,1));
  if(inner>0){
    g+=`<g opacity="${inner}">`;
    for(let i=0;i<7;i++) g+=`<line x1="-520" y1="${-180+i*60}" x2="-40" y2="${-180+i*60}" stroke="rgba(239,233,216,.12)" stroke-width="2"/><line x1="40" y1="${-180+i*60}" x2="520" y2="${-180+i*60}" stroke="rgba(239,233,216,.12)" stroke-width="2"/>`;

const playBtn=document.getElementById('play'), scrub=document.getElementById('scrub'), timeEl=document.getElementById('time');

function show(t){
  cur=clamp(t,0,window.DURATION);scrub.value=cur;
  timeEl.textContent=`${cur.toFixed(1)} / ${window.DURATION.toFixed(1)}`;
  window.seek(cur);

function frame(now){if(!playing)return;cur+=(now-last)/1000;last=now;if(cur>=window.DURATION){cur=window.DURATION;pause()}show(cur);if(playing)requestAnimationFrame(frame)}

  if(e.target.tagName==='INPUT'&&e.key!==' ')return;
  if(e.key===' '&&e.target.tagName==='BUTTON'&&e.target!==playBtn)return;
  if(e.key===' '){e.preventDefault();playBtn.click()}

  else if(e.key==='ArrowLeft'){document.getElementById('prev').click()}
