<!doctype html>
<html lang="zh-Hant">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>教師儀表板導覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：一塊教室黑板當舞台，下方是字幕與講者用的分段控制列（刻意只用黑板單一外觀） */
:root{
  --board:#23392f;      /* 黑板 */
  --board-deep:#1a2b23; /* 黑板陰影與頁面底色 */
  --frame:#6e4c31;      /* 木框 */
  --chalk:#efe9d8;      /* 白粉筆 */
  --chalk-dim:#a9b3a6;  /* 擦過的粉筆 */
  --yellow:#f2c14e;     /* 黃粉筆：重點 */
  --orange:#e8875b;     /* 作者 AI */
  --blue:#7fb6d9;       /* 審查 AI */
  --green:#8fd18a;      /* 通過 */
  --red:#e66a5c;        /* 退件 */
  --font-chalk:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--board-deep);color:var(--chalk)}
body{margin:0;font-family:var(--font-body)}
/* ===== 播放器版面公版（ptt_teach 研習頁同一套規則）=====
   1) 播放區 .player（標題列＋舞台＋字幕＋控制列）剛好佔一個視窗高；章節、延伸閱讀、出處在下方，往下捲才看到。
   2) 舞台吃「扣掉標題列、字幕、控制列後的剩餘空間」：.stage-area 是容器查詢容器，.board 用 cqw／cqh 算出 16:9 最大尺寸並置中；
      木框寬度只用 --bw 變數計入（SVG 本身維持 16:9），不得再用固定像素去扣高度。
   3) 進度條列可收合（#toggleSeek），預設收起；收起時舞台自動變大。字幕至少預留兩行，段落切換時舞台不跳動。 */
.wrap{max-width:1600px;margin:0 auto;padding-inline:16px;padding-bottom:28px;display:flex;flex-direction:column;gap:14px}
.player{box-sizing:border-box;height:100vh;height:100dvh;padding-block:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.player>header,.player>.controls{flex:none}
.theater{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.theater .caption{align-self:stretch;flex:none}
.stage-area{flex:1 1 0;min-height:0;align-self:stretch;display:flex;align-items:center;justify-content:center;container-type:size}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px}
h1{font-family:var(--font-chalk);font-weight:700;font-size:clamp(1.3rem,2.6vw,1.9rem);margin:0;color:var(--chalk);text-wrap:balance}
.sub{color:var(--chalk-dim);font-size:.95rem;margin:0}
.board{--bw:14px;position:relative;box-sizing:border-box;border:var(--bw) solid var(--frame);border-radius:6px;background:var(--board);box-shadow:inset 0 0 60px rgba(0,0,0,.45);flex:none;max-width:100%;
  width:100%;width:min(100cqw, calc((100cqh - 2 * var(--bw)) * 16 / 9 + 2 * var(--bw)))}
@media (max-width:640px){.board{--bw:8px}}
.board svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.caption{font-family:var(--font-chalk);font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.5;min-height:3em;margin:0;color:var(--chalk)}
.caption b{color:var(--yellow);font-weight:700}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
button{font:inherit;font-size:.95rem;color:var(--chalk);background:transparent;border:1.5px solid var(--chalk-dim);border-radius:999px;padding:.4em 1em;cursor:pointer}
button:hover{border-color:var(--yellow);color:var(--yellow)}
button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#play{min-width:5.5em;border-color:var(--yellow);color:var(--yellow)}
#fs{margin-left:auto}
#toggleSeek[aria-expanded="true"]{border-color:var(--yellow);color:var(--yellow)}
/* 進度條列：獨佔 .controls 的第二列；黃色 6px 粗軌道畫在 #seekMarks（細線＝段落分界），上面疊透明的 range 與 16px 圓拇指 */
.seekrow{display:flex;flex:1 0 100%;align-items:center;gap:12px}
.seekrow[hidden]{display:none}
#seekWrap{position:relative;flex:1 1 200px;min-width:120px;height:20px}
#scrub{position:relative;z-index:1;-webkit-appearance:none;appearance:none;display:block;width:100%;height:20px;padding:0;margin:0;border:0;border-radius:0;background:transparent;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:6px;background:transparent}
#scrub::-moz-range-track{height:6px;border:0;background:transparent}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5px;border:2px solid var(--board-deep);border-radius:50%;background:var(--yellow)}
#scrub::-moz-range-thumb{box-sizing:border-box;width:16px;height:16px;border:2px solid var(--board-deep);border-radius:50%;background:var(--yellow)}
#seekMarks{position:absolute;left:8px;right:8px;top:7px;height:6px;border-radius:3px;overflow:hidden;background:var(--yellow);pointer-events:none}
#seekMarks i{position:absolute;top:0;bottom:0;width:1px;background:var(--board-deep)}
#time{flex:none;width:8.5em;text-align:right;font-variant-numeric:tabular-nums;color:var(--chalk-dim);font-size:.85rem}
.chapters{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chapters button{font-size:.88rem;padding:.3em .85em;border-color:rgba(239,233,216,.25);color:var(--chalk-dim)}
.chapters button[aria-current="true"]{border-color:var(--yellow);color:var(--yellow)}
.note{color:var(--chalk-dim);font-size:.85rem;margin:0}
.works h2{font-family:var(--font-chalk);font-size:1.15rem;margin:0 0 6px;color:var(--yellow)}
.works ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px}
.works li{min-width:0}
.works a{color:var(--chalk);text-decoration-color:var(--chalk-dim);text-underline-offset:3px}
.works a:hover{color:var(--yellow)}
.works span{display:block;color:var(--chalk-dim);font-size:.85rem}
/* 舞台內文字 */
.t-chalk{font-family:var(--font-chalk);fill:var(--chalk)}
.t-body{font-family:var(--font-body);fill:var(--chalk)}
@media (prefers-reduced-motion: reduce){ .board{box-shadow:none} }
/* 標註工具（手寫筆跡＋文字）：標註層蓋在舞台上，平常 pointer-events:none，只有畫筆／文字啟用時才攔截；?embed=1 不建立 */
.board{position:relative}
.annoLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;--u:1px}
.annoLayer canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;background:none;border-radius:0;aspect-ratio:auto;box-shadow:none}
.annoLayer canvas.on{pointer-events:auto;touch-action:none;cursor:crosshair}
.annoLayer canvas.on.text-mode{cursor:text}
.annoLabels{position:absolute;inset:0;pointer-events:none}
.annoLabel{position:absolute;transform:translateY(-50%);font-family:var(--font-chalk,serif);font-size:calc(34 * var(--u));font-weight:700;line-height:1.25;padding:calc(4 * var(--u)) calc(14 * var(--u));background:rgba(26,43,35,.82);border:calc(2 * var(--u)) solid;border-radius:calc(10 * var(--u));white-space:pre-wrap;max-width:56%;word-break:break-word}
.annoInput{position:absolute;transform:translateY(-50%);box-sizing:border-box;width:max(180px,32%);max-width:92%;font-family:var(--font-chalk,serif);font-size:max(16px,calc(30 * var(--u)));font-weight:700;pointer-events:auto;background:rgba(26,43,35,.95);border:2px dashed var(--yellow,#f2c14e);color:var(--chalk,#efe9d8)}
.annoInput[hidden]{display:none}
#toggleInk[aria-expanded="true"]{border-color:var(--yellow,#f2c14e);color:var(--yellow,#f2c14e)}
/* 工具列：獨佔 .controls 的一整列 */
.annoRow{display:flex;flex:1 0 100%;flex-wrap:wrap;align-items:center;gap:8px 10px}
.annoRow[hidden]{display:none}
.annoSwatches{display:inline-flex;align-items:center;gap:8px}
.annoSwatch{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.annoSwatch[aria-pressed="true"]{border-color:#fff;outline:2px solid var(--board-deep,var(--bg,#1a2b23))}
.annoRow button[aria-pressed="true"]:not(.annoSwatch){border-color:var(--yellow,#f2c14e);color:var(--board-deep,#1a2b23);background:var(--yellow,#f2c14e)}
</style>

<div class="wrap">
  <section class="player" aria-label="動畫播放器">
    <header>
      <h1>教師儀表板：看懂全班作答，再請 AI 幫忙分析</h1>
      <p class="sub">一分鐘・六段・可停在任一段解說</p>
    </header>
    <div class="theater">
      <div class="stage-area"><div class="board"><svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="教師儀表板功能動畫"></svg></div></div>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>
    <div class="controls">
      <button id="prev" type="button" aria-label="上一段">上一段</button>
      <button id="play" type="button">播放</button>
      <button id="next" type="button" aria-label="下一段">下一段</button>
      <button id="toggleSeek" type="button" aria-expanded="false" aria-controls="seekrow">進度條 ▸</button>
      <div class="seekrow" id="seekrow" hidden>
        <div id="seekWrap">
          <input id="scrub" type="range" min="0" max="60" step="0.05" value="0" aria-label="時間軸">
          <div id="seekMarks" aria-hidden="true"></div>
        </div>
        <span id="time">0.0 / 60.0</span>
      </div>
    </div>
  </section>
  <ul class="chapters" id="chapters"></ul>
  <p class="note">畫面中的學生與數字皆為公開範本的假資料。<a href="https://github.com/bai-collab/teacher_UI" target="_blank" rel="noopener" style="color:inherit">teacher_UI 範本</a>｜<a href="https://bai-collab.github.io/llm_teach/animations/teacher-as-director/" target="_blank" rel="noopener" style="color:inherit">老師當導演（上一支動畫）</a><br>鍵盤：空白鍵播放／暫停，左右方向鍵切換段落。畫面只由時間決定，可用 window.seek(t) 逐格輸出成影片。</p>
</div>

<script>
// ===== 時間表（秒）=====
window.DURATION = 60;
const SEGS = [
  {a:0,  b:8,  name:'開場',      cap:'全班做到哪？誰卡住了？紀錄一多，<b>老師很難一筆一筆翻</b>。'},
  {a:8,  b:20, name:'找學生',    cap:'輸入學生代號，或看全部學生；再用<b>題目、紀錄類型、日期</b>篩選。'},
  {a:20, b:32, name:'作答紀錄',  cap:'每次作答排成時間軸，<b>範例、失敗、評分時改程式的都不算</b>，只看最後有效成績。'},
  {a:32, b:46, name:'AI 分析',   cap:'老師<b>按下送出才呼叫 AI</b>；回答分成觀察、推測、建議、限制。'},
  {a:46, b:54, name:'老師核對',  cap:'點引用就跳回原始紀錄，<b>核對依據後再採用建議</b>。'},
  {a:54, b:60, name:'結語',      cap:'紀錄留在本機、金鑰集中設定，<b>要不要採用建議，由老師決定</b>。'}
];

// ===== 純函數工具 =====
const clamp=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));
const P=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const typed=(s,x)=>s.slice(0,Math.round([...s].length*clamp(x,0,1))).replace(/[<>&]/g,'');
function sceneOpacity(t,s,last){
  const fin=P(t,s.a,s.a+0.5), fout=last?1:1-P(t,s.b-0.4,s.b);
  return Math.min(fin,fout);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// ===== 圖形元件 =====
function teacher(x,y,o=1,s=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}">
    <circle cx="0" cy="-118" r="34" fill="none" stroke="var(--chalk)" stroke-width="5"/>
    <path d="M-12 -122 q4 -5 8 0 M8 -122 q4 -5 8 0" stroke="var(--chalk)" stroke-width="3" fill="none"/>
    <path d="M-8 -104 q8 7 16 0" stroke="var(--chalk)" stroke-width="3" fill="none"/>
    <path d="M-48 0 Q-48 -78 0 -80 Q48 -78 48 0 Z" fill="none" stroke="var(--chalk)" stroke-width="5"/>
    <rect x="-34" y="-60" width="68" height="26" rx="6" fill="var(--yellow)"/>
    <text x="0" y="-41" text-anchor="middle" class="t-body" style="font-size:17px;font-weight:700;fill:var(--board-deep)">導演</text>
  </g>`;
}
function helper(x,y,color,label,o=1,s=1,tag=''){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}">
    <line x1="0" y1="-62" x2="0" y2="-82" stroke="${color}" stroke-width="4"/>
    <circle cx="0" cy="-86" r="7" fill="${color}"/>
    <rect x="-46" y="-62" width="92" height="74" rx="18" fill="none" stroke="${color}" stroke-width="5"/>
    <circle cx="-16" cy="-28" r="7" fill="${color}"/><circle cx="16" cy="-28" r="7" fill="${color}"/>
    <path d="M-12 -8 q12 8 24 0" stroke="${color}" stroke-width="3.5" fill="none"/>
    <text x="0" y="44" text-anchor="middle" class="t-chalk" style="font-size:26px;fill:${color}">${esc(label)}</text>
    ${tag?`<text x="0" y="72" text-anchor="middle" class="t-body" style="font-size:17px;fill:var(--chalk-dim)">${esc(tag)}</text>`:''}
  </g>`;
}
function card(x,y,w,h,title,body,o=1,color='var(--chalk)'){
  return `<g transform="translate(${x} ${y})" opacity="${o}">
    <rect x="0" y="0" width="${w}" height="${h}" rx="10" fill="rgba(239,233,216,.06)" stroke="${color}" stroke-width="3" stroke-dasharray="2 0"/>
    <text x="22" y="40" class="t-body" style="font-size:20px;fill:var(--chalk-dim)">${esc(title)}</text>
    <text x="22" y="${h-28}" class="t-chalk" style="font-size:32px;fill:${color}">${esc(body)}</text>
  </g>`;
}
function doc(x,y,o=1,s=1,rot=0){
  let lines='';
  for(let i=0;i<5;i++) lines+=`<line x1="18" y1="${36+i*22}" x2="${i===4?70:102}" y2="${36+i*22}" stroke="var(--chalk-dim)" stroke-width="4"/>`;
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity="${o}">
    <path d="M0 0 H96 L120 24 V150 H0 Z" fill="var(--board)" stroke="var(--chalk)" stroke-width="4"/>
    <text x="18" y="26" class="t-body" style="font-size:15px;fill:var(--yellow)">教案</text>${lines}
  </g>`;
}
function stamp(x,y,text,color,o,s,rot=-12){
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity="${o}">
    <rect x="-110" y="-38" width="220" height="76" rx="10" fill="none" stroke="${color}" stroke-width="6"/>
    <text x="0" y="14" text-anchor="middle" class="t-chalk" style="font-size:40px;font-weight:700;fill:${color}">${esc(text)}</text>
  </g>`;
}

// ===== 儀表板場景（u＝本段經過秒數；畫面中的學生與數字皆為公開範本的假資料）=====
const rnd=(i,k)=>{const x=Math.sin(i*12.9898+k*78.233)*43758.5453;return x-Math.floor(x)}; // 固定種子
const box=(x,y,w,h,o=1,stroke='var(--chalk-dim)',fill='rgba(239,233,216,.04)',r=10)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3" opacity="${o}"/>`;
const txt=(x,y,s,size=26,fill='var(--chalk)',cls='t-chalk',extra='')=>`<text x="${x}" y="${y}" class="${cls}" style="font-size:${size}px;fill:${fill}" ${extra}>${esc(s)}</text>`;
// 儀表板外框：左側找學生，右側工作區
function uiFrame(title,o=1){
  return `<g opacity="${o}">${box(110,130,1380,700,1,'var(--chalk)','rgba(239,233,216,.03)',14)}
    <line x1="420" y1="130" x2="420" y2="830" stroke="var(--chalk-dim)" stroke-width="3"/>
    ${txt(140,182,'教師工作台',30)}${txt(460,182,title,30,'var(--yellow)')}</g>`;
}
function sidebar(u0,u){
  const q=typed('測試01',P(u,u0,u0+1.2));
  let g=txt(140,236,'找學生',22,'var(--chalk-dim)','t-body');
  g+=box(140,252,250,52,1,P(u,u0-0.3,u0)>0&&u<u0+2.4?'var(--yellow)':'var(--chalk-dim)');
  g+=txt(158,288,q||'輸入學生代號',24,q?'var(--chalk)':'var(--chalk-dim)','t-body');
  const hit=P(u,u0+1.3,u0+1.8);
  g+=box(140,330,250,58,1,hit>0?'var(--yellow)':'var(--chalk-dim)',hit>0?'rgba(242,193,78,.12)':'rgba(239,233,216,.04)')+txt(160,368,'測試01',26)+txt(370,368,'7 筆',20,'var(--chalk-dim)','t-body','text-anchor="end"');
  g+=box(140,400,250,58,1-0.5*hit)+txt(160,438,'測試02',26,'var(--chalk)','t-chalk',`opacity="${1-0.5*hit}"`)+txt(370,438,'5 筆',20,'var(--chalk-dim)','t-body',`text-anchor="end" opacity="${1-0.5*hit}"`);
  g+=box(140,480,250,52,1,'var(--chalk-dim)')+txt(265,515,'全部學生',22,'var(--chalk)','t-body','text-anchor="middle"');
  return g;
}
function d1(u){
  let g=`<text x="800" y="150" text-anchor="middle" class="t-chalk" style="font-size:60px;font-weight:700">${typed('全班做到哪？誰卡住了？',P(u,0.2,2.2))}</text>`;
  g+=`<text x="800" y="215" text-anchor="middle" class="t-body" style="font-size:26px;fill:var(--chalk-dim)" opacity="${ease(P(u,2.2,3))}">教師儀表板：作答紀錄＋AI 分析助手</text>`;
  const kinds=['評分 20/40','求助','範例','評分 0/40','失敗','評分 10/40','求助','評分 20/40','範例','失敗','評分 0/40','求助'];
  kinds.forEach((k,i)=>{
    const o=ease(P(u,1+i*0.25,1.5+i*0.25));
    const x=620+rnd(i,1)*760, y=300+rnd(i,2)*430, r=(rnd(i,3)-0.5)*40;
    g+=`<g transform="translate(${x} ${y}) rotate(${r})" opacity="${o}">${box(-95,-32,190,64,1,'var(--chalk-dim)','var(--board)',8)}${txt(0,10,k,24,'var(--chalk)','t-chalk','text-anchor="middle"')}</g>`;
  });
  g+=teacher(330,760,ease(P(u,0.6,1.4)));
  const qm=ease(P(u,4,4.8));
  g+=`<text x="410" y="560" class="t-chalk" style="font-size:72px;fill:var(--yellow)" opacity="${qm}">?</text><text x="250" y="590" class="t-chalk" style="font-size:54px;fill:var(--yellow)" opacity="${qm}">?</text>`;
  return g;
}
function d2(u){
  let g=uiFrame('作答紀錄',ease(P(u,0,0.6)))+sidebar(1,u);
  const F=['學生代號','題目','紀錄類型','開始日期','結束日期'];
  F.forEach((f,i)=>{
    const on=P(u,4.4+i*0.6,4.8+i*0.6)>0&&u<4.8+i*0.6+0.8;
    g+=txt(460+i*200,236,f,20,'var(--chalk-dim)','t-body')+box(460+i*200,250,180,50,1,on?'var(--yellow)':'var(--chalk-dim)');
    g+=txt(476+i*200,284,i===0?(u>2.6?'測試01':'全部學生'):(i<3?'全部':'年/月/日'),22,'var(--chalk)','t-body');
  });

SEGS.forEach((s,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.textContent=`${i+1}・${s.name}`;b.onclick=()=>{pause();show(s.a)};li.appendChild(b);chap.appendChild(li)});
function show(t){
  cur=clamp(t,0,window.DURATION);scrub.value=cur;
  timeEl.textContent=`${cur.toFixed(1)} / ${window.DURATION.toFixed(1)}`;
  window.seek(cur);
  const i=segIndex(cur);[...chap.querySelectorAll('button')].forEach((b,j)=>b.setAttribute('aria-current',j===i?'true':'false'));
}
function frame(now){if(!playing)return;cur+=(now-last)/1000;last=now;if(cur>=window.DURATION){cur=window.DURATION;pause()}show(cur);if(playing)requestAnimationFrame(frame)}
function play(){if(cur>=window.DURATION-0.05)cur=0;playing=true;playBtn.textContent='暫停';last=performance.now();requestAnimationFrame(frame)}
function pause(){playing=false;playBtn.textContent='播放'}
playBtn.onclick=()=>playing?pause():play();
scrub.oninput=()=>{pause();show(parseFloat(scrub.value))};
document.getElementById('prev').onclick=()=>{poster=false;pause();const i=segIndex(cur-0.6);show(SEGS[i].a)};
document.getElementById('next').onclick=()=>{poster=false;pause();const i=segIndex(cur)+1;show(i<SEGS.length?SEGS[i].a:window.DURATION)};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.key!==' ')return;
  if(e.key===' '&&e.target.tagName==='BUTTON'&&e.target!==playBtn)return;
  if(e.key===' '){e.preventDefault();playBtn.click()}
  else if(e.key==='ArrowRight'){document.getElementById('next').click()}
  else if(e.key==='ArrowLeft'){document.getElementById('prev').click()}
});
// 開啟時先停在開場完成的畫面（不自動播放），按播放從頭開始
let poster=true;
const POSTER_T=7.6;
show(POSTER_T);
playBtn.onclick=()=>{if(poster){poster=false;cur=0}playing?pause():play()};
scrub.addEventListener('input',()=>{poster=false});
chap.addEventListener('click',()=>{poster=false});
window.ready.then(()=>show(cur));
</script>

</html>
