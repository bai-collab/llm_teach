<!doctype html>
<html lang="zh-Hant">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>本工作區的 Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：一塊教室黑板當舞台，下方是字幕與講者用的分段控制列（刻意只用黑板單一外觀） */
:root{
  --board:#23392f;      /* 黑板 */
  --board-deep:#1a2b23; /* 黑板陰影與頁面底色 */
  --frame:#6e4c31;      /* 木框 */
  --chalk:#efe9d8;      /* 白粉筆 */
  --chalk-dim:#a9b3a6;  /* 擦過的粉筆 */
  --yellow:#f2c14e;     /* 黃粉筆：重點 */
  --orange:#e8875b;     /* 作者 AI */
  --blue:#7fb6d9;       /* 審查 AI */
  --green:#8fd18a;      /* 通過 */
  --red:#e66a5c;        /* 退件 */
  --font-chalk:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--board-deep);color:var(--chalk)}
body{margin:0;font-family:var(--font-body);padding-inline:16px;padding-block:20px 28px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--font-chalk);font-weight:700;font-size:clamp(1.5rem,3.2vw,2.1rem);margin:0;color:var(--chalk);text-wrap:balance}
.sub{color:var(--chalk-dim);font-size:.95rem;margin:0}
.board{box-sizing:border-box;position:relative;border:14px solid var(--frame);border-radius:6px;background:var(--board);box-shadow:inset 0 0 60px rgba(0,0,0,.45);max-width:100%}
.board svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.caption{font-family:var(--font-chalk);font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.5;min-height:2.3em;margin:0;color:var(--chalk)}
.caption b{color:var(--yellow);font-weight:700}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button{font:inherit;font-size:.95rem;color:var(--chalk);background:transparent;border:1.5px solid var(--chalk-dim);border-radius:999px;padding:.4em 1em;cursor:pointer}
button:hover{border-color:var(--yellow);color:var(--yellow)}
button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#play{min-width:5.5em;border-color:var(--yellow);color:var(--yellow)}
#scrub{flex:1 1 220px;min-width:0;accent-color:var(--yellow)}
#time{font-variant-numeric:tabular-nums;color:var(--chalk-dim);font-size:.9rem;min-width:6.5em;text-align:right}
.chapters{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chapters button{font-size:.88rem;padding:.3em .85em;border-color:rgba(239,233,216,.25);color:var(--chalk-dim)}
.chapters button[aria-current="true"]{border-color:var(--yellow);color:var(--yellow)}
.note{color:var(--chalk-dim);font-size:.85rem;margin:0}
.works h2{font-family:var(--font-chalk);font-size:1.15rem;margin:0 0 6px;color:var(--yellow)}
.works ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px}
.works li{min-width:0}
.works a{color:var(--chalk);text-decoration-color:var(--chalk-dim);text-underline-offset:3px}
.works a:hover{color:var(--yellow)}
.works span{display:block;color:var(--chalk-dim);font-size:.85rem}
/* 舞台內文字 */
.t-chalk{font-family:var(--font-chalk);fill:var(--chalk)}
.t-body{font-family:var(--font-body);fill:var(--chalk)}
@media (prefers-reduced-motion: reduce){ .board{box-shadow:none} }
</style>

<div class="wrap">
  <header>
    <h1>本工作區的 Harness：規則怎麼讓 AI 好好做事</h1>
    <p class="sub">110 秒・十段・可停在任一段解說</p>
  </header>
  <div class="board"><svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="本工作區 Harness 介紹動畫"></svg></div>
  <p class="caption" id="caption" aria-live="polite"></p>
  <div class="controls">
    <button id="prev" type="button" aria-label="上一段">上一段</button>
    <button id="play" type="button">播放</button>
    <button id="next" type="button" aria-label="下一段">下一段</button>
    <input id="scrub" type="range" min="0" max="110" step="0.05" value="0" aria-label="時間軸">
    <span id="time">0.0 / 110.0</span>
  </div>
  <ul class="chapters" id="chapters"></ul>
  <p class="note">內容依本工作區 AGENTS.md 的現行規則整理。<a href="https://bai-collab.github.io/llm_teach/animations/review-landscape/" target="_blank" rel="noopener" style="color:inherit">為什麼要換家審查（3D）</a>｜<a href="https://bai-collab.github.io/llm_teach/animations/teacher-as-director/" target="_blank" rel="noopener" style="color:inherit">老師當導演（上一支動畫）</a><br>鍵盤：空白鍵播放／暫停，左右方向鍵切換段落。畫面只由時間決定，可用 window.seek(t) 逐格輸出成影片。</p>
</div>

<script>
// ===== 純函數工具 =====
const clamp=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));
const P=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const typed=(s,x)=>s.slice(0,Math.round([...s].length*clamp(x,0,1))).replace(/[<>&]/g,'');
function sceneOpacity(t,s,last){
  const fin=P(t,s.a,s.a+0.5), fout=last?1:1-P(t,s.b-0.4,s.b);
  return Math.min(fin,fout);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// ===== 圖形元件 =====
function teacher(x,y,o=1,s=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}">
    <circle cx="0" cy="-118" r="34" fill="none" stroke="var(--chalk)" stroke-width="5"/>
    <path d="M-12 -122 q4 -5 8 0 M8 -122 q4 -5 8 0" stroke="var(--chalk)" stroke-width="3" fill="none"/>
    <path d="M-8 -104 q8 7 16 0" stroke="var(--chalk)" stroke-width="3" fill="none"/>
    <path d="M-48 0 Q-48 -78 0 -80 Q48 -78 48 0 Z" fill="none" stroke="var(--chalk)" stroke-width="5"/>
    <rect x="-34" y="-60" width="68" height="26" rx="6" fill="var(--yellow)"/>
    <text x="0" y="-41" text-anchor="middle" class="t-body" style="font-size:17px;font-weight:700;fill:var(--board-deep)">導演</text>
  </g>`;
}
function helper(x,y,color,label,o=1,s=1,tag=''){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}">
    <line x1="0" y1="-62" x2="0" y2="-82" stroke="${color}" stroke-width="4"/>
    <circle cx="0" cy="-86" r="7" fill="${color}"/>
    <rect x="-46" y="-62" width="92" height="74" rx="18" fill="none" stroke="${color}" stroke-width="5"/>
    <circle cx="-16" cy="-28" r="7" fill="${color}"/><circle cx="16" cy="-28" r="7" fill="${color}"/>
    <path d="M-12 -8 q12 8 24 0" stroke="${color}" stroke-width="3.5" fill="none"/>
    <text x="0" y="44" text-anchor="middle" class="t-chalk" style="font-size:26px;fill:${color}">${esc(label)}</text>
    ${tag?`<text x="0" y="72" text-anchor="middle" class="t-body" style="font-size:17px;fill:var(--chalk-dim)">${esc(tag)}</text>`:''}
  </g>`;
}
function card(x,y,w,h,title,body,o=1,color='var(--chalk)'){
  return `<g transform="translate(${x} ${y})" opacity="${o}">
    <rect x="0" y="0" width="${w}" height="${h}" rx="10" fill="rgba(239,233,216,.06)" stroke="${color}" stroke-width="3" stroke-dasharray="2 0"/>
    <text x="22" y="40" class="t-body" style="font-size:20px;fill:var(--chalk-dim)">${esc(title)}</text>
    <text x="22" y="${h-28}" class="t-chalk" style="font-size:32px;fill:${color}">${esc(body)}</text>
  </g>`;
}
function doc(x,y,o=1,s=1,rot=0){
  let lines='';
  for(let i=0;i<5;i++) lines+=`<line x1="18" y1="${36+i*22}" x2="${i===4?70:102}" y2="${36+i*22}" stroke="var(--chalk-dim)" stroke-width="4"/>`;
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity="${o}">
    <path d="M0 0 H96 L120 24 V150 H0 Z" fill="var(--board)" stroke="var(--chalk)" stroke-width="4"/>
    <text x="18" y="26" class="t-body" style="font-size:15px;fill:var(--yellow)">教案</text>${lines}
  </g>`;
}
function stamp(x,y,text,color,o,s,rot=-12){
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity="${o}">
    <rect x="-110" y="-38" width="220" height="76" rx="10" fill="none" stroke="${color}" stroke-width="6"/>
    <text x="0" y="14" text-anchor="middle" class="t-chalk" style="font-size:40px;font-weight:700;fill:${color}">${esc(text)}</text>
  </g>`;
}

// ===== 時間表（秒）=====
window.DURATION = 110;
const SEGS = [
  {a:0,  b:11,  name:'Harness 是什麼', cap:'模型是引擎，<b>Harness 是駕駛艙</b>：上下文、工具、護欄、狀態、驗證都在這裡。'},
  {a:11, b:22,  name:'先分類',         cap:'不是每件事都走完整流程：<b>簡單、標準、複雜</b>三條路，驗證的份量不同。'},
  {a:22, b:33,  name:'翻筆記',         cap:'動工前先查<b>錯誤紀錄與知識庫</b>；hook 每回合自動送上相關教訓。'},
  {a:33, b:44,  name:'路線圖',         cap:'每個節點寫明<b>做什麼、誰做、狀態</b>，由上而下畫成拓樸圖。'},
  {a:44, b:55,  name:'老師核准',       cap:'<b>老師的決定是最高權限</b>；AI 只提建議，核准後才動工。'},
  {a:55, b:66,  name:'派工',           cap:'<b>Claude 規劃、Codex 動手、AGY 審查</b>：腦、手、眼分開。'},
  {a:66, b:77,  name:'驗證',           cap:'review-loop 先跑檢查再外審；<b>沒有收據，就寫「審查未完成」</b>。'},
  {a:77, b:88,  name:'被糾正就記下',   cap:'被糾正的事寫進錯誤紀錄，<b>下次開工自動提醒</b>，形成循環。'},
  {a:88, b:99,  name:'交接',           cap:'額度快滿就寫交接檔給 Pi；接回時<b>先核對證據</b>，不聽口頭的「已完成」。'},
  {a:99, b:110, name:'結語',           cap:'<b>規則寫在檔案裡，由程式提醒</b>，老師保有決定權。'}
];
// ===== 共用小元件 =====
const box=(x,y,w,h,o=1,stroke='var(--chalk-dim)',fill='rgba(239,233,216,.04)',r=10)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3" opacity="${o}"/>`;
const txt=(x,y,s,size=26,fill='var(--chalk)',cls='t-chalk',extra='')=>`<text x="${x}" y="${y}" class="${cls}" style="font-size:${size}px;fill:${fill}" ${extra}>${esc(s)}</text>`;
const ctxt=(x,y,s,size=26,fill='var(--chalk)',cls='t-chalk',extra='')=>txt(x,y,s,size,fill,cls,`text-anchor="middle" ${extra}`);
const arrow=(x1,y1,x2,y2,o=1,col='var(--chalk)')=>{const a=Math.atan2(y2-y1,x2-x1),h=16;return `<g opacity="${o}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="4"/><path d="M${x2} ${y2} L${x2-h*Math.cos(a-0.45)} ${y2-h*Math.sin(a-0.45)} M${x2} ${y2} L${x2-h*Math.cos(a+0.45)} ${y2-h*Math.sin(a+0.45)}" stroke="${col}" stroke-width="4" fill="none"/></g>`};
const title=(s,u,col='var(--chalk)')=>ctxt(800,110,s,46,col,'t-chalk',`opacity="${ease(P(u,0.1,0.8))}"`);
// ===== 各段畫面（u＝本段經過秒數）=====
function h1(u){
  let g=title('Harness：AI 的駕駛艙',u);
  const e=ease(P(u,0.6,1.6));
  g+=`<g opacity="${e}"><circle cx="800" cy="480" r="110" fill="rgba(242,193,78,.1)" stroke="var(--yellow)" stroke-width="5"/>${ctxt(800,470,'模型',44,'var(--yellow)')}${ctxt(800,515,'（引擎）',24,'var(--chalk-dim)','t-body')}</g>`;
  const parts=[['上下文','給它看的資料'],['工具','能做的動作'],['護欄','不能做的事'],['狀態','做到哪裡'],['驗證','做得對不對']];
  parts.forEach((p,i)=>{
    const o=ease(P(u,2+i*1.1,2.7+i*1.1)),a=-Math.PI/2+i*2*Math.PI/5,x=800+Math.cos(a)*300,y=480+Math.sin(a)*250;
    g+=`<g opacity="${o}"><line x1="${800+Math.cos(a)*115}" y1="${480+Math.sin(a)*115}" x2="${x-Math.cos(a)*90}" y2="${y-Math.sin(a)*45}" stroke="var(--chalk-dim)" stroke-width="3" stroke-dasharray="6 8"/>
      ${box(x-120,y-48,240,96,1,'var(--chalk)','var(--board)',14)}${ctxt(x,y-6,p[0],32)}${ctxt(x,y+30,p[1],20,'var(--chalk-dim)','t-body')}</g>`;
  });
  return g;
}
function h2(u){
  let g=title('先分類：三條路',u);
  const L=[['簡單','直接做，可不另外驗證',300,'var(--green)'],['標準','做完最後驗證一次',560,'var(--yellow)'],['複雜','關鍵節點都驗證',820,'var(--orange)']];
  L.forEach((l,i)=>{const o=ease(P(u,0.8+i*0.6,1.4+i*0.6)),y=260+i*190;
    g+=`<g opacity="${o}">${txt(160,y+12,l[0],40,l[3])}<line x1="300" y1="${y}" x2="${300+l[2]}" y2="${y}" stroke="${l[3]}" stroke-width="6"/>${txt(320,y+56,l[1],26,'var(--chalk-dim)','t-body')}`;
    for(let k=1;k<=i+1;k++) g+=`<circle cx="${300+l[2]*k/(i+2)}" cy="${y}" r="12" fill="var(--board)" stroke="${l[3]}" stroke-width="5"/>`;
    g+=`<path d="M${300+l[2]} ${y} l-14 -10 v20 Z" fill="${l[3]}"/></g>`;
  });
  const f=ease(P(u,3.5,6)),lane=1,cy=lerp(180,260+lane*190-46,f);
  g+=`<g transform="translate(${lerp(1300,1250,f)} ${cy})" opacity="${ease(P(u,3,3.5))}">${box(-110,-34,220,68,1,'var(--yellow)','var(--board)',12)}${ctxt(0,10,'新任務',28,'var(--yellow)')}</g>`;
  g+=ctxt(1250,cy+80,'→ 標準',26,'var(--yellow)','t-chalk',`opacity="${ease(P(u,6,6.8))}"`);
  return g;
}
function h3(u){
  let g=title('動工前先翻筆記',u);
  const o=ease(P(u,0.6,1.4));
  g+=`<g opacity="${o}">${box(200,250,420,400,1,'var(--chalk)','rgba(239,233,216,.05)',14)}${ctxt(410,310,'brain／筆記庫',32,'var(--yellow)')}
    ${txt(240,380,'錯誤紀錄（被糾正的事）',24,'var(--chalk)','t-body')}${txt(240,430,'知識庫（做法）',24,'var(--chalk)','t-body')}${txt(240,480,'技能（Skill）',24,'var(--chalk)','t-body')}</g>`;
  g+=arrow(640,450,900,450,ease(P(u,2.5,3.3)),'var(--yellow)')+ctxt(770,425,'hook 自動送上',22,'var(--yellow)','t-body',`opacity="${ease(P(u,3,3.6))}"`);
  const n=ease(P(u,4,5));
  g+=`<g opacity="${n}">${box(920,300,500,300,1,'var(--yellow)','rgba(242,193,78,.08)',14)}${txt(950,350,'【與這次提問相關的過往教訓】',24,'var(--yellow)','t-body')}
    ${txt(950,410,'・被糾正：對話標題沒改',26)}${txt(950,460,'・之後：開工先改標題',26)}${txt(950,530,'視為硬約束，先讀再做',24,'var(--chalk-dim)','t-body')}</g>`;
  return g;
}
function h4(u){
  let g=title('畫出路線圖',u);
  const N=[['P0','規劃路線','主 agent','已執行','var(--green)'],['P1','實作','Codex','已執行','var(--green)'],['P2','外部審查','AGY','未執行','var(--chalk-dim)'],['W1','等待老師決定','主 agent','未執行','var(--chalk-dim)']];
  N.forEach((n,i)=>{const o=ease(P(u,0.6+i*1.2,1.2+i*1.2)),y=190+i*160;
    g+=`<g opacity="${o}">${box(360,y,880,100,1,'var(--chalk)','rgba(239,233,216,.05)',12)}${txt(390,y+62,n[0],36,'var(--yellow)')}${txt(490,y+62,n[1],34)}${txt(800,y+62,n[2],26,'var(--chalk-dim)','t-body')}
      ${box(1040,y+28,170,46,1,n[4],'rgba(239,233,216,.04)',23)}${ctxt(1125,y+60,n[3],22,n[4],'t-body')}</g>`;
    if(i<3) g+=arrow(420,y+100,420,y+156,ease(P(u,1.2+i*1.2,1.6+i*1.2)),'var(--chalk-dim)');
  });
  g+=txt(1260,870,'每完成一個節點，立刻回寫狀態',22,'var(--chalk-dim)','t-body',`text-anchor="end" opacity="${ease(P(u,6,7))}"`);
  return g;
}
function h5(u){
  let g=title('老師核准，才動工',u);
  const ok=P(u,5.5,6.1),col=ok>0?'var(--green)':'var(--yellow)',pulse=ok>0?1:1+0.06*Math.sin(u*6);
  g+=helper(420,520,'var(--orange)','AI：建議',ease(P(u,0.6,1.4)));
  g+=box(260,250,320,120,ease(P(u,1.2,2)),'var(--orange)','rgba(232,135,91,.08)',12)+ctxt(420,300,'建議這樣做',28,'var(--orange)','t-chalk',`opacity="${ease(P(u,1.2,2))}"`)+ctxt(420,340,'（等待核准）',22,'var(--chalk-dim)','t-body',`opacity="${ease(P(u,1.2,2))}"`);
  g+=`<g transform="translate(800 470) scale(${pulse})" opacity="${ease(P(u,2,2.8))}"><path d="M0 -80 L150 0 L0 80 L-150 0 Z" fill="var(--board)" stroke="${col}" stroke-width="7"/>${ctxt(0,12,ok>0?'核准':'老師決定',36,col)}</g>`;
  g+=teacher(1180,620,ease(P(u,2.6,3.4)));
  g+=ctxt(800,780,'使用者意見是流程、範圍、取捨與停止的最高權限',28,'var(--yellow)','t-chalk',`opacity="${ease(P(u,7,8))}"`);
  return g;
}
function h6(u){
  let g=title('派工：腦、手、眼',u);
  [['腦','Claude','規劃、審查判斷','var(--orange)',400],['手','Codex','寫程式、搬資料','var(--blue)',800],['眼','AGY','大量閱讀、獨立審查','var(--green)',1200]].forEach((r,i)=>{
    const o=ease(P(u,0.8+i*1.2,1.5+i*1.2));
    g+=`<g opacity="${o}">${ctxt(r[4],230,r[0],56,r[3])}</g>`+helper(r[4],430,r[3],r[1],o)+`<g opacity="${o}">${ctxt(r[4],560,r[2],26,'var(--chalk-dim)','t-body')}</g>`;
  });
  g+=`<g opacity="${ease(P(u,5.5,6.5))}">${box(310,650,980,90,1,'var(--yellow)','rgba(242,193,78,.08)',12)}${ctxt(800,706,'計畫寫明每個節點交給誰；老師核准計畫＝授權派工',28,'var(--yellow)')}</g>`;
  return g;
}
function h7(u){
  let g=title('驗證：review-loop',u);

const RENDER=[h1,h2,h3,h4,h5,h6,h7,h8,h9,h10].map(fn=>(t,s)=>fn(t-s.a));

// ===== 契約：window.seek(t) =====
const stage=document.getElementById('stage');
const capEl=document.getElementById('caption');
function segIndex(t){for(let i=SEGS.length-1;i>=0;i--) if(t>=SEGS[i].a) return i; return 0}
window.seek=async function(t){
  t=clamp(t,0,window.DURATION);
  const i=segIndex(t), s=SEGS[i];
  const o=sceneOpacity(t,s,i===SEGS.length-1);
  stage.innerHTML=`<g opacity="${o}">${RENDER[i](t,s)}</g>
    <text x="1560" y="870" text-anchor="end" class="t-body" style="font-size:20px;fill:var(--chalk-dim)">${i+1} / ${SEGS.length}・${esc(s.name)}</text>`;
  capEl.innerHTML=s.cap;
  return true;
};
window.ready=document.fonts?document.fonts.ready.catch(()=>null):Promise.resolve();

// ===== 播放器外殼（只負責呼叫 seek）=====
const playBtn=document.getElementById('play'), scrub=document.getElementById('scrub'), timeEl=document.getElementById('time');
const chap=document.getElementById('chapters');
let cur=0, playing=false, last=0;
SEGS.forEach((s,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.textContent=`${i+1}・${s.name}`;b.onclick=()=>{pause();show(s.a)};li.appendChild(b);chap.appendChild(li)});
function show(t){
  cur=clamp(t,0,window.DURATION);scrub.value=cur;
  timeEl.textContent=`${cur.toFixed(1)} / ${window.DURATION.toFixed(1)}`;
  window.seek(cur);
  const i=segIndex(cur);[...chap.querySelectorAll('button')].forEach((b,j)=>b.setAttribute('aria-current',j===i?'true':'false'));
}
function frame(now){if(!playing)return;cur+=(now-last)/1000;last=now;if(cur>=window.DURATION){cur=window.DURATION;pause()}show(cur);if(playing)requestAnimationFrame(frame)}
function play(){if(cur>=window.DURATION-0.05)cur=0;playing=true;playBtn.textContent='暫停';last=performance.now();requestAnimationFrame(frame)}
function pause(){playing=false;playBtn.textContent='播放'}
playBtn.onclick=()=>playing?pause():play();
scrub.oninput=()=>{pause();show(parseFloat(scrub.value))};
document.getElementById('prev').onclick=()=>{poster=false;pause();const i=segIndex(cur-0.6);show(SEGS[i].a)};
document.getElementById('next').onclick=()=>{poster=false;pause();const i=segIndex(cur)+1;show(i<SEGS.length?SEGS[i].a:window.DURATION)};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.key!==' ')return;
  if(e.key===' '&&e.target.tagName==='BUTTON'&&e.target!==playBtn)return;
  if(e.key===' '){e.preventDefault();playBtn.click()}
  else if(e.key==='ArrowRight'){document.getElementById('next').click()}
  else if(e.key==='ArrowLeft'){document.getElementById('prev').click()}
});
// 開啟時先停在開場完成的畫面（不自動播放），按播放從頭開始
let poster=true;
const POSTER_T=7.6;
show(POSTER_T);
playBtn.onclick=()=>{if(poster){poster=false;cur=0}playing?pause():play()};
scrub.addEventListener('input',()=>{poster=false});
chap.addEventListener('click',()=>{poster=false});
window.ready.then(()=>show(cur));
</script>
